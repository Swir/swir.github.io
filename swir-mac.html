<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SWIR Classic Mac</title><style>:root{color-scheme:light;--ink:#111;--paper:#f4f4f0}*{box-sizing:border-box}body{margin:0;background:#cfcfc8;color:var(--ink);font-family:Geneva,Arial,sans-serif;min-height:100vh}.menu{height:30px;background:#f7f7f3;border-bottom:2px solid #111;display:flex;align-items:center;gap:18px;padding:0 12px;font-size:13px}.menu b{font-weight:900}.desktop{position:relative;height:calc(100vh - 30px);background:repeating-linear-gradient(45deg,#ddd 0 1px,#cfcfc8 1px 3px);overflow:hidden}.icons{position:absolute;right:18px;top:18px;display:grid;gap:16px}.icon{width:76px;text-align:center;font-size:12px;cursor:pointer;background:transparent;border:0}.pic{width:48px;height:48px;margin:auto;border:2px solid #111;background:#fff;display:grid;place-items:center;font-weight:900}.win{position:absolute;left:8%;top:8%;width:min(760px,82vw);height:min(560px,75vh);background:var(--paper);border:2px solid #111;box-shadow:5px 5px 0 #666;display:none}.win.open{display:flex;flex-direction:column}.title{height:30px;border-bottom:2px solid #111;display:flex;justify-content:space-between;align-items:center;padding:0 8px;background:repeating-linear-gradient(0deg,#fff 0 2px,#111 2px 3px)}.title span{background:#fff;padding:0 10px;font-weight:700}.title button{width:20px;height:20px;border:2px solid #111;background:#fff}.body{flex:1;padding:14px;overflow:auto}.note{width:100%;height:100%;resize:none;border:1px solid #111;padding:10px;font:14px/1.5 Monaco,monospace;background:#fff}.paint{display:grid;grid-template-rows:auto 1fr;height:100%;gap:10px}.tools{display:flex;gap:8px}.tools button{padding:6px 10px;border:2px solid #111;background:#fff}.canvaswrap{border:2px solid #111;background:#fff;overflow:hidden}.canvaswrap canvas{width:100%;height:100%;touch-action:none}.about{font:14px/1.6 Monaco,monospace}.clock{position:absolute;left:16px;bottom:14px;background:#fff;border:2px solid #111;padding:8px 10px;font:12px Monaco,monospace}@media(max-width:700px){.win{left:2%;top:2%;width:96vw;height:88vh}.icons{right:8px}}</style></head><body><header class="menu"><b>◆ SWIR</b><span>File</span><span>Edit</span><span>View</span><span>Special</span><span id="mclock"></span></header><main class="desktop"><div class="icons"><button class="icon" data-app="notes"><div class="pic">N</div>Notes</button><button class="icon" data-app="paint"><div class="pic">P</div>Paint</button><button class="icon" data-app="about"><div class="pic">i</div>About</button></div><div class="clock" id="clock"></div><section class="win" id="notes"><div class="title"><span>SWIR Notes</span><button data-close>×</button></div><div class="body"><textarea id="note" class="note" placeholder="Write something..."></textarea></div></section><section class="win" id="paint"><div class="title"><span>SWIR Paint</span><button data-close>×</button></div><div class="body paint"><div class="tools"><button id="clear">Clear</button><button id="black">Black</button><button id="white">Eraser</button></div><div class="canvaswrap"><canvas id="cv" width="900" height="520"></canvas></div></div></section><section class="win" id="about"><div class="title"><span>About SWIR Classic Mac</span><button data-close>×</button></div><div class="body about"><h2>SWIR Classic Mac</h2><p>Original monochrome desktop module written for SWIR OS.</p><p>Built-in apps: Notes, Paint, About.</p><p>No old Mac folder or ROM is loaded.</p></div></section></main><script>const wins=[...document.querySelectorAll('.win')];function openApp(id){wins.forEach(w=>w.classList.remove('open'));document.getElementById(id)?.classList.add('open')}document.addEventListener('click',e=>{const a=e.target.closest('[data-app]');if(a)openApp(a.dataset.app);if(e.target.closest('[data-close]'))e.target.closest('.win').classList.remove('open')});const note=document.getElementById('note');note.value=localStorage.getItem('swir-mac-note')||'';note.addEventListener('input',()=>localStorage.setItem('swir-mac-note',note.value));function tick(){const d=new Date(),s=d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});clock.textContent=d.toLocaleDateString()+' '+s;mclock.textContent=s}tick();setInterval(tick,1000);const cv=document.getElementById('cv'),ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);let down=false,color='#111';function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height}}cv.addEventListener('pointerdown',e=>{down=true;const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);cv.setPointerCapture(e.pointerId)});cv.addEventListener('pointermove',e=>{if(!down)return;const p=pos(e);ctx.strokeStyle=color;ctx.lineWidth=color==='#fff'?18:3;ctx.lineCap='round';ctx.lineTo(p.x,p.y);ctx.stroke()});cv.addEventListener('pointerup',()=>down=false);clear.onclick=()=>{ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height)};black.onclick=()=>color='#111';white.onclick=()=>color='#fff';</script></body></html>
