<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SWIR Network Center</title><style>
:root{color-scheme:dark;--line:rgba(69,205,255,.2);--accent:#35e6ff;--ok:#50e3a4;--warn:#ffca72;--bad:#ff718c;--muted:#7899ad}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 80% 0,#102a42,transparent 34%),linear-gradient(145deg,#020812,#071522 55%,#020a13);color:#eefaff;font-family:Inter,Segoe UI,Arial,sans-serif}body{padding:18px}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;margin-bottom:16px}.k{font:900 9px ui-monospace,Consolas,monospace;letter-spacing:.16em;color:var(--accent)}h1{margin:5px 0 0;font-size:clamp(30px,5vw,50px);letter-spacing:-.04em}.btn{border:1px solid var(--line);border-radius:10px;background:#ffffff07;color:white;padding:9px 11px;cursor:pointer;font:900 9px ui-monospace,Consolas,monospace}.btn:hover{border-color:#35e6ff88}.statusline{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.card,.panel{padding:14px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,#0b1f34c8,#05111fba)}.label{color:#7092a7;font:800 8px ui-monospace,Consolas,monospace;letter-spacing:.1em}.value{font-size:18px;font-weight:850;margin-top:7px}.value.ok{color:var(--ok)}.value.bad{color:var(--bad)}.small{color:var(--muted);font:9px/1.55 ui-monospace,Consolas,monospace;margin-top:5px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:12px;margin-top:12px}.panel h2{margin:0 0 10px;font-size:14px}.profiles{display:grid;gap:8px}.profile{padding:12px;border:1px solid #ffffff0d;border-radius:13px;background:#ffffff04}.profile.active{border-color:#50e3a444;background:#50e3a408}.ptop{display:flex;justify-content:space-between;gap:8px}.ptop strong{font-size:12px}.badge{font:900 8px ui-monospace,Consolas,monospace;color:var(--ok)}.meta{color:var(--muted);font:9px/1.5 ui-monospace,Consolas,monospace;margin-top:6px}.actions{display:flex;gap:7px;margin-top:9px}.actions .btn{flex:1}.field{margin-bottom:10px}.field label{display:block;color:#7394a8;font:800 8px ui-monospace,Consolas,monospace;margin-bottom:5px}.input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#03101d;color:white;outline:none}.input:focus,select:focus{border-color:#35e6ff88}.note{margin-top:12px;padding:11px;border:1px solid rgba(255,202,114,.22);border-radius:12px;background:#ffca7208;color:#d4bd89;font:9px/1.55 ui-monospace,Consolas,monospace}@media(max-width:760px){body{padding:10px}.layout{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}}
</style></head><body><header class="head"><div><div class="k">SWIR OS 1.5 // NETWORK CORE</div><h1>Network Center</h1></div><button id="refresh" class="btn">REFRESH</button></header><section id="statusline" class="statusline"></section><div class="layout"><section class="panel"><h2>Network profiles</h2><div id="profiles" class="profiles"></div><div class="note">WEB EDITION cannot scan or connect to real Wi‑Fi networks. These are portable SWIR network profiles. Desktop/System editions can map them to native network adapters later.</div></section><aside class="panel"><h2>Create profile</h2><div class="field"><label>PROFILE NAME</label><input id="name" class="input" maxlength="32" placeholder="Home Wi-Fi"></div><div class="field"><label>TYPE</label><select id="type"><option value="wifi">Wi-Fi</option><option value="ethernet">Ethernet</option><option value="mobile">Mobile</option><option value="vpn">VPN</option></select></div><div class="field"><label>NOTES</label><input id="notes" class="input" maxlength="80" placeholder="Optional description"></div><button id="add" class="btn" style="width:100%">ADD PROFILE</button></aside></div><script>
(()=>{'use strict';const $=s=>document.querySelector(s);const api=()=>{try{return parent.SwirPlatform}catch{return null}};async function readProfiles(){const p=api();await p.ready;const list=await p.settings.get('network.profiles',[]);return Array.isArray(list)?list:[]}async function saveProfiles(list){await api().settings.set('network.profiles',list)}function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function connection(){return navigator.connection||navigator.mozConnection||navigator.webkitConnection||null}async function render(){const c=connection(),online=navigator.onLine;statusline.innerHTML=`<article class="card"><div class="label">LINK STATE</div><div class="value ${online?'ok':'bad'}">${online?'ONLINE':'OFFLINE'}</div><div class="small">Browser connectivity state</div></article><article class="card"><div class="label">EFFECTIVE TYPE</div><div class="value">${esc(c?.effectiveType?.toUpperCase()||'UNKNOWN')}</div><div class="small">Browser Network Information API</div></article><article class="card"><div class="label">DOWNLINK</div><div class="value">${c?.downlink!=null?esc(c.downlink+' Mbps'):'N/A'}</div><div class="small">Estimated value when available</div></article><article class="card"><div class="label">LATENCY</div><div class="value">${c?.rtt!=null?esc(c.rtt+' ms'):'N/A'}</div><div class="small">Approximate RTT reported by browser</div></article>`;const list=await readProfiles(),active=await api().settings.get('network.activeProfile',null);profiles.innerHTML=list.length?list.map(p=>`<article class="profile ${p.id===active?'active':''}"><div class="ptop"><strong>${esc(p.name)}</strong><span class="badge">${p.id===active?'ACTIVE':esc(p.type.toUpperCase())}</span></div><div class="meta">TYPE=${esc(p.type.toUpperCase())}<br>${esc(p.notes||'No notes')}</div><div class="actions"><button class="btn" data-use="${p.id}">SET ACTIVE</button><button class="btn" data-del="${p.id}">DELETE</button></div></article>`).join(''):'<div class="small">NO NETWORK PROFILES YET</div>'}add.onclick=async()=>{const n=name.value.trim();if(n.length<2)return;const list=await readProfiles();list.push({id:'net-'+Date.now().toString(36),name:n,type:type.value,notes:notes.value.trim(),createdAt:Date.now()});await saveProfiles(list);name.value='';notes.value='';render()};document.addEventListener('click',async e=>{const use=e.target.closest('[data-use]');if(use){await api().settings.set('network.activeProfile',use.dataset.use);render();parent.postMessage({type:'SWIR_NETWORK_CHANGED'},location.origin)}const del=e.target.closest('[data-del]');if(del){const list=(await readProfiles()).filter(x=>x.id!==del.dataset.del);await saveProfiles(list);const active=await api().settings.get('network.activeProfile',null);if(active===del.dataset.del)await api().settings.remove('network.activeProfile');render()}});refresh.onclick=render;addEventListener('online',render);addEventListener('offline',render);connection()?.addEventListener?.('change',render);render()})();
</script></body></html>
