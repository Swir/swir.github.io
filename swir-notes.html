<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SWIR Notes</title><style>:root{color-scheme:dark;--bg:#050c16;--panel:#081626;--line:rgba(105,201,255,.18);--text:#ecf8ff;--muted:#7f9db2;--accent:#55e6c1;--danger:#ff6b81}*{box-sizing:border-box}html,body{margin:0;height:100%;background:linear-gradient(145deg,#030914,#071525 55%,#03101b);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif;overflow:hidden}button,input,textarea{font:inherit}.app{display:grid;grid-template-columns:230px 1fr;height:100%}.side{border-right:1px solid var(--line);background:rgba(3,12,22,.78);display:flex;flex-direction:column;min-width:0}.side-head{padding:14px;border-bottom:1px solid var(--line)}.side-head strong{font:900 13px ui-monospace,Consolas,monospace;color:var(--accent)}.side-head p{font-size:10px;color:var(--muted);margin:5px 0 10px}.btn{border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.035);color:#dff6ff;padding:8px 10px;cursor:pointer;font:800 10px ui-monospace,Consolas,monospace}.btn:hover{border-color:rgba(85,230,193,.45);background:rgba(85,230,193,.07)}.list{padding:8px;overflow:auto;flex:1}.note{width:100%;text-align:left;padding:10px;border:1px solid transparent;border-radius:10px;background:transparent;color:#dcecf7;cursor:pointer;margin-bottom:4px}.note:hover,.note.active{background:rgba(85,230,193,.07);border-color:rgba(85,230,193,.15)}.note strong,.note span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.note strong{font-size:11px}.note span{font-size:9px;color:var(--muted);margin-top:4px}.editor{display:grid;grid-template-rows:auto 1fr auto;min-width:0}.top{display:flex;gap:8px;padding:10px;border-bottom:1px solid var(--line);align-items:center}.title{flex:1;border:0;background:transparent;color:white;font-size:18px;font-weight:800;outline:none;min-width:0}.body{width:100%;height:100%;border:0;resize:none;background:transparent;color:#dbeaf4;padding:18px;outline:none;font:14px/1.7 ui-monospace,Consolas,monospace}.foot{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;border-top:1px solid var(--line);color:#69899f;font:9px ui-monospace,Consolas,monospace}.empty{display:grid;place-items:center;height:100%;color:var(--muted);text-align:center;padding:20px}@media(max-width:650px){.app{grid-template-columns:110px 1fr}.side-head p{display:none}.side-head{padding:9px}.btn{padding:7px}.note{padding:8px}.note span{display:none}.body{padding:12px}}</style></head><body><div class="app"><aside class="side"><div class="side-head"><strong>SWIR NOTES</strong><p>Autosaved locally in this browser.</p><button id="newNote" class="btn">+ NEW NOTE</button></div><div id="list" class="list"></div></aside><main class="editor"><div class="top"><input id="title" class="title" placeholder="Untitled note"><button id="exportBtn" class="btn">EXPORT</button><button id="deleteBtn" class="btn">DELETE</button></div><textarea id="body" class="body" placeholder="Start typing..."></textarea><div class="foot"><span id="status">READY</span><span id="count">0 chars</span></div></main></div><script>
const KEY='swir-notes-v12';const $=s=>document.querySelector(s);let notes=read(),active=notes[0]?.id||null,saveTimer=null;
function read(){try{const v=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(v)?v:[]}catch{return[]}}
function persist(){localStorage.setItem(KEY,JSON.stringify(notes));}
function id(){return'n-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7)}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function ensure(){if(!notes.length){const n={id:id(),title:'Welcome to SWIR Notes',body:'SWIR OS 1.2 notes are stored locally in this browser.\n\nCreate, edit and export your notes anytime.',created:Date.now(),updated:Date.now()};notes=[n];active=n.id;persist()}}
function current(){return notes.find(n=>n.id===active)}
function renderList(){const host=$('#list');host.innerHTML=notes.sort((a,b)=>b.updated-a.updated).map(n=>`<button class="note ${n.id===active?'active':''}" data-id="${n.id}"><strong>${esc(n.title||'Untitled')}</strong><span>${new Date(n.updated).toLocaleString()}</span></button>`).join('')}
function load(){ensure();const n=current()||notes[0];if(!n)return;active=n.id;$('#title').value=n.title||'';$('#body').value=n.body||'';$('#count').textContent=(n.body||'').length+' chars';renderList()}
function scheduleSave(){clearTimeout(saveTimer);$('#status').textContent='SAVING...';saveTimer=setTimeout(()=>{const n=current();if(!n)return;n.title=$('#title').value.trim()||'Untitled';n.body=$('#body').value;n.updated=Date.now();persist();renderList();$('#status').textContent='SAVED';$('#count').textContent=n.body.length+' chars';setTimeout(()=>$('#status').textContent='READY',1000)},250)}
$('#newNote').onclick=()=>{const n={id:id(),title:'Untitled',body:'',created:Date.now(),updated:Date.now()};notes.unshift(n);active=n.id;persist();load();$('#title').select()};
$('#deleteBtn').onclick=()=>{const n=current();if(!n)return;if(notes.length===1){n.title='Untitled';n.body='';n.updated=Date.now();persist();load();return}if(confirm(`Delete “${n.title||'Untitled'}”?`)){notes=notes.filter(x=>x.id!==n.id);active=notes[0]?.id||null;persist();load()}};
$('#exportBtn').onclick=()=>{const n=current();if(!n)return;const blob=new Blob([n.body||''],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(n.title||'note').replace(/[\\/:*?"<>|]/g,'_')+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};
$('#list').onclick=e=>{const b=e.target.closest('[data-id]');if(!b)return;active=b.dataset.id;load()};$('#title').addEventListener('input',scheduleSave);$('#body').addEventListener('input',scheduleSave);window.addEventListener('beforeunload',()=>{clearTimeout(saveTimer);const n=current();if(n){n.title=$('#title').value.trim()||'Untitled';n.body=$('#body').value;n.updated=Date.now();persist()}});ensure();load();
</script></body></html>
