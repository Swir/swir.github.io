<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SWIR Amp</title><style>:root{color-scheme:dark;--a:#ffb347;--l:rgba(255,179,71,.22)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#050505,#121212);color:#f5f5f5;font-family:Inter,Segoe UI,Arial;min-height:100vh;display:grid;place-items:center;padding:20px}.player{width:min(760px,96vw);border:1px solid var(--l);border-radius:24px;background:#0c0c0c;box-shadow:0 30px 90px #0008;overflow:hidden}.head{padding:16px 18px;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;letter-spacing:.1em}.brand span{color:var(--a)}.main{padding:20px}.display{border:1px solid #272727;border-radius:16px;background:#050505;padding:18px;font-family:Consolas,monospace}.title{font-size:20px;color:var(--a);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{color:#777;margin-top:6px;font-size:12px}.progress{height:8px;background:#202020;border-radius:99px;overflow:hidden;margin:18px 0}.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff8c42,var(--a))}.controls{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.btn{padding:12px;border:1px solid #2b2b2b;background:#151515;color:white;border-radius:11px;cursor:pointer}.btn:hover{border-color:var(--a);color:var(--a)}.vol{display:flex;align-items:center;gap:10px;margin-top:14px;color:#888;font-size:12px}.vol input{flex:1}.drop{margin-top:16px;border:1px dashed #343434;border-radius:14px;padding:16px;text-align:center;color:#777}.drop.drag{border-color:var(--a);color:var(--a)}input[type=file]{display:none}.foot{padding:10px 18px;border-top:1px solid #222;color:#666;font:10px Consolas,monospace}</style></head><body><section class="player"><header class="head"><div class="brand">SWIR <span>AMP</span></div><div id="clock">--:--</div></header><main class="main"><div class="display"><div class="title" id="title">ding.mp3</div><div class="meta" id="meta">SYSTEM SOUND • READY</div><div class="progress"><span id="bar"></span></div><div id="time" class="meta">00:00 / 00:00</div></div><div class="controls"><button class="btn" id="prev">⏮</button><button class="btn" id="play">▶</button><button class="btn" id="pause">⏸</button><button class="btn" id="stop">■</button><button class="btn" id="pick">＋ FILE</button></div><div class="vol"><span>VOL</span><input id="vol" type="range" min="0" max="1" step="0.01" value="0.7"></div><div id="drop" class="drop">Drop an audio file here or press + FILE</div><input id="file" type="file" accept="audio/*"></main><footer class="foot">SWIR AMP // NATIVE AUDIO MODULE // LOCAL FILES STAY LOCAL</footer></section><audio id="audio" src="./ding.mp3"></audio><script>const a=audio,f=file,titleEl=title,metaEl=meta,barEl=bar,timeEl=time,dropEl=drop;let objectUrl=null;function fmt(s){if(!isFinite(s))return'00:00';s=Math.floor(s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function sync(){barEl.style.width=(a.duration?Math.min(100,a.currentTime/a.duration*100):0)+'%';timeEl.textContent=fmt(a.currentTime)+' / '+fmt(a.duration)}a.addEventListener('timeupdate',sync);a.addEventListener('loadedmetadata',sync);play.onclick=()=>a.play().catch(()=>{});pause.onclick=()=>a.pause();stop.onclick=()=>{a.pause();a.currentTime=0;sync()};prev.onclick=()=>{a.currentTime=0;sync()};vol.oninput=()=>a.volume=vol.value;a.volume=vol.value;pick.onclick=()=>f.click();function loadFile(file){if(!file||!file.type.startsWith('audio/'))return;if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(file);a.src=objectUrl;titleEl.textContent=file.name;metaEl.textContent=(file.type||'AUDIO').toUpperCase()+' • LOCAL FILE';a.play().catch(()=>{})}f.onchange=()=>loadFile(f.files[0]);['dragenter','dragover'].forEach(ev=>dropEl.addEventListener(ev,e=>{e.preventDefault();dropEl.classList.add('drag')}));['dragleave','drop'].forEach(ev=>dropEl.addEventListener(ev,e=>{e.preventDefault();dropEl.classList.remove('drag')}));dropEl.addEventListener('drop',e=>loadFile(e.dataTransfer.files[0]));setInterval(()=>clock.textContent=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),1000);clock.textContent=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});</script></body></html>
