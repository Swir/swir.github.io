<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF Viewer</title><style>
:root{color-scheme:dark;--a:#ff718c;--line:rgba(255,113,140,.22);--muted:#8599aa}*{box-sizing:border-box}html,body{margin:0;height:100%;background:#050914;color:#fff1f4;font-family:Inter,Segoe UI,Arial}button{font:inherit}.app{height:100%;display:grid;grid-template-rows:50px 1fr 27px}.bar{display:flex;align-items:center;gap:8px;padding:8px;border-bottom:1px solid var(--line);background:#10121b}.brand{font:900 11px ui-monospace,Consolas,monospace;color:var(--a);margin-right:auto}.btn{border:1px solid var(--line);border-radius:9px;background:#ffffff08;color:white;padding:8px 10px;font:800 9px ui-monospace,Consolas,monospace;cursor:pointer}.btn:hover{border-color:#ff718c88}.stage{min-height:0;position:relative;background:#1b1d22}.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#8495a4;font:11px/1.7 ui-monospace,Consolas,monospace}.viewer{width:100%;height:100%;border:0;display:none;background:white}.status{display:flex;justify-content:space-between;align-items:center;padding:0 10px;border-top:1px solid var(--line);background:#0b0f16;color:#77899b;font:8px ui-monospace,Consolas,monospace}@media(max-width:580px){.brand{display:none}}
</style></head><body><main class="app"><header class="bar"><div class="brand">PDF VIEWER // swir.pdf-viewer</div><button id="open" class="btn">OPEN PDF</button><button id="close" class="btn">CLOSE</button><input id="file" type="file" accept="application/pdf,.pdf" hidden></header><section class="stage"><div id="empty" class="empty">OPEN A LOCAL PDF DOCUMENT<br>THE FILE STAYS ON THIS DEVICE</div><iframe id="viewer" class="viewer" title="PDF document"></iframe></section><footer class="status"><span id="state">READY</span><span id="meta">NO DOCUMENT</span></footer></main><script>
(()=>{'use strict';const $=s=>document.querySelector(s),viewer=$('#viewer');let current=null;function closeDoc(){if(current)URL.revokeObjectURL(current);current=null;viewer.removeAttribute('src');viewer.style.display='none';$('#empty').style.display='grid';$('#state').textContent='READY';$('#meta').textContent='NO DOCUMENT'}$('#open').onclick=()=>file.click();file.onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.type&&f.type!=='application/pdf'&&!f.name.toLowerCase().endsWith('.pdf'))return alert('Choose a PDF file.');closeDoc();current=URL.createObjectURL(f);viewer.src=current;viewer.style.display='block';$('#empty').style.display='none';$('#state').textContent='DOCUMENT OPEN';$('#meta').textContent=`${f.name} • ${Math.round(f.size/1024)} KB`};$('#close').onclick=closeDoc;addEventListener('beforeunload',()=>current&&URL.revokeObjectURL(current))})();
</script></body></html>
