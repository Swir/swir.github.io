<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SWIR Calculator</title><style>:root{color-scheme:dark;--bg:#040b14;--panel:#091827;--line:rgba(105,201,255,.18);--text:#eef9ff;--muted:#718fa4;--accent:#74b9ff;--accent2:#00d8ff}*{box-sizing:border-box}html,body{margin:0;height:100%;background:linear-gradient(145deg,#030914,#071525 55%,#03101b);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}.wrap{height:100%;display:grid;grid-template-rows:auto 1fr;max-width:520px;margin:auto;padding:18px}.display{padding:18px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,rgba(11,29,49,.88),rgba(5,16,28,.9));box-shadow:0 20px 60px rgba(0,0,0,.2)}.expr{min-height:24px;color:var(--muted);font:12px ui-monospace,Consolas,monospace;word-break:break-all}.result{margin-top:8px;font:900 clamp(28px,8vw,48px)/1.1 ui-monospace,Consolas,monospace;color:white;word-break:break-all}.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;align-content:center;padding-top:14px}.key{min-height:58px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.035);color:#e9f7ff;font:800 15px ui-monospace,Consolas,monospace;cursor:pointer}.key:hover{border-color:rgba(0,216,255,.48);background:rgba(0,166,255,.08)}.key.op{color:var(--accent2);background:rgba(0,166,255,.06)}.key.eq{background:linear-gradient(145deg,rgba(0,166,255,.3),rgba(0,216,255,.14));border-color:rgba(0,216,255,.45)}.history{grid-column:1/-1;padding:8px 2px;color:var(--muted);font:10px ui-monospace,Consolas,monospace;max-height:72px;overflow:auto}@media(max-height:520px){.wrap{padding:8px}.key{min-height:42px}.display{padding:10px}.result{font-size:26px}}</style></head><body><main class="wrap"><section class="display"><div id="expr" class="expr">0</div><div id="result" class="result">0</div></section><section class="pad"><button class="key op" data-k="clear">C</button><button class="key op" data-k="back">⌫</button><button class="key op" data-v="(">(</button><button class="key op" data-v=")">)</button><button class="key" data-v="7">7</button><button class="key" data-v="8">8</button><button class="key" data-v="9">9</button><button class="key op" data-v="/">÷</button><button class="key" data-v="4">4</button><button class="key" data-v="5">5</button><button class="key" data-v="6">6</button><button class="key op" data-v="*">×</button><button class="key" data-v="1">1</button><button class="key" data-v="2">2</button><button class="key" data-v="3">3</button><button class="key op" data-v="-">−</button><button class="key" data-v="0">0</button><button class="key" data-v=".">.</button><button class="key op" data-v="%">%</button><button class="key op" data-v="+">+</button><button class="key op" data-k="sqrt">√</button><button class="key op" data-k="square">x²</button><button class="key op" data-k="sign">±</button><button class="key eq" data-k="equals">=</button><div id="history" class="history"></div></section></main><script>
let expr='',last='0';const $=s=>document.querySelector(s);let history=[];
function show(){ $('#expr').textContent=expr||'0'; $('#result').textContent=last; $('#history').innerHTML=history.slice(-4).reverse().map(x=>`<div>${x}</div>`).join('') }
function safeEval(raw){const s=raw.replace(/%/g,'/100');if(!/^[0-9+\-*/().\s]+$/.test(s))throw Error('Invalid expression');const value=Function('"use strict";return ('+s+')')();if(typeof value!=='number'||!Number.isFinite(value))throw Error('Math error');return Math.round((value+Number.EPSILON)*1e12)/1e12}
function equals(){if(!expr)return;try{const v=safeEval(expr);history.push(`${expr} = ${v}`);last=String(v);expr=String(v)}catch{last='ERROR'}show()}
function action(k){if(k==='clear'){expr='';last='0'}else if(k==='back'){expr=expr.slice(0,-1);last=expr||'0'}else if(k==='equals')equals();else if(k==='sqrt'){try{const v=Math.sqrt(safeEval(expr||last));last=String(v);expr=last}catch{last='ERROR'}}else if(k==='square'){try{const v=safeEval(expr||last);last=String(v*v);expr=last}catch{last='ERROR'}}else if(k==='sign'){if(expr.startsWith('-'))expr=expr.slice(1);else expr='-'+(expr||last)}show()}
document.addEventListener('click',e=>{const b=e.target.closest('.key');if(!b)return;if(b.dataset.v!=null){expr+=b.dataset.v;last=expr;show()}else action(b.dataset.k)});document.addEventListener('keydown',e=>{if(/[0-9.+\-*/()%]/.test(e.key)&&e.key.length===1){expr+=e.key;last=expr;show()}else if(e.key==='Enter'||e.key==='='){e.preventDefault();equals()}else if(e.key==='Backspace')action('back');else if(e.key==='Escape')action('clear')});show();
</script></body></html>
