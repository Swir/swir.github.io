<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SWIR Task Manager</title>
<style>
:root{color-scheme:dark;--bg:#050c16;--panel:#081626;--line:rgba(105,201,255,.18);--text:#edf8ff;--muted:#7f9db2;--accent:#00c8ff;--danger:#ff6b81;--ok:#50e3a4;--warn:#f6c85f}*{box-sizing:border-box}html,body{margin:0;height:100%;background:linear-gradient(145deg,#030914,#071525 55%,#03101b);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}.app{height:100%;display:grid;grid-template-rows:auto 1fr auto}.head{display:flex;justify-content:space-between;align-items:center;padding:15px 17px;border-bottom:1px solid var(--line);background:rgba(3,11,20,.86)}.title small{display:block;color:var(--accent);font:800 10px ui-monospace,Consolas,monospace;letter-spacing:.14em}.title strong{display:block;margin-top:5px;font-size:22px}.tools{display:flex;gap:8px;align-items:center}.mode{border:1px solid var(--line);border-radius:999px;padding:7px 9px;color:var(--muted);font:800 9px ui-monospace,Consolas,monospace}.mode.native{color:var(--ok);border-color:#50e3a444}.btn{border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.035);color:#e7f7ff;padding:8px 11px;cursor:pointer;font:800 10px ui-monospace,Consolas,monospace}.btn:hover{border-color:rgba(0,200,255,.5);background:rgba(0,166,255,.08)}.content{padding:14px;overflow:auto}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}.stat{padding:12px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.025)}.stat b{display:block;color:var(--accent);font:900 16px ui-monospace,Consolas,monospace}.stat span{display:block;margin-top:4px;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.08em}.table{border:1px solid var(--line);border-radius:15px;overflow:hidden;background:rgba(6,18,32,.7)}.row{display:grid;grid-template-columns:72px minmax(160px,1.6fr) 110px 110px 120px;gap:8px;align-items:center;padding:11px 12px;border-bottom:1px solid rgba(255,255,255,.045);font-size:11px}.row:last-child{border-bottom:0}.row.headrow{background:rgba(255,255,255,.028);color:#7193aa;font:800 9px ui-monospace,Consolas,monospace;letter-spacing:.08em}.name b{display:block;overflow:hidden;text-overflow:ellipsis}.name span{display:block;color:var(--muted);font-size:9px;margin-top:3px}.state{font:800 9px ui-monospace,Consolas,monospace;color:var(--ok)}.state.warn{color:var(--warn)}.state.dim{color:#8aa8bc}.kill{border:1px solid rgba(255,107,129,.25);border-radius:8px;background:rgba(255,107,129,.06);color:#ff9cab;padding:6px 8px;cursor:pointer;font:800 9px ui-monospace,Consolas,monospace}.readonly{color:#63849a;font:800 8px ui-monospace,Consolas,monospace}.empty{padding:36px;text-align:center;color:var(--muted)}.foot{display:flex;justify-content:space-between;padding:8px 12px;border-top:1px solid var(--line);color:#63849a;font:9px ui-monospace,Consolas,monospace;background:#040c16}@media(max-width:760px){.summary{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:58px minmax(120px,1fr) 82px 90px}.started{display:none}.content{padding:10px}}@media(max-width:500px){.row{grid-template-columns:50px minmax(110px,1fr) 80px}.memory{display:none}.tools{gap:5px}.mode{display:none}}
</style>
</head>
<body>
<div class="app">
<header class="head"><div class="title"><small>SWIR OS // PROCESS SERVICE</small><strong>Task Manager</strong></div><div class="tools"><span id="mode" class="mode">WEB ADAPTER</span><button id="refresh" class="btn">REFRESH</button></div></header>
<main class="content"><section class="summary"><div class="stat"><b id="count">0</b><span>Processes</span></div><div class="stat"><b id="active">0</b><span>Responsive</span></div><div class="stat"><b id="cores">—</b><span>Logical cores</span></div><div class="stat"><b id="memory">—</b><span>Visible working set</span></div></section><section class="table"><div class="row headrow"><span>PID</span><span>PROCESS</span><span>STATE</span><span class="memory">MEMORY</span><span class="started">STARTED / ACTION</span></div><div id="rows"></div></section></main>
<footer class="foot"><span id="policy">WEB PROCESS MODEL</span><span id="updated">READY</span></footer>
</div>
<script>
(()=>{'use strict';const $=s=>document.querySelector(s);const esc=(v='')=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const platform=()=>{try{return parent.SwirPlatform}catch{return null}};const runtime=()=>{try{return parent.SwirRuntime}catch{return null}};const native=()=>{try{return !!runtime()?.capabilities?.()?.surfaces?.processes?.native}catch{return false}};const bytes=n=>{n=Number(n)||0;if(n<1024)return`${n} B`;if(n<1048576)return`${(n/1024).toFixed(1)} KB`;if(n<1073741824)return`${(n/1048576).toFixed(1)} MB`;return`${(n/1073741824).toFixed(1)} GB`};
async function load(){const rt=runtime();if(rt?.processes?.list)try{return await rt.processes.list()}catch{}return platform()?.processes?.list?.()||[]}
function normalize(x,isNative){if(isNative)return{pid:x.pid,name:x.name||'unknown',detail:x.isHost?'SWIR DESKTOP HOST':'WINDOWS PROCESS',state:x.responding===false?'NOT RESPONDING':x.responding===true?'RESPONSIVE':'RUNNING',stateClass:x.responding===false?'warn':'',memory:Number(x.workingSetBytes)||0,started:x.startedUtc?new Date(x.startedUtc).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'—',id:null};return{pid:x.pid,name:x.title||x.id||'SWIR app',detail:x.id||x.type||'WEB APP',state:String(x.state||'active').toUpperCase(),stateClass:x.state==='active'?'':'dim',memory:0,started:'—',id:x.id||null}}
async function render(){const isNative=native();const raw=await load();const list=(Array.isArray(raw)?raw:[]).map(x=>normalize(x,isNative));$('#mode').textContent=isNative?'NATIVE WINDOWS':'WEB ADAPTER';$('#mode').classList.toggle('native',isNative);$('#policy').textContent=isNative?'READ-ONLY NATIVE PROCESS INVENTORY':'WEB PROCESS MODEL';$('#count').textContent=list.length;$('#active').textContent=list.filter(x=>!['NOT RESPONDING','SLEEPING'].includes(x.state)).length;$('#cores').textContent=navigator.hardwareConcurrency||'—';const total=list.reduce((n,x)=>n+x.memory,0);$('#memory').textContent=isNative?bytes(total):(navigator.deviceMemory?`${navigator.deviceMemory} GB hint`:'browser');$('#updated').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});$('#rows').innerHTML=list.length?list.map(x=>`<div class="row"><span>${esc(x.pid)}</span><div class="name"><b>${esc(x.name)}</b><span>${esc(x.detail)}</span></div><span class="state ${esc(x.stateClass)}">${esc(x.state)}</span><span class="memory">${isNative?esc(bytes(x.memory)):'—'}</span><span class="started">${isNative?`<span class="readonly">${esc(x.started)} • READ ONLY</span>`:`<button class="kill" data-kill="${esc(x.id||'')}">END</button>`}</span></div>`).join(''):'<div class="empty">No processes are available.</div>'}
document.addEventListener('click',e=>{const b=e.target.closest('[data-kill]');if(!b||native())return;platform()?.processes?.kill?.(b.dataset.kill);setTimeout(render,100)});$('#refresh').onclick=render;setInterval(render,2000);render()})();
</script>
</body></html>
