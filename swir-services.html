<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SWIR Services</title><style>
:root{color-scheme:dark;--line:rgba(86,205,255,.18);--accent:#35e6ff;--ok:#50e3a4;--warn:#ffca72;--bad:#ff718c;--muted:#7899ad}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 80% 0,#102a42,transparent 32%),linear-gradient(145deg,#020812,#071522 55%,#020a13);color:#eefaff;font-family:Inter,Segoe UI,Arial,sans-serif}body{padding:18px}.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}.k{font:900 9px ui-monospace,Consolas,monospace;letter-spacing:.16em;color:var(--accent)}h1{margin:5px 0 0;font-size:clamp(28px,5vw,48px);letter-spacing:-.04em}.btn{border:1px solid var(--line);border-radius:10px;background:#ffffff07;color:white;padding:9px 11px;cursor:pointer;font:900 9px ui-monospace,Consolas,monospace}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.service{padding:14px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,#0b1f34c8,#05111fba)}.top{display:flex;align-items:center;gap:10px}.ico{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line);border-radius:12px;color:var(--accent);font:900 10px ui-monospace,Consolas,monospace}.name{min-width:0;flex:1}.name strong{display:block;font-size:12px}.name span{display:block;color:var(--muted);font:9px ui-monospace,Consolas,monospace;margin-top:4px}.state{font:900 8px ui-monospace,Consolas,monospace;padding:5px 7px;border:1px solid var(--line);border-radius:999px;color:#90aebb}.state.ok{color:var(--ok);border-color:#50e3a444}.state.warn{color:var(--warn);border-color:#ffca7244}.state.bad{color:var(--bad);border-color:#ff718c44}.meta{margin-top:12px;color:#7697aa;font:9px/1.6 ui-monospace,Consolas,monospace;min-height:30px}.actions{display:flex;gap:7px;margin-top:10px}.actions .btn{flex:1}.foot{margin-top:13px;color:#55778b;font:9px/1.6 ui-monospace,Consolas,monospace}@media(max-width:560px){body{padding:10px}.head{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}}</style></head><body><header class="head"><div><div class="k">SWIR OS 1.7 // SYSTEM SERVICE LAYER</div><h1>SWIR Services</h1></div><button id="refresh" class="btn">REFRESH</button></header><section id="grid" class="grid"></section><div class="foot">WEB EDITION: services represent browser/platform adapters. Desktop/System editions can replace them with native daemons, package resolvers, MIME handlers, notification backends and filesystem services.</div><script>
(()=>{'use strict';const grid=document.getElementById('grid');const api=()=>{try{return parent.SwirPlatform}catch{return null}};const os=()=>{try{return parent.SwirOS}catch{return null}};const assoc=()=>{try{return parent.SwirAssociations}catch{return null}};const notices=()=>{try{return parent.SwirNotifications}catch{return null}};const resolver=()=>{try{return parent.SwirPackageResolver}catch{return null}};function configuredChat(){try{const c=JSON.parse(localStorage.getItem('swir-chat-config-v1')||'null');return!!(c&&c.url&&c.key&&c.nickname)}catch{return false}}function open(id){parent.postMessage({type:'SWIR_NATIVE_OPEN',id},location.origin)}function card(s){const el=document.createElement('article');el.className='service';el.innerHTML=`<div class="top"><div class="ico">${s.icon}</div><div class="name"><strong>${s.name}</strong><span>${s.adapter}</span></div><div class="state ${s.cls}">${s.state}</div></div><div class="meta">${s.meta}</div>${s.open?`<div class="actions"><button class="btn" data-open="${s.open}">OPEN CONTROL</button></div>`:''}`;return el}async function snapshot(){const p=api();if(p)await p.ready;let sw=false;try{sw=!!navigator.serviceWorker?.controller}catch{}let storage='LOCAL';try{const e=await navigator.storage.estimate();storage=`${Math.round((e.usage||0)/1024)} KB USED`}catch{}const user=p?await p.identity.active():null;const session=p?await p.identity.session():null;const host=p?await p.settings.get('device.name','SWIR-WEB'):'SWIR-WEB';const conn=navigator.connection||navigator.mozConnection||navigator.webkitConnection||null;const packages=p?.packages?.list?await p.packages.list():[];const fileTypes=assoc()?.allExtensions?.().filter(x=>assoc().handlersFor(x).length).length||0;const notificationCount=notices()?.list?.().length||0;const packageAudit=resolver()?await resolver().audit():[];const packageBad=packageAudit.filter(x=>!x.ok).length;const rt=resolver()?.runtime?.();return[
{icon:'WM',name:'Window Manager',adapter:'SWIR SHELL',state:os()?'RUNNING':'OFFLINE',cls:os()?'ok':'bad',meta:os()?`${os().apps?.length||0} registered applications`:'Shell API unavailable'},
{icon:'DV',name:'Device Service',adapter:'WEB DEVICE ADAPTER',state:'ACTIVE',cls:'ok',meta:`HOST=${host} • PLATFORM=${p?.system.info().platform||'WEB'}`,open:'device'},
{icon:'NET',name:'Network Service',adapter:'BROWSER NETWORK ADAPTER',state:navigator.onLine?'ONLINE':'OFFLINE',cls:navigator.onLine?'ok':'bad',meta:`TYPE=${String(conn?.effectiveType||'UNKNOWN').toUpperCase()} • RTT=${conn?.rtt??'N/A'}ms`,open:'network'},
{icon:'ID',name:'Identity Service',adapter:'PLATFORM API 2',state:user?'ACTIVE':'WAITING',cls:user?'ok':'warn',meta:user?`USER=${user.name} • ROLE=${user.role.toUpperCase()}`:'No active profile',open:'users'},
{icon:'SES',name:'Session Service',adapter:'LOCAL SESSION',state:session?.locked?'LOCKED':'ACTIVE',cls:session?.locked?'warn':'ok',meta:`Profile ${user?.name||'-'} • ${session?.startedAt?new Date(session.startedAt).toLocaleString():'not started'}`,open:'users'},
{icon:'FS',name:'Storage Service',adapter:'SWIR PLATFORM',state:p?'RUNNING':'WAITING',cls:p?'ok':'warn',meta:`IndexedDB/local adapter • ${storage}`,open:'files'},
{icon:'PKG',name:'Package Service',adapter:'SWIR APP SDK 1.3',state:'ACTIVE',cls:'ok',meta:`${packages.filter(x=>x.installed!==false).length} installed records • schema swir.app/1.0`,open:'store'},
{icon:'DEP',name:'Package Resolver',adapter:'DEPENDENCIES 1.0',state:resolver()?(packageBad?'ATTENTION':'HEALTHY'):'WAITING',cls:resolver()?(packageBad?'warn':'ok'):'warn',meta:resolver()?`${packageAudit.length-packageBad}/${packageAudit.length} installed packages compatible • OS ${rt?.os||'?'} SDK ${rt?.sdk||'?'} API ${rt?.platformApi||'?'}`:'Resolver unavailable',open:'store'},
{icon:'DF',name:'File Association Service',adapter:'OPEN WITH 1.0',state:fileTypes?'ACTIVE':'IDLE',cls:fileTypes?'ok':'warn',meta:`${fileTypes} active file types • defaults stored locally`,open:'defaults'},
{icon:'DATA',name:'App Data Service',adapter:'NAMESPACED STORAGE',state:'ACTIVE',cls:'ok',meta:'SWIR://APPDATA/* namespaces exposed through App SDK',open:'files'},
{icon:'NTF',name:'Notification Service',adapter:'APP SDK 1.3',state:notices()?'ACTIVE':'WAITING',cls:notices()?'ok':'warn',meta:`${notificationCount} app notification records • permission-aware delivery`},
{icon:'CH',name:'Chat Service',adapter:'REMOTE API CLIENT',state:configuredChat()?'CONFIGURED':'NOT SET',cls:configuredChat()?'ok':'warn',meta:configuredChat()?'External SWIR Chat API configured':'Download Server Kit and configure an API endpoint',open:'chat'},
{icon:'PWA',name:'Cache Service',adapter:'SERVICE WORKER',state:sw?'ACTIVE':'STANDBY',cls:sw?'ok':'warn',meta:sw?'Offline application cache controlled':'Service worker may activate after reload',open:'updates'},
{icon:'UP',name:'Update Service',adapter:'GITHUB CHANNEL',state:navigator.onLine?'READY':'OFFLINE',cls:navigator.onLine?'ok':'warn',meta:'Update Center checks repository/runtime state',open:'updates'},
{icon:'SEC',name:'Permission Service',adapter:'PLATFORM CONTROL',state:p?'ACTIVE':'WAITING',cls:p?'ok':'warn',meta:'Application permissions and package metadata',open:'control'}]}
async function render(){const list=await snapshot();grid.innerHTML='';list.forEach(s=>grid.appendChild(card(s)))}document.addEventListener('click',e=>{const b=e.target.closest('[data-open]');if(b)open(b.dataset.open)});refresh.onclick=render;addEventListener('online',render);addEventListener('offline',render);render();setInterval(render,5000)})();
</script></body></html>
