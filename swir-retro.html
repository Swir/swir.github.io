<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SWIR Retro Hub</title><style>:root{color-scheme:dark;--a:#00d8ff;--l:rgba(94,201,255,.18)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 75% 20%,#10294b,#050b14 45%,#02050a);color:#eef9ff;font-family:Inter,Segoe UI,Arial}.wrap{max-width:1050px;margin:auto;padding:28px}.k{font:800 11px Consolas,monospace;letter-spacing:.18em;color:var(--a)}h1{font-size:clamp(36px,7vw,72px);margin:8px 0 4px;letter-spacing:-.05em}.lead{color:#8eabc0;max-width:720px;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:26px}.card{border:1px solid var(--l);border-radius:20px;padding:18px;background:linear-gradient(145deg,rgba(10,31,53,.82),rgba(4,13,24,.78));cursor:pointer;color:white;text-align:left;transition:.18s}.card:hover{transform:translateY(-3px);border-color:rgba(0,216,255,.5);box-shadow:0 18px 55px rgba(0,0,0,.35)}.icon{width:54px;height:54px;border:1px solid var(--l);border-radius:16px;display:grid;place-items:center;color:var(--a);font:900 15px Consolas,monospace;background:rgba(0,166,255,.07)}strong{display:block;margin-top:14px;font-size:16px}.card span{display:block;color:#7695aa;font-size:12px;line-height:1.5;margin-top:5px}.foot{margin-top:24px;color:#55758d;font:10px Consolas,monospace}</style></head><body><main class="wrap"><div class="k">SWIR OS // NATIVE RETRO SUBSYSTEM</div><h1>Retro Hub</h1><p class="lead">These are native SWIR OS modules written for NEON CORE. They do not load any old repository folder, ROM image or third-party retro shell.</p><section class="grid"><button class="card" data-open="atari"><div class="icon">A8</div><strong>SWIR Atari Lab</strong><span>Custom 8-bit console with a built-in arcade game.</span></button><button class="card" data-open="c64"><div class="icon">64</div><strong>SWIR C64 Lab</strong><span>Own BASIC-style command environment and demo machine.</span></button><button class="card" data-open="mac"><div class="icon">MAC</div><strong>SWIR Classic Mac</strong><span>Monochrome desktop with Notes, Paint and system tools.</span></button><button class="card" data-open="swiramp"><div class="icon">♫</div><strong>SWIR Amp</strong><span>Native retro audio player for local files and system sounds.</span></button><button class="card" data-open="matrix"><div class="icon">01</div><strong>SWIR Matrix</strong><span>Our own digital-rain visual module.</span></button></section><div class="foot">RETRO CORE // NATIVE MODULES // NO LEGACY FOLDER DEPENDENCY</div></main><script>document.addEventListener('click',e=>{const b=e.target.closest('[data-open]');if(b)parent.postMessage({type:'SWIR_NATIVE_OPEN',id:b.dataset.open},location.origin)});</script></body></html>
