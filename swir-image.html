<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Studio</title><style>
:root{color-scheme:dark;--a:#ff8fd8;--line:rgba(255,143,216,.22);--muted:#8fa2b7}*{box-sizing:border-box}html,body{margin:0;height:100%;background:#050914;color:#f9eff8;font-family:Inter,Segoe UI,Arial}button,input,select{font:inherit}.app{height:100%;display:grid;grid-template-rows:auto 1fr 30px}.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:9px;border-bottom:1px solid var(--line);background:#0b1120}.brand{font:900 11px ui-monospace,Consolas,monospace;color:var(--a);margin-right:auto}.btn,.sel{border:1px solid var(--line);border-radius:9px;background:#ffffff08;color:white;padding:8px 10px;font:800 9px ui-monospace,Consolas,monospace}.btn{cursor:pointer}.btn:hover{border-color:#ff8fd888}.stage{min-height:0;display:grid;place-items:center;overflow:auto;padding:18px;background:repeating-conic-gradient(#08111d 0 25%,#0d1723 0 50%) 50%/24px 24px}.canvas-wrap{max-width:100%;max-height:100%;box-shadow:0 18px 55px #0008}.canvas-wrap canvas{display:block;max-width:100%;max-height:calc(100vh - 150px);background:transparent}.status{display:flex;justify-content:space-between;align-items:center;padding:0 10px;border-top:1px solid var(--line);background:#08111d;color:#72879a;font:8px ui-monospace,Consolas,monospace}.range{display:flex;align-items:center;gap:6px;color:#9daec0;font:8px ui-monospace,Consolas,monospace}.range input{width:110px}@media(max-width:680px){.brand{width:100%}.range{width:100%}.bar{overflow:auto}.canvas-wrap canvas{max-height:calc(100vh - 210px)}}
</style></head><body><main class="app"><header class="bar"><div class="brand">IMAGE STUDIO // swir.image-studio // APP BRIDGE 0.5</div><button id="open" class="btn">OPEN IMAGE</button><button id="left" class="btn">↶ 90°</button><button id="right" class="btn">↷ 90°</button><button id="flip" class="btn">MIRROR</button><button id="gray" class="btn">GRAYSCALE</button><button id="reset" class="btn">RESET</button><div class="range">BRIGHTNESS <input id="bright" type="range" min="40" max="160" value="100"></div><select id="format" class="sel"><option value="png">PNG</option><option value="jpeg">JPEG</option></select><button id="export" class="btn">EXPORT</button><input id="file" type="file" accept="image/*" hidden></header><section class="stage"><div class="canvas-wrap"><canvas id="cv" width="960" height="540"></canvas></div></section><footer class="status"><span id="state">OPEN AN IMAGE</span><span id="meta">960×540</span></footer></main><script src="./swir-app-bridge.js" data-swir-package="swir.image-studio" data-swir-app="image"></script><script>
(()=>{'use strict';const $=s=>document.querySelector(s),cv=$('#cv'),ctx=cv.getContext('2d');let img=null,rotation=0,mirror=false,gray=false,brightness=100,fileName='image';function drawPlaceholder(){cv.width=960;cv.height=540;ctx.fillStyle='#07111c';ctx.fillRect(0,0,cv.width,cv.height);ctx.fillStyle='#ff8fd8';ctx.font='700 28px Segoe UI';ctx.textAlign='center';ctx.fillText('IMAGE STUDIO',cv.width/2,cv.height/2-10);ctx.fillStyle='#8294a7';ctx.font='15px Consolas';ctx.fillText('OPEN A LOCAL IMAGE TO START',cv.width/2,cv.height/2+26);$('#meta').textContent='960×540'}function render(){if(!img)return drawPlaceholder();const swap=Math.abs(rotation%180)===90,w=swap?img.naturalHeight:img.naturalWidth,h=swap?img.naturalWidth:img.naturalHeight;cv.width=w;cv.height=h;ctx.save();ctx.translate(w/2,h/2);ctx.rotate(rotation*Math.PI/180);ctx.scale(mirror?-1:1,1);ctx.filter=`brightness(${brightness}%) ${gray?'grayscale(100%)':'grayscale(0%)'}`;ctx.drawImage(img,-img.naturalWidth/2,-img.naturalHeight/2);ctx.restore();ctx.filter='none';$('#meta').textContent=`${w}×${h} • ${brightness}%`;$('#state').textContent='READY'}function loadSource(src,name='image'){fileName=String(name).replace(/\.[^.]+$/,'')||'image';const image=new Image();image.onload=()=>{img=image;rotation=0;mirror=false;gray=false;brightness=100;$('#bright').value=100;render();$('#state').textContent='IMAGE OPEN'};image.onerror=()=>{$('#state').textContent='IMAGE LOAD FAILED'};image.src=src}async function acceptSwirFile(f){if(!f?.name)return;if(f.dataUrl)return loadSource(f.dataUrl,f.name);if(f.content){const blob=new Blob([f.content],{type:f.mime||'application/octet-stream'}),u=URL.createObjectURL(blob);const image=new Image();image.onload=()=>{img=image;fileName=f.name.replace(/\.[^.]+$/,'')||'image';rotation=0;mirror=false;gray=false;brightness=100;$('#bright').value=100;render();URL.revokeObjectURL(u);$('#state').textContent='OPENED FROM SWIR FILE EXPLORER'};image.src=u}}async function consumePending(){try{const f=await window.SwirAppBridge?.files?.consumeOpen?.();if(f)await acceptSwirFile(f)}catch(err){if(err?.code!=='PERMISSION_DENIED')$('#state').textContent=err?.message||'OPEN FAILED'}}$('#open').onclick=()=>$('#file').click();$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const u=URL.createObjectURL(f);fileName=f.name.replace(/\.[^.]+$/,'')||'image';const image=new Image();image.onload=()=>{img=image;rotation=0;mirror=false;gray=false;brightness=100;$('#bright').value=100;render();URL.revokeObjectURL(u)};image.src=u};$('#left').onclick=()=>{if(img){rotation=(rotation-90)%360;render()}};$('#right').onclick=()=>{if(img){rotation=(rotation+90)%360;render()}};$('#flip').onclick=()=>{if(img){mirror=!mirror;render()}};$('#gray').onclick=()=>{if(img){gray=!gray;render()}};$('#reset').onclick=()=>{if(img){rotation=0;mirror=false;gray=false;brightness=100;$('#bright').value=100;render()}};$('#bright').oninput=e=>{brightness=+e.target.value;render()};$('#export').onclick=()=>{if(!img)return alert('Open an image first.');const fmt=$('#format').value,mime=fmt==='jpeg'?'image/jpeg':'image/png',ext=fmt==='jpeg'?'jpg':'png';cv.toBlob(blob=>{if(!blob)return;const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=`${fileName}-swir.${ext}`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1200);$('#state').textContent='EXPORTED'},mime,0.92)};addEventListener('swir:open-file',e=>acceptSwirFile(e.detail).catch(()=>{}));drawPlaceholder();consumePending()})();
</script></body></html>
