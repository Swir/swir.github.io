<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SWIR Code</title><style>
:root{color-scheme:dark;--a:#48a8ff;--line:rgba(72,168,255,.22);--muted:#7795ac}*{box-sizing:border-box}html,body{margin:0;height:100%;background:#030914;color:#edf8ff;font-family:Inter,Segoe UI,Arial}button,input,select,textarea{font:inherit}.app{height:100%;display:grid;grid-template-rows:50px 1fr 26px}.bar{display:flex;align-items:center;gap:8px;padding:8px;border-bottom:1px solid var(--line);background:#061321}.brand{font:900 11px ui-monospace,Consolas,monospace;color:var(--a);margin-right:auto}.btn,.select{border:1px solid var(--line);border-radius:9px;background:#ffffff07;color:white;padding:7px 9px;font:800 9px ui-monospace,Consolas,monospace}.btn{cursor:pointer}.btn:hover{border-color:#48a8ff88}.work{min-height:0;display:grid;grid-template-columns:1fr 1fr}.pane{min-width:0;min-height:0;display:flex;flex-direction:column}.pane:first-child{border-right:1px solid var(--line)}.head{height:31px;display:flex;align-items:center;padding:0 10px;border-bottom:1px solid var(--line);color:var(--muted);font:800 9px ui-monospace,Consolas,monospace}.editor{flex:1;width:100%;resize:none;border:0;outline:0;background:#020812;color:#dff7ff;padding:14px;font:13px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;tab-size:2}.preview{flex:1;border:0;background:white}.status{display:flex;align-items:center;justify-content:space-between;padding:0 9px;border-top:1px solid var(--line);color:#68879b;background:#05111d;font:8px ui-monospace,Consolas,monospace}@media(max-width:700px){.work{grid-template-columns:1fr}.pane.preview-pane{display:none}.brand{display:none}.bar{overflow:auto}}
</style></head><body><main class="app"><header class="bar"><div class="brand">SWIR CODE // PACKAGE swir.code</div><select id="lang" class="select"><option value="html">HTML</option><option value="js">JavaScript</option><option value="css">CSS</option><option value="text">Text</option></select><button id="new" class="btn">NEW</button><button id="open" class="btn">OPEN</button><button id="save" class="btn">SAVE</button><button id="export" class="btn">EXPORT</button><button id="run" class="btn">RUN</button><input id="file" type="file" hidden></header><section class="work"><div class="pane"><div class="head"><span id="filename">untitled.html</span></div><textarea id="editor" class="editor" spellcheck="false"></textarea></div><div class="pane preview-pane"><div class="head">HTML PREVIEW</div><iframe id="preview" class="preview" sandbox="allow-scripts"></iframe></div></section><footer class="status"><span id="state">READY</span><span id="stats">0 chars • 1 line</span></footer></main><script>
(()=>{'use strict';const $=s=>document.querySelector(s),editor=$('#editor'),preview=$('#preview');let name='untitled.html';const starter='<!doctype html>\n<html>\n<head>\n  <meta charset="utf-8">\n  <title>SWIR App</title>\n</head>\n<body>\n  <h1>Hello SWIR OS</h1>\n</body>\n</html>';function api(){try{return parent.SwirPlatform}catch{return null}}function update(){const text=editor.value;$('#stats').textContent=`${text.length} chars • ${text.split(/\n/).length} lines`;$('#filename').textContent=name;$('#state').textContent='EDITING'}async function load(){let data=null;try{data=await api()?.storage?.get('app.code.current',null)}catch{}if(!data){try{data=JSON.parse(localStorage.getItem('swir-code-current')||'null')}catch{}}name=data?.name||'untitled.html';editor.value=data?.text??starter;update()}async function save(){const data={name,text:editor.value,updated:Date.now()};try{await api()?.storage?.set('app.code.current',data)}catch{}localStorage.setItem('swir-code-current',JSON.stringify(data));$('#state').textContent='SAVED'}function run(){const lang=$('#lang').value,text=editor.value;if(lang==='html')preview.srcdoc=text;else if(lang==='js')preview.srcdoc=`<!doctype html><pre id=o></pre><script>const log=(...a)=>o.textContent+=a.join(' ')+'\\n';console.log=log;try{${text}\n}catch(e){log(e)}<\/script>`;else if(lang==='css')preview.srcdoc=`<!doctype html><style>${text}</style><h1>SWIR CSS Preview</h1><p>Edit the stylesheet and run again.</p>`;else preview.srcdoc=`<pre>${text.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</pre>`;$('#state').textContent='PREVIEW UPDATED'}editor.addEventListener('input',update);editor.addEventListener('keydown',e=>{if(e.key==='Tab'){e.preventDefault();const s=editor.selectionStart;editor.setRangeText('  ',s,editor.selectionEnd,'end')}});$('#new').onclick=()=>{if(confirm('Create a new document?')){name='untitled.html';editor.value=starter;update();run()}};$('#open').onclick=()=>$('#file').click();$('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;name=f.name;editor.value=await f.text();const ext=name.split('.').pop().toLowerCase();$('#lang').value=ext==='html'||ext==='htm'?'html':ext==='js'?'js':ext==='css'?'css':'text';update();run()};$('#save').onclick=save;$('#export').onclick=()=>{const b=new Blob([editor.value],{type:'text/plain;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);$('#state').textContent='EXPORTED'};$('#run').onclick=run;load().then(run)})();
</script></body></html>
