<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SWIR Device Manager</title><style>
:root{color-scheme:dark;--bg:#030914;--panel:#071525;--line:rgba(68,202,255,.2);--accent:#35e6ff;--ok:#50e3a4;--warn:#ffca72;--bad:#ff718c;--muted:#7899ad}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 82% 0,#102a42,transparent 34%),linear-gradient(145deg,#020812,#071522 55%,#020a13);color:#eefaff;font-family:Inter,Segoe UI,Arial,sans-serif}body{padding:18px}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:16px}.k{font:900 9px ui-monospace,Consolas,monospace;letter-spacing:.17em;color:var(--accent)}h1{margin:5px 0 0;font-size:clamp(30px,5vw,50px);letter-spacing:-.04em}.btn{border:1px solid var(--line);border-radius:10px;background:#ffffff07;color:#eaf9ff;padding:9px 11px;cursor:pointer;font:900 9px ui-monospace,Consolas,monospace}.btn:hover{border-color:#35e6ff88;background:#35e6ff0d}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.card{padding:14px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,#0b1f34c8,#05111fba)}.label{color:#6f92a7;font:800 8px ui-monospace,Consolas,monospace;letter-spacing:.1em}.value{margin-top:7px;font-size:17px;font-weight:800;overflow-wrap:anywhere}.small{margin-top:5px;color:var(--muted);font:9px/1.55 ui-monospace,Consolas,monospace}.section{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:17px;background:#ffffff04}.section h2{margin:0 0 10px;font-size:14px}.row{display:grid;grid-template-columns:160px 1fr;gap:12px;padding:8px 0;border-bottom:1px solid #ffffff0a}.row:last-child{border-bottom:0}.row span:first-child{color:#6f91a5;font:800 9px ui-monospace,Consolas,monospace}.row span:last-child{font:10px/1.4 ui-monospace,Consolas,monospace;overflow-wrap:anywhere}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.input{width:min(320px,100%);padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:#03101d;color:white;outline:none}.input:focus{border-color:#35e6ff88}.status{margin-top:10px;color:var(--muted);font:9px ui-monospace,Consolas,monospace}.status.ok{color:var(--ok)}.status.warn{color:var(--warn)}.device-list{display:grid;gap:8px}.device-item{padding:11px;border:1px solid #ffffff0d;border-radius:13px;background:#ffffff04}.device-top{display:flex;justify-content:space-between;gap:10px}.device-top strong{font-size:11px}.badge{font:900 8px ui-monospace,Consolas,monospace;color:var(--ok)}.badge.bad{color:var(--bad)}.device-meta{margin-top:6px;color:var(--muted);font:9px/1.5 ui-monospace,Consolas,monospace;overflow-wrap:anywhere}@media(max-width:580px){body{padding:10px}.head{align-items:flex-start;flex-direction:column}.row{grid-template-columns:1fr;gap:4px}}
</style></head><body><header class="head"><div><div class="k">SWIR OS // DEVICE CORE</div><h1>Device Manager</h1></div><button id="refresh" class="btn">REFRESH</button></header><section id="cards" class="grid"></section><section class="section"><h2>Device identity</h2><div class="actions"><input id="deviceName" class="input" maxlength="24" placeholder="SWIR-WEB"><button id="saveName" class="btn">SAVE HOSTNAME</button><button id="copyReport" class="btn">COPY REPORT</button></div><div id="status" class="status">READY</div></section><section class="section"><h2>Hardware / runtime report</h2><div id="report"></div></section><section class="section"><h2>Native hardware inventory</h2><div id="deviceList" class="device-list"><div class="small">LOADING DEVICE INVENTORY…</div></div></section><script>
(()=>{'use strict';const $=s=>document.querySelector(s);const api=()=>{try{return parent.SwirPlatform}catch{return null}};const runtime=()=>{try{return parent.SwirRuntime||parent.SWIR_RUNTIME}catch{return null}};const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=b=>{if(!Number.isFinite(b))return'UNKNOWN';const u=['B','KB','MB','GB'];let i=0,n=b;while(n>=1024&&i<u.length-1){n/=1024;i++}return`${n.toFixed(i>1?1:0)} ${u[i]}`};async function nativeSnapshot(){const r=runtime();if(!r)return null;try{const [info,devices,network,adapters]=await Promise.all([r.devices.info(),r.devices.list(),r.network.status(),r.network.adapters()]);return{info,devices,network,adapters}}catch(e){console.warn('SWIR native device snapshot unavailable',e);return null}}async function snap(){const p=api();if(!p)return null;await p.ready;const info=p.system.info();const storage=await p.system.storageEstimate();const name=await p.settings.get('device.name','SWIR-WEB');const created=await p.settings.get('device.createdAt',null);let battery=null;try{if(navigator.getBattery){const b=await navigator.getBattery();battery={level:Math.round(b.level*100),charging:b.charging}}catch{}const native=await nativeSnapshot();return{...info,deviceName:name,created,storage,battery,native,userAgent:navigator.userAgent}}function card(label,value,small=''){return`<article class="card"><div class="label">${esc(label)}</div><div class="value">${esc(value)}</div><div class="small">${esc(small)}</div></article>`}function renderDevices(s){const payload=s.native?.devices;const list=Array.isArray(payload?.devices)?payload.devices:[];if(!s.native?.info?.native){deviceList.innerHTML='<div class="small">WEB EDITION — native PCI/USB inventory is unavailable. Desktop Edition uses the read-only Windows device broker.</div>';return}if(!list.length){deviceList.innerHTML='<div class="small">NO PCI/USB DEVICES RETURNED BY NATIVE BROKER</div>';return}deviceList.innerHTML=list.slice(0,160).map(d=>`<article class="device-item"><div class="device-top"><strong>${esc(d.description||d.hardwareId||'Unknown device')}</strong><span class="badge ${d.healthy===false?'bad':''}">${d.healthy===false?'ATTENTION':'HEALTHY'}</span></div><div class="device-meta">BUS=${esc(String(d.bus||'unknown').toUpperCase())} • CLASS=${esc(d.className||'N/A')} • DRIVER=${esc(d.service||'N/A')}<br>VENDOR=${esc(d.manufacturer||'N/A')} • PROBLEM=${esc(d.problemCode??0)}<br>ID=${esc(d.hardwareId||'N/A')}</div></article>`).join('')+(payload.truncated?'<div class="small">DEVICE LIST TRUNCATED BY SAFETY LIMIT</div>':'')}async function render(){const s=await snap();if(!s)return;deviceName.value=s.deviceName;const native=!!s.native?.info?.native;const deviceCount=s.native?.devices?.count??0;const adapterCount=s.native?.network?.adapterCount??0;cards.innerHTML=card('HOSTNAME',s.deviceName,'SWIR device identity')+card('RUNTIME',native?'WINDOWS NATIVE':'WEB',native?'Desktop Device/Network Broker':'Portable browser fallback')+card('DEVICES',native?deviceCount:'N/A',native?'PCI/USB inventory from Windows Registry':'Native inventory unavailable')+card('NETWORK ADAPTERS',native?adapterCount:'N/A',native?'Read-only Windows adapter inventory':'Browser fallback')+card('CPU THREADS',s.cores??'N/A','Logical processors exposed to shell')+card('MEMORY',s.memoryGB?`${s.memoryGB} GB`:'N/A','Approximate runtime memory value')+card('DISPLAY',s.screen||'N/A',`Viewport ${s.viewport||'N/A'}`)+card('STORAGE',fmt(s.storage?.usage||0),`Quota ${fmt(s.storage?.quota||0)}`);const rows=[['SWIR OS',`${s.version} / ${s.core}`],['Edition',s.edition],['Platform API',String(s.platformApi)],['Device provider',s.native?.info?.provider||'web-adapter'],['Device broker read-only',s.native?.info?.readOnly===true?'YES':'N/A'],['Network online',s.native?.network?.online??navigator.onLine?'YES':'NO'],['Language',s.language],['PWA',s.pwa?'YES':'NO'],['Service Worker',s.serviceWorker?'SUPPORTED':'NO'],['Device created',s.created?new Date(s.created).toLocaleString():'UNKNOWN'],['User Agent',s.userAgent]];report.innerHTML=rows.map(r=>`<div class="row"><span>${esc(r[0])}</span><span>${esc(r[1]??'N/A')}</span></div>`).join('');renderDevices(s);window.__deviceSnap=s}saveName.onclick=async()=>{const name=deviceName.value.trim().replace(/[^A-Za-z0-9_-]+/g,'-').replace(/^-+|-+$/g,'').slice(0,24);if(name.length<2){status.textContent='HOSTNAME TOO SHORT';status.className='status warn';return}await api().settings.set('device.name',name.toUpperCase());status.textContent='HOSTNAME SAVED';status.className='status ok';render();parent.postMessage({type:'SWIR_DEVICE_CHANGED'},location.origin)};copyReport.onclick=async()=>{const s=window.__deviceSnap||await snap();const text=`SWIR OS DEVICE REPORT\nHostname: ${s.deviceName}\nOS: ${s.version} ${s.edition}\nProvider: ${s.native?.info?.provider||'web-adapter'}\nNative devices: ${s.native?.devices?.count??'N/A'}\nNetwork adapters: ${s.native?.network?.adapterCount??'N/A'}\nOnline: ${s.native?.network?.online??navigator.onLine?'YES':'NO'}\nUser Agent: ${s.userAgent}`;await api().clipboard.writeText(text);status.textContent='REPORT COPIED';status.className='status ok'};refresh.onclick=render;addEventListener('online',render);addEventListener('offline',render);render()})();
</script></body></html>
