<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SWIR Device Manager</title><style>
:root{color-scheme:dark;--bg:#030914;--panel:#071525;--line:rgba(68,202,255,.2);--accent:#35e6ff;--ok:#50e3a4;--warn:#ffca72;--muted:#7899ad}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 82% 0,#102a42,transparent 34%),linear-gradient(145deg,#020812,#071522 55%,#020a13);color:#eefaff;font-family:Inter,Segoe UI,Arial,sans-serif}body{padding:18px}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:16px}.k{font:900 9px ui-monospace,Consolas,monospace;letter-spacing:.17em;color:var(--accent)}h1{margin:5px 0 0;font-size:clamp(30px,5vw,50px);letter-spacing:-.04em}.btn{border:1px solid var(--line);border-radius:10px;background:#ffffff07;color:#eaf9ff;padding:9px 11px;cursor:pointer;font:900 9px ui-monospace,Consolas,monospace}.btn:hover{border-color:#35e6ff88;background:#35e6ff0d}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.card{padding:14px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,#0b1f34c8,#05111fba)}.label{color:#6f92a7;font:800 8px ui-monospace,Consolas,monospace;letter-spacing:.1em}.value{margin-top:7px;font-size:17px;font-weight:800;overflow-wrap:anywhere}.small{margin-top:5px;color:var(--muted);font:9px/1.55 ui-monospace,Consolas,monospace}.section{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:17px;background:#ffffff04}.section h2{margin:0 0 10px;font-size:14px}.row{display:grid;grid-template-columns:160px 1fr;gap:12px;padding:8px 0;border-bottom:1px solid #ffffff0a}.row:last-child{border-bottom:0}.row span:first-child{color:#6f91a5;font:800 9px ui-monospace,Consolas,monospace}.row span:last-child{font:10px/1.4 ui-monospace,Consolas,monospace;overflow-wrap:anywhere}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.input{width:min(320px,100%);padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:#03101d;color:white;outline:none}.input:focus{border-color:#35e6ff88}.status{margin-top:10px;color:var(--muted);font:9px ui-monospace,Consolas,monospace}.status.ok{color:var(--ok)}.status.warn{color:var(--warn)}@media(max-width:580px){body{padding:10px}.head{align-items:flex-start;flex-direction:column}.row{grid-template-columns:1fr;gap:4px}}
</style></head><body><header class="head"><div><div class="k">SWIR OS 1.5 // DEVICE CORE</div><h1>Device Manager</h1></div><button id="refresh" class="btn">REFRESH</button></header><section id="cards" class="grid"></section><section class="section"><h2>Device identity</h2><div class="actions"><input id="deviceName" class="input" maxlength="24" placeholder="SWIR-WEB"><button id="saveName" class="btn">SAVE HOSTNAME</button><button id="copyReport" class="btn">COPY REPORT</button></div><div id="status" class="status">READY</div></section><section class="section"><h2>Hardware / runtime report</h2><div id="report"></div></section><script>
(()=>{'use strict';const $=s=>document.querySelector(s);const api=()=>{try{return parent.SwirPlatform}catch{return null}};const fmt=b=>{if(!Number.isFinite(b))return'UNKNOWN';const u=['B','KB','MB','GB'];let i=0,n=b;while(n>=1024&&i<u.length-1){n/=1024;i++}return`${n.toFixed(i>1?1:0)} ${u[i]}`};async function snap(){const p=api();if(!p)return null;await p.ready;const info=p.system.info();const storage=await p.system.storageEstimate();const name=await p.settings.get('device.name','SWIR-WEB');const created=await p.settings.get('device.createdAt',null);let battery=null;try{if(navigator.getBattery){const b=await navigator.getBattery();battery={level:Math.round(b.level*100),charging:b.charging}}catch{}const conn=navigator.connection||navigator.mozConnection||navigator.webkitConnection||null;return{...info,deviceName:name,created,storage,battery,connection:conn?{type:conn.type||'unknown',effectiveType:conn.effectiveType||'unknown',downlink:conn.downlink??null,rtt:conn.rtt??null,saveData:!!conn.saveData}:null,userAgent:navigator.userAgent}}function card(label,value,small=''){return`<article class="card"><div class="label">${label}</div><div class="value">${value}</div><div class="small">${small}</div></article>`}async function render(){const s=await snap();if(!s)return;deviceName.value=s.deviceName;cards.innerHTML=card('HOSTNAME',s.deviceName,'SWIR device identity')+card('PLATFORM',s.platform||'WEB',`${s.edition||'WEB'} EDITION`)+card('CPU THREADS',s.cores??'N/A','Logical processors exposed by browser')+card('MEMORY',s.memoryGB?`${s.memoryGB} GB`:'N/A','Approximate deviceMemory browser value')+card('DISPLAY',s.screen||'N/A',`Viewport ${s.viewport||'N/A'}`)+card('STORAGE',fmt(s.storage?.usage||0),`Quota ${fmt(s.storage?.quota||0)}`)+card('BATTERY',s.battery?`${s.battery.level}%`:'N/A',s.battery?(s.battery.charging?'CHARGING':'ON BATTERY'):'Battery API unavailable')+card('NETWORK',navigator.onLine?'ONLINE':'OFFLINE',s.connection?`${s.connection.effectiveType.toUpperCase()} • RTT ${s.connection.rtt??'?'} ms`:'Browser connection API limited');const rows=[['SWIR OS',`${s.version} / ${s.core}`],['Edition',s.edition],['Platform API',String(s.platformApi)],['Language',s.language],['PWA',s.pwa?'YES':'NO'],['Service Worker',s.serviceWorker?'SUPPORTED':'NO'],['Device created',s.created?new Date(s.created).toLocaleString():'UNKNOWN'],['User Agent',s.userAgent]];report.innerHTML=rows.map(r=>`<div class="row"><span>${r[0]}</span><span>${String(r[1]??'N/A').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</span></div>`).join('');window.__deviceSnap=s}saveName.onclick=async()=>{const name=deviceName.value.trim().replace(/[^A-Za-z0-9_-]+/g,'-').replace(/^-+|-+$/g,'').slice(0,24);if(name.length<2){status.textContent='HOSTNAME TOO SHORT';status.className='status warn';return}await api().settings.set('device.name',name.toUpperCase());status.textContent='HOSTNAME SAVED';status.className='status ok';render();parent.postMessage({type:'SWIR_DEVICE_CHANGED'},location.origin)};copyReport.onclick=async()=>{const s=window.__deviceSnap||await snap();const text=`SWIR OS DEVICE REPORT\nHostname: ${s.deviceName}\nOS: ${s.version} ${s.edition}\nPlatform: ${s.platform}\nCPU threads: ${s.cores??'N/A'}\nMemory: ${s.memoryGB??'N/A'} GB\nDisplay: ${s.screen}\nOnline: ${s.online?'YES':'NO'}\nUser Agent: ${s.userAgent}`;await api().clipboard.writeText(text);status.textContent='REPORT COPIED';status.className='status ok'};refresh.onclick=render;addEventListener('online',render);addEventListener('offline',render);render()})();
</script></body></html>
