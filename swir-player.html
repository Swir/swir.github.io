<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SWIR Player</title><style>:root{color-scheme:dark;--bg:#040b14;--panel:#091827;--line:rgba(105,201,255,.18);--text:#eef9ff;--muted:#718fa4;--accent:#ff8fd8;--accent2:#00d8ff}*{box-sizing:border-box}html,body{margin:0;height:100%;background:linear-gradient(145deg,#030914,#071525 55%,#03101b);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif;overflow:hidden}button,input{font:inherit}.app{height:100%;display:grid;grid-template-columns:1fr 280px}.player{display:grid;place-items:center;padding:18px}.panel{width:min(520px,100%);padding:20px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,rgba(12,31,52,.84),rgba(5,17,31,.76));box-shadow:0 24px 80px rgba(0,0,0,.28)}.art{width:160px;aspect-ratio:1;border-radius:30px;margin:auto;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,rgba(255,143,216,.35),rgba(0,216,255,.08) 45%,#071321 75%);border:1px solid rgba(255,143,216,.26);box-shadow:0 0 60px rgba(255,143,216,.12);font:900 48px ui-monospace,Consolas,monospace;color:var(--accent)}.meta{text-align:center;margin-top:18px}.meta strong{display:block;font-size:18px}.meta span{display:block;color:var(--muted);font-size:10px;margin-top:5px}.seek{width:100%;margin-top:18px}.time{display:flex;justify-content:space-between;color:#6f8ea3;font:9px ui-monospace,Consolas,monospace;margin-top:4px}.controls{display:flex;justify-content:center;gap:10px;margin-top:18px}.btn{width:44px;height:44px;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.035);color:white;cursor:pointer;font:800 13px ui-monospace,Consolas,monospace}.btn:hover{border-color:rgba(255,143,216,.5);background:rgba(255,143,216,.08)}.btn.play{width:54px;height:54px;border-radius:50%;background:linear-gradient(145deg,rgba(255,143,216,.25),rgba(0,216,255,.12))}.volume{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;margin-top:18px;color:#7e9eb4;font:10px ui-monospace,Consolas,monospace}.side{border-left:1px solid var(--line);background:rgba(3,12,22,.76);display:flex;flex-direction:column;min-width:0}.side-head{padding:14px;border-bottom:1px solid var(--line)}.side-head strong{font:900 12px ui-monospace,Consolas,monospace;color:var(--accent)}.side-head p{font-size:10px;color:var(--muted);line-height:1.45}.add{display:block;width:100%;padding:9px;border:1px dashed rgba(255,143,216,.35);border-radius:10px;text-align:center;color:#e7b8d8;cursor:pointer;font:800 10px ui-monospace,Consolas,monospace}.list{padding:8px;overflow:auto;flex:1}.track{width:100%;text-align:left;padding:10px;border:1px solid transparent;border-radius:10px;background:transparent;color:#dcecf7;cursor:pointer;margin-bottom:4px}.track:hover,.track.active{background:rgba(255,143,216,.07);border-color:rgba(255,143,216,.14)}.track strong,.track span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.track strong{font-size:10px}.track span{font-size:9px;color:var(--muted);margin-top:4px}.drop{border:1px dashed rgba(0,216,255,.22);border-radius:12px;padding:10px;margin-top:8px;text-align:center;color:#6e91a8;font-size:9px}@media(max-width:700px){.app{grid-template-columns:1fr}.side{position:fixed;right:0;top:0;bottom:0;width:150px;background:#071321cc;backdrop-filter:blur(12px)}.player{padding-right:160px}.art{width:120px}.panel{padding:14px}}@media(max-width:520px){.side{display:none}.player{padding:10px}.art{width:110px}}</style></head><body><div class="app"><main class="player"><section class="panel"><div class="art">S</div><div class="meta"><strong id="title">System Chime</strong><span id="subtitle">SWIR OS built-in sound</span></div><input id="seek" class="seek" type="range" min="0" max="1000" value="0"><div class="time"><span id="current">00:00</span><span id="duration">00:00</span></div><div class="controls"><button id="prev" class="btn">⏮</button><button id="play" class="btn play">▶</button><button id="next" class="btn">⏭</button></div><div class="volume"><span>VOL</span><input id="volume" type="range" min="0" max="1" step="0.01" value="0.75"></div></section></main><aside class="side"><div class="side-head"><strong>SWIR PLAYER</strong><p>Play the system chime or load audio files from your device. Local files are never uploaded.</p><label class="add">+ ADD AUDIO<input id="files" type="file" accept="audio/*" multiple hidden></label><div id="drop" class="drop">DROP AUDIO FILES HERE</div></div><div id="list" class="list"></div></aside></div><audio id="audio" preload="metadata"></audio><script>
const $=s=>document.querySelector(s);const audio=$('#audio');let tracks=[{id:'system',name:'System Chime',src:'./ding.mp3',desc:'SWIR OS built-in sound',object:false}],index=0;let urls=[];
function fmt(s){if(!Number.isFinite(s))return'00:00';s=Math.max(0,Math.floor(s));return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function renderList(){$('#list').innerHTML=tracks.map((t,i)=>`<button class="track ${i===index?'active':''}" data-i="${i}"><strong>${t.name.replace(/[&<>]/g,'')}</strong><span>${t.desc||'Local audio'}</span></button>`).join('')}
function load(i,autoplay=false){if(!tracks.length)return;index=(i+tracks.length)%tracks.length;const t=tracks[index];audio.src=t.src;$('#title').textContent=t.name;$('#subtitle').textContent=t.desc||'Local audio file';renderList();if(autoplay)audio.play().catch(()=>{});syncPlay()}
function syncPlay(){$('#play').textContent=audio.paused?'▶':'❚❚'}
function addFiles(list){[...list].filter(f=>f.type.startsWith('audio/')).forEach(f=>{const u=URL.createObjectURL(f);urls.push(u);tracks.push({id:crypto.randomUUID?.()||String(Date.now()+Math.random()),name:f.name,src:u,desc:`${(f.size/1024/1024).toFixed(1)} MB • local file`,object:true})});renderList()}
$('#files').onchange=e=>addFiles(e.target.files);$('#list').onclick=e=>{const b=e.target.closest('[data-i]');if(b)load(Number(b.dataset.i),true)};$('#play').onclick=()=>audio.paused?audio.play():audio.pause();$('#prev').onclick=()=>load(index-1,true);$('#next').onclick=()=>load(index+1,true);$('#volume').value=localStorage.getItem('swir-player-volume')||'0.75';audio.volume=Number($('#volume').value);$('#volume').oninput=e=>{audio.volume=Number(e.target.value);localStorage.setItem('swir-player-volume',e.target.value)};$('#seek').oninput=e=>{if(audio.duration)audio.currentTime=audio.duration*(Number(e.target.value)/1000)};audio.addEventListener('timeupdate',()=>{$('#current').textContent=fmt(audio.currentTime);$('#duration').textContent=fmt(audio.duration);$('#seek').value=audio.duration?Math.round(audio.currentTime/audio.duration*1000):0});audio.addEventListener('loadedmetadata',()=>$('#duration').textContent=fmt(audio.duration));audio.addEventListener('play',syncPlay);audio.addEventListener('pause',syncPlay);audio.addEventListener('ended',()=>load(index+1,true));const drop=$('#drop');['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.style.borderColor='rgba(255,143,216,.65)'}));['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.style.borderColor=''}));drop.addEventListener('drop',e=>addFiles(e.dataTransfer.files));window.addEventListener('beforeunload',()=>urls.forEach(URL.revokeObjectURL));load(0);renderList();
</script></body></html>
