<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SWIR System Monitor</title><style>:root{color-scheme:dark;--bg:#040b14;--panel:#091827;--line:rgba(105,201,255,.18);--text:#eef9ff;--muted:#718fa4;--accent:#7dffb3;--warn:#ffd166}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:linear-gradient(145deg,#030914,#071525 55%,#03101b);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}.wrap{padding:18px;max-width:1000px;margin:auto}.kicker{font:800 10px ui-monospace,Consolas,monospace;letter-spacing:.16em;color:var(--accent)}h1{margin:5px 0 4px;font-size:clamp(28px,5vw,46px)}.lead{color:var(--muted);font-size:11px;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:16px}.card{padding:14px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,rgba(12,31,52,.8),rgba(5,17,31,.74));min-height:100px}.card .label{color:#6f91a8;font:800 9px ui-monospace,Consolas,monospace;letter-spacing:.12em}.card strong{display:block;margin-top:9px;font:900 18px ui-monospace,Consolas,monospace;color:white;word-break:break-word}.card small{display:block;color:var(--muted);font-size:10px;margin-top:6px;line-height:1.45}.online{color:var(--accent)!important}.offline{color:#ff6b81!important}.bar{height:7px;border-radius:99px;background:rgba(255,255,255,.05);overflow:hidden;margin-top:10px}.bar span{display:block;height:100%;background:linear-gradient(90deg,#00a6ff,var(--accent));width:0;transition:width .3s}.footer{margin-top:14px;color:#5f8098;font:9px ui-monospace,Consolas,monospace}.wide{grid-column:span 2}@media(max-width:520px){.wrap{padding:12px}.wide{grid-column:auto}}</style></head><body><main class="wrap"><div class="kicker">SWIR OS 1.2 // LIVE TELEMETRY</div><h1>System Monitor</h1><div class="lead">Browser-safe system information only. Values depend on what your browser exposes.</div><section id="grid" class="grid"></section><div class="footer">NEON CORE MONITOR // updates every second</div></main><script>
const $=s=>document.querySelector(s);const start=performance.now();
function fmtBytes(n){if(!Number.isFinite(n))return'Unavailable';const u=['B','KB','MB','GB','TB'];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return `${n.toFixed(i?1:0)} ${u[i]}`}
function card(label,value,sub='',cls='',bar=null){return `<article class="card ${cls}"><div class="label">${label}</div><strong>${value}</strong>${sub?`<small>${sub}</small>`:''}${bar!=null?`<div class="bar"><span style="width:${Math.max(0,Math.min(100,bar))}%"></span></div>`:''}</article>`}
async function render(){const conn=navigator.connection||navigator.mozConnection||navigator.webkitConnection;const mem=performance.memory;let storage={usage:0,quota:0};try{if(navigator.storage?.estimate)storage=await navigator.storage.estimate()}catch{}const storagePct=storage.quota?storage.usage/storage.quota*100:0;const uptime=(performance.now()-start)/1000;const mins=Math.floor(uptime/60),secs=Math.floor(uptime%60);const sw='serviceWorker'in navigator?(navigator.serviceWorker.controller?'ACTIVE':'AVAILABLE'):'UNSUPPORTED';const online=navigator.onLine;const heapPct=mem?.jsHeapSizeLimit?mem.usedJSHeapSize/mem.jsHeapSizeLimit*100:null;const rows=[];
rows.push(card('NETWORK',online?'ONLINE':'OFFLINE',conn?`${conn.effectiveType||'unknown'} • ${conn.downlink??'?'} Mbps • RTT ${conn.rtt??'?'} ms`:'Connection details not exposed','',null).replace('<strong>','<strong class="'+(online?'online':'offline')+'">'));
rows.push(card('CPU LOGICAL CORES',String(navigator.hardwareConcurrency||'Unknown'),'navigator.hardwareConcurrency'));
rows.push(card('DEVICE MEMORY',navigator.deviceMemory?`${navigator.deviceMemory} GB`:'Not exposed','Approximate memory reported by browser'));
rows.push(card('SCREEN',`${screen.width}×${screen.height}`,`Viewport ${innerWidth}×${innerHeight} • DPR ${devicePixelRatio||1}`));
rows.push(card('STORAGE',storage.quota?fmtBytes(storage.usage||0)+' used':'Unavailable',storage.quota?`${fmtBytes(storage.quota)} quota`:'StorageManager estimate unavailable','',storage.quota?storagePct:null));
rows.push(card('JS HEAP',mem?fmtBytes(mem.usedJSHeapSize):'Unavailable',mem?`${fmtBytes(mem.jsHeapSizeLimit)} limit`:'Chromium-only telemetry','',heapPct));
rows.push(card('SERVICE WORKER',sw,navigator.serviceWorker?.controller?'Offline cache controller is active':'May activate after reload'));
rows.push(card('UPTIME',`${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`,'Time since System Monitor opened'));
rows.push(card('PLATFORM',navigator.userAgentData?.platform||navigator.platform||'Unknown',navigator.language||'', 'wide'));
rows.push(card('USER AGENT',navigator.userAgent,'Browser identification string','wide'));
$('#grid').innerHTML=rows.join('')}
window.addEventListener('online',render);window.addEventListener('offline',render);setInterval(render,1000);render();
</script></body></html>
