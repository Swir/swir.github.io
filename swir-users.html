<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SWIR User Manager</title><style>
:root{color-scheme:dark;--bg:#030914;--panel:#071525;--panel2:#0a1c2f;--line:rgba(53,230,255,.18);--line2:rgba(53,230,255,.45);--text:#edfaff;--muted:#7899ae;--a:#35e6ff;--ok:#50e3a4;--bad:#ff718c}*{box-sizing:border-box}html,body{margin:0;height:100%;background:linear-gradient(145deg,#020812,#071522 55%,#020a13);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}button,input,select{font:inherit}.app{display:grid;grid-template-columns:240px 1fr;height:100%}.side{padding:16px;border-right:1px solid var(--line);background:#030c16aa;overflow:auto}.k{font:900 9px ui-monospace,Consolas,monospace;letter-spacing:.14em;color:var(--a)}h1{font-size:25px;margin:6px 0 3px}.muted{color:var(--muted);font-size:10px;line-height:1.5}.users{display:grid;gap:8px;margin-top:16px}.user{display:flex;align-items:center;gap:9px;width:100%;padding:10px;border:1px solid transparent;border-radius:13px;background:#ffffff04;color:white;text-align:left;cursor:pointer}.user:hover,.user.active{border-color:var(--line2);background:#00a6ff12}.avatar{width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--line);border-radius:12px;color:var(--a);font:900 12px ui-monospace,Consolas,monospace;background:#00a6ff0c}.user strong{display:block;font-size:11px}.user span{display:block;color:#66899d;font:9px ui-monospace,Consolas,monospace;margin-top:3px}.new{width:100%;margin-top:12px;padding:10px;border:1px dashed var(--line2);border-radius:11px;background:transparent;color:#bdefff;cursor:pointer;font:800 9px ui-monospace,Consolas,monospace}.main{padding:20px;overflow:auto}.card{max-width:760px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,#0a1c2ee8,#05111fe8);padding:20px}.hero{display:flex;gap:14px;align-items:center;margin-bottom:18px}.bigav{width:70px;height:70px;display:grid;place-items:center;border:1px solid var(--line2);border-radius:22px;background:#00a6ff10;color:var(--a);font:900 22px ui-monospace,Consolas,monospace}.hero h2{margin:0;font-size:25px}.role{display:inline-flex;margin-top:6px;padding:5px 8px;border:1px solid var(--line);border-radius:999px;color:#91b7ca;font:800 8px ui-monospace,Consolas,monospace;letter-spacing:.1em}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;margin-bottom:6px;color:#86aabd;font:800 9px ui-monospace,Consolas,monospace;letter-spacing:.1em}.input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:#03101d;color:white;outline:none}.input:focus{border-color:var(--line2)}.hint{color:#607f92;font-size:9px;line-height:1.5;margin-top:5px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.btn{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#ffffff06;color:white;cursor:pointer;font:800 9px ui-monospace,Consolas,monospace}.btn:hover{border-color:var(--line2)}.btn.primary{border-color:#35e6ff77;background:#00a6ff16}.btn.ok{border-color:#50e3a455;color:#9effce}.btn.bad{border-color:#ff718c55;color:#ff9aab}.notice{margin-top:18px;padding:11px;border:1px solid var(--line);border-radius:12px;color:#7f9eb0;background:#ffffff04;font:10px/1.55 ui-monospace,Consolas,monospace}.status{min-height:18px;margin-top:12px;color:#6f90a3;font:9px ui-monospace,Consolas,monospace}.status.ok{color:var(--ok)}.status.bad{color:var(--bad)}.empty{padding:40px;text-align:center;color:var(--muted)}@media(max-width:700px){.app{grid-template-columns:1fr;grid-template-rows:auto 1fr}.side{border-right:0;border-bottom:1px solid var(--line);padding:10px}.users{display:flex;overflow:auto;margin-top:10px}.user{min-width:170px}.new{width:auto}.main{padding:12px}.grid{grid-template-columns:1fr}}</style></head><body><div class="app"><aside class="side"><div class="k">SWIR OS 1.4 // IDENTITY</div><h1>Users</h1><div class="muted">Local Web Edition profiles.</div><div id="users" class="users"></div><button id="newUser" class="new">+ CREATE PROFILE</button></aside><main class="main"><section id="panel" class="card"><div class="empty">LOADING IDENTITY SERVICE...</div></section></main></div><script>
(() => {
'use strict';
const $=s=>document.querySelector(s);let selected=null,users=[];
function api(){try{return parent.SwirPlatform}catch{return null}}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function status(text,type=''){const e=$('#status');if(!e)return;e.textContent=text;e.className='status '+type}
async function refresh(){const p=api();if(!p?.identity)return;await p.ready;users=await p.identity.list();const active=await p.identity.active();if(!selected||!users.some(x=>x.id===selected))selected=active?.id||users[0]?.id||null;renderList(active?.id);renderPanel()}
function renderList(activeId){$('#users').innerHTML=users.map(u=>`<button class="user ${u.id===selected?'active':''}" data-user="${esc(u.id)}"><div class="avatar">${esc(u.avatar||u.name.slice(0,2).toUpperCase())}</div><div><strong>${esc(u.name)}</strong><span>${esc(u.role.toUpperCase())}${u.id===activeId?' • ACTIVE':''}</span></div></button>`).join('')}
function renderPanel(){const u=users.find(x=>x.id===selected);if(!u){$('#panel').innerHTML='<div class="empty">NO PROFILE SELECTED</div>';return}$('#panel').innerHTML=`<div class="hero"><div class="bigav">${esc(u.avatar||u.name.slice(0,2).toUpperCase())}</div><div><h2>${esc(u.name)}</h2><span class="role">${esc(u.role.toUpperCase())} PROFILE</span></div></div><div class="grid"><div class="field"><label>DISPLAY NAME</label><input id="name" class="input" maxlength="32" value="${esc(u.name)}"></div><div class="field"><label>ROLE</label><select id="role" class="input"><option value="creator" ${u.role==='creator'?'selected':''}>CREATOR</option><option value="user" ${u.role==='user'?'selected':''}>USER</option><option value="guest" ${u.role==='guest'?'selected':''}>GUEST</option></select></div><div class="field"><label>AVATAR LABEL</label><input id="avatar" class="input" maxlength="3" value="${esc(u.avatar||'')}"><div class="hint">1–3 characters shown on the lock screen.</div></div><div class="field"><label>NEW PIN</label><input id="pin" class="input" inputmode="numeric" autocomplete="new-password" placeholder="${u.pinEnabled?'Leave blank to keep current PIN':'Optional local PIN'}"><div class="hint">Web Edition PIN is a local convenience lock, not a secure OS credential.</div></div></div><div class="actions"><button id="save" class="btn primary">SAVE PROFILE</button><button id="activate" class="btn ok">SWITCH TO THIS USER</button><button id="clearPin" class="btn">REMOVE PIN</button><button id="remove" class="btn bad">DELETE PROFILE</button></div><div class="notice">IDENTITY MODE: LOCAL WEB PROFILE<br>PIN: ${u.pinEnabled?'ENABLED':'DISABLED'}<br>LAST LOGIN: ${u.lastLoginAt?new Date(u.lastLoginAt).toLocaleString():'NEVER'}<br><br>Desktop/System Edition can replace this adapter with native OS accounts without changing application-facing identity APIs.</div><div id="status" class="status">READY</div>`;
$('#save').onclick=save;$('#activate').onclick=activate;$('#clearPin').onclick=clearPin;$('#remove').onclick=remove;
}
async function save(){const p=api();try{const patch={name:$('#name').value,role:$('#role').value,avatar:$('#avatar').value};const pin=$('#pin').value;if(pin!=='')patch.pin=pin;await p.identity.update(selected,patch);status('PROFILE SAVED','ok');parent.postMessage({type:'SWIR_IDENTITY_CHANGED'},location.origin);await refresh()}catch(e){status(e.message,'bad')}}
async function activate(){const p=api();try{await p.identity.setActive(selected);status('ACTIVE PROFILE CHANGED','ok');parent.postMessage({type:'SWIR_IDENTITY_CHANGED'},location.origin);await refresh()}catch(e){status(e.message,'bad')}}
async function clearPin(){const p=api();if(!confirm('Remove the local PIN from this profile?'))return;try{await p.identity.update(selected,{pin:''});status('PIN REMOVED','ok');parent.postMessage({type:'SWIR_IDENTITY_CHANGED'},location.origin);await refresh()}catch(e){status(e.message,'bad')}}
async function remove(){const p=api();if(!confirm('Delete this local profile?'))return;try{await p.identity.remove(selected);selected=null;parent.postMessage({type:'SWIR_IDENTITY_CHANGED'},location.origin);await refresh()}catch(e){status(e.message,'bad')}}
async function create(){const p=api();const name=prompt('New profile name:','User');if(!name)return;const role=(prompt('Role: creator / user / guest','user')||'user').toLowerCase();try{const u=await p.identity.create({name,role});selected=u.id;parent.postMessage({type:'SWIR_IDENTITY_CHANGED'},location.origin);await refresh()}catch(e){alert(e.message)}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-user]');if(b){selected=b.dataset.user;refresh()}});$('#newUser').onclick=create;window.addEventListener('message',e=>{if(e.origin===location.origin&&e.data?.type==='SWIR_IDENTITY_REFRESH')refresh()});refresh();
})();
</script></body></html>
