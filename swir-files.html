<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SWIR File Explorer</title><style>:root{color-scheme:dark;--l:rgba(105,201,255,.18);--a:#00d8ff;--m:#7f9db2}*{box-sizing:border-box}html,body{margin:0;height:100%;background:linear-gradient(145deg,#030914,#071525 55%,#03101b);color:#ecf8ff;font-family:Inter,Segoe UI,Arial;overflow:hidden}button,input,textarea{font:inherit}.app{display:grid;grid-template-rows:48px 1fr 28px;height:100%}.bar{display:flex;gap:8px;align-items:center;padding:7px 9px;border-bottom:1px solid var(--l);background:#030b14dd}.btn{border:1px solid var(--l);border-radius:9px;background:#ffffff08;color:#dff6ff;padding:7px 10px;cursor:pointer;font:800 10px Consolas,monospace}.btn:hover{border-color:#00d8ff77}.path{flex:1;min-width:60px;padding:8px 11px;border:1px solid var(--l);border-radius:9px;background:#04101d;color:#a9c8dc;font:700 10px Consolas,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.main{display:grid;grid-template-columns:180px 1fr;min-height:0}.side{padding:10px;border-right:1px solid var(--l);background:#030c16aa;overflow:auto}.side button{width:100%;display:flex;gap:9px;border:0;border-radius:10px;background:transparent;color:#a9c4d8;padding:9px;cursor:pointer}.side button:hover,.side button.active{background:#00a6ff16;color:#fff}.content{padding:14px;overflow:auto}.head{display:flex;justify-content:space-between;align-items:end;gap:10px;margin-bottom:14px}.head h1{margin:0;font-size:22px}.head p{margin:4px 0 0;color:var(--m);font-size:11px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.item{position:relative;min-height:116px;padding:13px;border:1px solid var(--l);border-radius:15px;background:linear-gradient(145deg,#0c1f34c7,#05111fb8);cursor:pointer;color:#ecf8ff}.item:hover{border-color:#00d8ff77}.ico{width:42px;height:42px;border:1px solid var(--l);border-radius:12px;display:grid;place-items:center;margin-bottom:10px;color:var(--a);font:900 13px Consolas,monospace}.item strong{display:block;font-size:12px}.item span{display:block;color:var(--m);font-size:10px;margin-top:5px;line-height:1.35}.mini{position:absolute;right:8px;top:8px;width:27px;height:27px;border:1px solid #ffffff16;border-radius:8px;background:#0003;color:#9ab;cursor:pointer}.empty{padding:36px;border:1px dashed var(--l);border-radius:15px;text-align:center;color:var(--m)}.status{display:flex;justify-content:space-between;align-items:center;padding:0 10px;border-top:1px solid var(--l);color:#6f91a8;background:#040c16;font:9px Consolas,monospace}.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;padding:16px}.modal.open{display:grid}.dialog{width:min(650px,94vw);background:#071526;border:1px solid #00d8ff44;border-radius:18px;overflow:hidden}.dh,.da{padding:12px 14px;border-bottom:1px solid var(--l);display:flex;justify-content:space-between;gap:8px}.da{border-bottom:0;border-top:1px solid var(--l);justify-content:flex-end}.db{padding:14px}.field{width:100%;padding:10px;border:1px solid var(--l);border-radius:10px;background:#03101d;color:white}textarea.field{margin-top:10px;min-height:260px;resize:vertical}@media(max-width:650px){.main{grid-template-columns:1fr}.side{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--l);padding:7px}.side button{width:auto;white-space:nowrap}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.bar #newFolder{display:none}}</style></head><body><div class="app"><div class="bar"><button class="btn" id="back">←</button><button class="btn" id="home">HOME</button><div class="path" id="path">SWIR://HOME</div><button class="btn" id="newFolder">+ FOLDER</button><button class="btn" id="newText">+ TEXT</button></div><div class="main"><aside class="side"><button data-view="home" class="active">⌂ Home</button><button data-view="apps">◫ Apps</button><button data-view="documents">▤ Documents</button><button data-view="trash">⌫ Trash</button></aside><main class="content"><div class="head"><div><h1 id="title">File Explorer</h1><p id="sub">SWIR OS virtual filesystem.</p></div><button id="emptyTrash" class="btn" style="display:none">EMPTY TRASH</button></div><section id="grid" class="grid"></section></main></div><div class="status"><span id="status">READY</span><span>SWIR FS // PLATFORM READY</span></div></div><div id="modal" class="modal"><div class="dialog"><div class="dh"><strong id="modalTitle">EDITOR</strong><button class="btn" id="modalClose">×</button></div><div class="db" id="modalBody"></div><div class="da" id="modalActions"></div></div></div><script>(()=>{'use strict';const KEY='swir-vfs-v12',$=s=>document.querySelector(s);let view='home',parentId='root',history=[];const apps=[['chat','CH','SWIR Chat','Live chat through your own API server'],['files','▤','File Explorer','Virtual files and Trash'],['notes','N','Notes','Autosaving local notes'],['calc','±','Calculator','Quick calculator'],['player','▶','SWIR Player','Local audio'],['matrix','01','SWIR Matrix','Digital-rain renderer'],['monitor','▥','System Monitor','Browser telemetry'],['taskmgr','▧','Task Manager','Running app processes'],['updates','↻','Update Center','Runtime updates'],['control','◇','Platform Control','Permissions and packages'],['terminal','>_','Terminal','SWIR command console'],['projects','</>','GitHub Projects','Repository dashboard'],['store','S+','SWIR Store','System packages'],['settings','⚙','Settings','Personalize SWIR OS']];function read(){try{const v=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(v)?v:[]}catch{return[]}}function write(v){localStorage.setItem(KEY,JSON.stringify(v));dispatchEvent(new Event('storage'))}function uid(){return'f-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7)}function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function openApp(id){parent.postMessage({type:'SWIR_V12_OPEN_APP',id},location.origin)}function setView(v,p='root',push=true){if(push)history.push([view,parentId]);view=v;parentId=p;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render()}function pathName(items){if(view==='home')return'SWIR://HOME';if(view==='apps')return'SWIR://APPS';if(view==='trash')return'SWIR://TRASH';const names=[];let p=parentId;while(p&&p!=='root'){const i=items.find(x=>x.id===p);if(!i)break;names.unshift(i.name);p=i.parent}return'SWIR://DOCUMENTS/'+names.join('/')}function card(icon,name,desc,attrs,extra=''){return`<article class="item" role="button" tabindex="0" ${attrs}><div class="ico">${esc(icon)}</div><strong>${esc(name)}</strong><span>${esc(desc)}</span>${extra}</article>`}function render(){const items=read();$('#path').textContent=pathName(items);$('#emptyTrash').style.display=view==='trash'?'block':'none';$('#newFolder').style.display=$('#newText').style.display=view==='documents'?'block':'none';if(view==='home'){$('#title').textContent='File Explorer';$('#sub').textContent='SWIR OS applications and local documents.';$('#grid').innerHTML=card('◫','Applications','Browse current SWIR OS modules.','data-go="apps"')+card('▤','Documents','Create local folders and text documents.','data-go="documents"')+card('⌫','Trash','Restore or permanently remove files.','data-go="trash"')}if(view==='apps'){$('#title').textContent='Applications';$('#sub').textContent='Current SWIR OS modules — no retro systems.';$('#grid').innerHTML=apps.map(a=>card(a[1],a[2],a[3],`data-open="${a[0]}"`)).join('')}if(view==='documents'){const list=items.filter(i=>!i.trashed&&i.parent===parentId);$('#title').textContent=parentId==='root'?'Documents':(items.find(i=>i.id===parentId)?.name||'Documents');$('#sub').textContent='Virtual filesystem stored locally and mirrored to SwirPlatform.';$('#grid').innerHTML=list.length?list.map(i=>card(i.type==='folder'?'▰':'TXT',i.name,i.type==='folder'?'Virtual folder':'Text document',`data-item="${i.id}"`,`<button class="mini" data-delete="${i.id}">×</button>`)).join(''):'<div class="empty">Folder is empty.</div>'}if(view==='trash'){const list=items.filter(i=>i.trashed);$('#title').textContent='Trash';$('#sub').textContent='Deleted virtual files.';$('#grid').innerHTML=list.length?list.map(i=>`<article class="item"><div class="ico">${i.type==='folder'?'▰':'TXT'}</div><strong>${esc(i.name)}</strong><span>Deleted ${i.type}</span><div style="display:flex;gap:6px;margin-top:10px"><button class="btn" data-restore="${i.id}">RESTORE</button><button class="btn" data-purge="${i.id}">DELETE</button></div></article>`).join(''):'<div class="empty">Trash is empty.</div>'}}function modal(t,b,a){$('#modalTitle').textContent=t;$('#modalBody').innerHTML=b;$('#modalActions').innerHTML=a;$('#modal').classList.add('open')}function close(){ $('#modal').classList.remove('open') }function makeFolder(){modal('NEW FOLDER','<input id="nameField" class="field" placeholder="Folder name">','<button class="btn" data-close>CANCEL</button><button class="btn" id="createFolder">CREATE</button>');$('#createFolder').onclick=()=>{const n=$('#nameField').value.trim();if(!n)return;const a=read();a.push({id:uid(),type:'folder',name:n,parent:parentId,trashed:false,created:Date.now()});write(a);close();render()}}function makeText(){modal('NEW TEXT','<input id="nameField" class="field" placeholder="File name"><textarea id="contentField" class="field" placeholder="Write..."></textarea>','<button class="btn" data-close>CANCEL</button><button class="btn" id="saveNew">SAVE</button>');$('#saveNew').onclick=()=>{const raw=$('#nameField').value.trim()||'Untitled',a=read();a.push({id:uid(),type:'text',name:raw.toLowerCase().endsWith('.txt')?raw:raw+'.txt',content:$('#contentField').value,parent:parentId,trashed:false,created:Date.now(),updated:Date.now()});write(a);close();render()}}function edit(i){modal(i.name,`<input id="editName" class="field" value="${esc(i.name)}"><textarea id="editContent" class="field">${esc(i.content||'')}</textarea>`,'<button class="btn" data-close>CANCEL</button><button class="btn" id="saveEdit">SAVE</button>');$('#saveEdit').onclick=()=>{const a=read(),k=a.findIndex(x=>x.id===i.id);if(k<0)return;a[k].name=$('#editName').value.trim()||i.name;a[k].content=$('#editContent').value;a[k].updated=Date.now();write(a);close();render()}}function descendants(a,id){const ids=new Set([id]);let changed=true;while(changed){changed=false;a.forEach(x=>{if(ids.has(x.parent)&&!ids.has(x.id)){ids.add(x.id);changed=true}})}return ids}function trash(id){const a=read(),ids=descendants(a,id);a.forEach(x=>{if(ids.has(x.id))x.trashed=true});write(a);render()}function restore(id){const a=read(),i=a.find(x=>x.id===id);if(i){i.trashed=false;if(i.parent!=='root'&&!a.some(x=>x.id===i.parent&&!x.trashed))i.parent='root';write(a);render()}}function purge(id){const a=read(),ids=descendants(a,id);write(a.filter(x=>!ids.has(x.id)));render()}document.addEventListener('click',e=>{const v=e.target.closest('[data-view]');if(v)setView(v.dataset.view);const g=e.target.closest('[data-go]');if(g)setView(g.dataset.go);const o=e.target.closest('[data-open]');if(o)openApp(o.dataset.open);const d=e.target.closest('[data-delete]');if(d){e.stopPropagation();trash(d.dataset.delete)}const r=e.target.closest('[data-restore]');if(r)restore(r.dataset.restore);const p=e.target.closest('[data-purge]');if(p)purge(p.dataset.purge);const item=e.target.closest('[data-item]');if(item&&!d){const x=read().find(z=>z.id===item.dataset.item);if(x?.type==='folder')setView('documents',x.id);else if(x?.type==='text')edit(x)}if(e.target.closest('[data-close]'))close()});$('#back').onclick=()=>{const h=history.pop();if(h){view=h[0];parentId=h[1];render()}};$('#home').onclick=()=>setView('home','root');$('#newFolder').onclick=makeFolder;$('#newText').onclick=makeText;$('#emptyTrash').onclick=()=>{write(read().filter(i=>!i.trashed));render()};$('#modalClose').onclick=close;render()})();</script></body></html>
