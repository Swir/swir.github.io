<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SWIR File Explorer 1.7</title><style>:root{color-scheme:dark;--l:rgba(105,201,255,.18);--a:#00d8ff;--m:#7f9db2;--ok:#50e3a4;--bad:#ff718c}*{box-sizing:border-box}html,body{margin:0;height:100%;background:linear-gradient(145deg,#030914,#071525 55%,#03101b);color:#ecf8ff;font-family:Inter,Segoe UI,Arial;overflow:hidden}button,input,textarea{font:inherit}.app{display:grid;grid-template-rows:48px 1fr 28px;height:100%}.bar{display:flex;gap:8px;align-items:center;padding:7px 9px;border-bottom:1px solid var(--l);background:#030b14dd}.btn{border:1px solid var(--l);border-radius:9px;background:#ffffff08;color:#dff6ff;padding:7px 10px;cursor:pointer;font:800 10px Consolas,monospace}.btn:hover{border-color:#00d8ff77}.path{flex:1;min-width:60px;padding:8px 11px;border:1px solid var(--l);border-radius:9px;background:#04101d;color:#a9c8dc;font:700 10px Consolas,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.main{display:grid;grid-template-columns:190px 1fr;min-height:0}.side{padding:10px;border-right:1px solid var(--l);background:#030c16aa;overflow:auto}.side button{width:100%;display:flex;gap:9px;border:0;border-radius:10px;background:transparent;color:#a9c4d8;padding:9px;cursor:pointer}.side button:hover,.side button.active{background:#00a6ff16;color:#fff}.content{padding:14px;overflow:auto}.head{display:flex;justify-content:space-between;align-items:end;gap:10px;margin-bottom:14px}.head h1{margin:0;font-size:22px}.head p{margin:4px 0 0;color:var(--m);font-size:11px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:10px}.item{position:relative;min-height:126px;padding:13px;border:1px solid var(--l);border-radius:15px;background:linear-gradient(145deg,#0c1f34c7,#05111fb8);cursor:pointer;color:#ecf8ff;user-select:none}.item:hover,.item:focus{border-color:#00d8ff77;outline:none}.ico{width:42px;height:42px;border:1px solid var(--l);border-radius:12px;display:grid;place-items:center;margin-bottom:10px;color:var(--a);font:900 11px Consolas,monospace}.item strong{display:block;font-size:12px;overflow:hidden;text-overflow:ellipsis}.item span{display:block;color:var(--m);font-size:9px;margin-top:5px;line-height:1.4}.assoc{color:#72cfea!important}.mini{position:absolute;right:8px;top:8px;width:27px;height:27px;border:1px solid #ffffff16;border-radius:8px;background:#0003;color:#9ab;cursor:pointer}.empty{grid-column:1/-1;padding:36px;border:1px dashed var(--l);border-radius:15px;text-align:center;color:var(--m)}.status{display:flex;justify-content:space-between;align-items:center;padding:0 10px;border-top:1px solid var(--l);color:#6f91a8;background:#040c16;font:9px Consolas,monospace}.status .ok{color:var(--ok)}.status .bad{color:var(--bad)}.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;padding:16px;z-index:20}.modal.open{display:grid}.dialog{width:min(680px,94vw);max-height:90vh;background:#071526;border:1px solid #00d8ff44;border-radius:18px;overflow:auto}.dh,.da{padding:12px 14px;border-bottom:1px solid var(--l);display:flex;justify-content:space-between;gap:8px}.da{border-bottom:0;border-top:1px solid var(--l);justify-content:flex-end;flex-wrap:wrap}.db{padding:14px}.field{width:100%;padding:10px;border:1px solid var(--l);border-radius:10px;background:#03101d;color:white}textarea.field{margin-top:10px;min-height:260px;resize:vertical}.handler{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--l);border-radius:11px;margin:7px 0;background:#ffffff04}.handler .ico{margin:0;width:38px;height:38px}.handler button{margin-left:auto}.detail{display:grid;grid-template-columns:120px 1fr;gap:8px;padding:7px 0;border-bottom:1px solid #ffffff0a;font:9px/1.5 Consolas,monospace}.detail span:first-child{color:#6f91a5}.appdata{border-style:dashed}.appdata .ico{color:#b58cff}@media(max-width:650px){.main{grid-template-columns:1fr}.side{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--l);padding:7px}.side button{width:auto;white-space:nowrap}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.bar{overflow:auto}.bar #newFolder{display:none}.detail{grid-template-columns:1fr;gap:2px}}</style></head><body><div class="app"><div class="bar"><button class="btn" id="back">←</button><button class="btn" id="home">HOME</button><div class="path" id="path">SWIR://HOME</div><button class="btn" id="importFile">IMPORT</button><button class="btn" id="newFolder">+ FOLDER</button><button class="btn" id="newText">+ TEXT</button><input id="picker" type="file" multiple hidden></div><div class="main"><aside class="side"><button data-view="home" class="active">⌂ Home</button><button data-view="apps">◫ Apps</button><button data-view="documents">▤ Documents</button><button data-view="appdata">◇ App Data</button><button data-view="trash">⌫ Trash</button></aside><main class="content"><div class="head"><div><h1 id="title">File Explorer</h1><p id="sub">SWIR OS virtual filesystem.</p></div><button id="emptyTrash" class="btn" style="display:none">EMPTY TRASH</button></div><section id="grid" class="grid"></section><div id="empty" style="display:none"></div></main></div><div class="status"><span id="status">READY</span><span>SWIR FS 1.7 // ASSOCIATIONS ONLINE</span></div></div><div id="modal" class="modal"><div class="dialog"><div class="dh"><strong id="modalTitle">FILE</strong><button class="btn" id="modalClose">×</button></div><div class="db" id="modalBody"></div><div class="da" id="modalActions"></div></div></div><script>
(()=>{'use strict';const KEY='swir-vfs-v12',$=s=>document.querySelector(s);let view='home',parentId='root',history=[];const textExt=new Set(['txt','html','htm','css','js','json','md','log','csv','xml','ini','cfg']);function assoc(){try{return parent.SwirAssociations}catch{return null}}function osApps(){try{return parent.SwirOS?.apps||[]}catch{return[]}}function packages(){try{return parent.SWIR_PACKAGE_CATALOG||[]}catch{return[]}}function installed(){try{const v=JSON.parse(localStorage.getItem('swir-installed-apps')||'[]');return new Set(Array.isArray(v)?v:[])}catch{return new Set()}}function read(){try{const v=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(v)?v.map(x=>x.type==='text'?{...x,type:'file',mime:'text/plain',encoding:'text',size:(x.content||'').length}:x):[]}catch{return[]}}function write(v){try{localStorage.setItem(KEY,JSON.stringify(v));dispatchEvent(new Event('storage'));setStatus('FILESYSTEM SAVED','ok')}catch(err){setStatus('STORAGE FULL — remove large files','bad');throw err}}function uid(){return'f-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7)}function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function setStatus(t,c=''){const s=$('#status');s.textContent=t;s.className=c}function openApp(id){parent.postMessage({type:'SWIR_V12_OPEN_APP',id},location.origin)}function ext(name){const p=String(name||'').split('.');return p.length>1?p.pop().toLowerCase():''}function iconFor(i){if(i.type==='folder')return'▰';const e=ext(i.name);if(e==='pdf')return'PDF';if(e==='zip')return'ZIP';if(['png','jpg','jpeg','webp','gif'].includes(e))return'IMG';if(['html','htm','css','js','json'].includes(e))return'</>';return'FILE'}function isText(i){return i.encoding==='text'||String(i.mime||'').startsWith('text/')||textExt.has(ext(i.name))}function defaultName(i){return assoc()?.defaultFor?.(i.name)?.name||'No installed handler'}function setView(v,p='root',push=true){if(push)history.push([view,parentId]);view=v;parentId=p;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render()}function pathName(items){if(view==='home')return'SWIR://HOME';if(view==='apps')return'SWIR://APPS';if(view==='appdata')return'SWIR://APPDATA';if(view==='trash')return'SWIR://TRASH';const names=[];let p=parentId;while(p&&p!=='root'){const i=items.find(x=>x.id===p);if(!i)break;names.unshift(i.name);p=i.parent}return'SWIR://DOCUMENTS/'+names.join('/')}function card(icon,name,desc,attrs,extra='',cls=''){return`<article class="item ${cls}" role="button" tabindex="0" ${attrs}><div class="ico">${esc(icon)}</div><strong>${esc(name)}</strong><span>${esc(desc)}</span>${extra}</article>`}function render(){const items=read();$('#path').textContent=pathName(items);$('#emptyTrash').style.display=view==='trash'?'block':'none';const docs=view==='documents';$('#newFolder').style.display=$('#newText').style.display=$('#importFile').style.display=docs?'block':'none';if(view==='home'){$('#title').textContent='File Explorer';$('#sub').textContent='Applications, documents, app data and Trash.';$('#grid').innerHTML=card('◫','Applications','Browse registered SWIR OS applications.','data-go="apps"')+card('▤','Documents','Virtual files with Open With associations.','data-go="documents"')+card('◇','App Data','Private namespaced application storage.','data-go="appdata"')+card('⌫','Trash','Restore or permanently remove files.','data-go="trash"')}else if(view==='apps'){$('#title').textContent='Applications';$('#sub').textContent='Current system and installed package registry.';$('#grid').innerHTML=osApps().map(a=>card(a.icon||'APP',a.title,a.optional?'Installed SWIR App Package':a.subtitle||'System application',`data-open="${esc(a.id)}"`)).join('')||'<div class="empty">No applications.</div>'}else if(view==='appdata'){const on=installed(),list=packages().filter(p=>on.has(p.id));$('#title').textContent='App Data';$('#sub').textContent='Private storage namespaces. Apps access these through SWIR App SDK.';$('#grid').innerHTML=list.length?list.map(p=>card('◇',p.name,p.appData||`SWIR://APPDATA/${p.id.toUpperCase()}`,`data-open="${p.id}"`,'','appdata')).join(''):'<div class="empty">No installable application data directories yet.</div>'}else if(view==='documents'){const list=items.filter(i=>!i.trashed&&i.parent===parentId);$('#title').textContent=parentId==='root'?'Documents':(items.find(i=>i.id===parentId)?.name||'Documents');$('#sub').textContent='Double-click a file to open it with its default installed application.';$('#grid').innerHTML=list.length?list.map(i=>card(iconFor(i),i.name,i.type==='folder'?'Virtual folder':`${i.mime||'file'} • ${formatSize(i.size||contentSize(i))}`,`data-item="${i.id}"`,`<span class="assoc">${i.type==='folder'?'':esc(defaultName(i))}</span><button class="mini" data-delete="${i.id}" title="Move to Trash">×</button>`)).join(''):'<div class="empty">Folder is empty. Create or import a file.</div>'}else if(view==='trash'){const list=items.filter(i=>i.trashed);$('#title').textContent='Trash';$('#sub').textContent='Deleted virtual files.';$('#grid').innerHTML=list.length?list.map(i=>`<article class="item"><div class="ico">${iconFor(i)}</div><strong>${esc(i.name)}</strong><span>Deleted ${i.type}</span><div style="display:flex;gap:6px;margin-top:10px"><button class="btn" data-restore="${i.id}">RESTORE</button><button class="btn" data-purge="${i.id}">DELETE</button></div></article>`).join(''):'<div class="empty">Trash is empty.</div>'}}function contentSize(i){return i.encoding==='text'?(i.content||'').length:(i.dataUrl||'').length}function formatSize(n){n=Number(n)||0;if(n<1024)return n+' B';if(n<1048576)return(n/1024).toFixed(1)+' KB';return(n/1048576).toFixed(1)+' MB'}function modal(t,b,a){$('#modalTitle').textContent=t;$('#modalBody').innerHTML=b;$('#modalActions').innerHTML=a;$('#modal').classList.add('open')}function close(){ $('#modal').classList.remove('open') }function makeFolder(){modal('NEW FOLDER','<input id="nameField" class="field" placeholder="Folder name">','<button class="btn" data-close>CANCEL</button><button class="btn" id="createFolder">CREATE</button>');$('#createFolder').onclick=()=>{const n=$('#nameField').value.trim();if(!n)return;const a=read();a.push({id:uid(),type:'folder',name:n,parent:parentId,trashed:false,created:Date.now()});write(a);close();render()}}function makeText(){modal('NEW TEXT','<input id="nameField" class="field" placeholder="File name"><textarea id="contentField" class="field" placeholder="Write..."></textarea>','<button class="btn" data-close>CANCEL</button><button class="btn" id="saveNew">SAVE</button>');$('#saveNew').onclick=()=>{const raw=$('#nameField').value.trim()||'Untitled.txt',name=raw.includes('.')?raw:raw+'.txt',content=$('#contentField').value,a=read();a.push({id:uid(),type:'file',name,content,encoding:'text',mime:'text/plain',size:content.length,parent:parentId,trashed:false,created:Date.now(),updated:Date.now()});write(a);close();render()}}function edit(i){modal('EDIT '+i.name,`<input id="editName" class="field" value="${esc(i.name)}"><textarea id="editContent" class="field">${esc(i.content||'')}</textarea>`,'<button class="btn" data-close>CANCEL</button><button class="btn" id="saveEdit">SAVE</button>');$('#saveEdit').onclick=()=>{const a=read(),k=a.findIndex(x=>x.id===i.id);if(k<0)return;a[k].name=$('#editName').value.trim()||i.name;a[k].content=$('#editContent').value;a[k].encoding='text';a[k].size=a[k].content.length;a[k].updated=Date.now();write(a);close();render()}}function payload(i){return{id:i.id,name:i.name,mime:i.mime||'application/octet-stream',encoding:i.encoding||'text',content:i.content||'',dataUrl:i.dataUrl||'',size:i.size||contentSize(i),source:'SWIR File Explorer'}}async function openDefault(i,preferred=null){if(i.type==='folder')return setView('documents',i.id);try{const app=await assoc()?.openFile?.(payload(i),preferred);if(app){setStatus(`OPENING ${i.name} WITH ${app.name}`,'ok');close()}}catch(err){if(isText(i)&&!preferred){edit(i)}else setStatus(err?.message||'No application for this file','bad')}}function openWith(i){const handlers=assoc()?.handlersFor?.(i.name)||[];const body=handlers.length?handlers.map(h=>`<div class="handler"><div class="ico">${esc(h.icon)}</div><div><strong>${esc(h.name)}</strong><div style="color:#7899ad;font:8px Consolas">${esc(h.packageId)} • v${esc(h.version)}</div></div><button class="btn" data-use-handler="${h.id}" data-file-id="${i.id}">OPEN</button></div>`).join(''):'<div class="empty">No installed handler. Install a compatible app from SWIR Store.</div>';modal('OPEN WITH — '+i.name,body,handlers.length?'<button class="btn" data-close>CANCEL</button>':'<button class="btn" data-store>OPEN SWIR STORE</button><button class="btn" data-close>CANCEL</button>')}function info(i){const d=defaultName(i),body=`<div class="detail"><span>NAME</span><span>${esc(i.name)}</span></div><div class="detail"><span>TYPE</span><span>${esc(i.mime||i.type)}</span></div><div class="detail"><span>SIZE</span><span>${formatSize(i.size||contentSize(i))}</span></div><div class="detail"><span>DEFAULT APP</span><span>${esc(d)}</span></div><div class="detail"><span>PATH</span><span>${esc(pathName(read())+'/'+i.name)}</span></div>`;const editBtn=isText(i)?'<button class="btn" data-edit-current>EDIT</button>':'';modal(i.name,body,`<button class="btn" data-open-current>OPEN</button><button class="btn" data-openwith-current>OPEN WITH…</button>${editBtn}<button class="btn" data-export-current>EXPORT</button><button class="btn" data-close>CLOSE</button>`);$('#modal').dataset.current=i.id}function descendants(a,id){const ids=new Set([id]);let changed=true;while(changed){changed=false;a.forEach(x=>{if(ids.has(x.parent)&&!ids.has(x.id)){ids.add(x.id);changed=true}})}return ids}function trash(id){const a=read(),ids=descendants(a,id);a.forEach(x=>{if(ids.has(x.id))x.trashed=true});write(a);render()}function restore(id){const a=read(),i=a.find(x=>x.id===id);if(i){i.trashed=false;if(i.parent!=='root'&&!a.some(x=>x.id===i.parent&&!x.trashed))i.parent='root';write(a);render()}}function purge(id){const a=read(),ids=descendants(a,id);write(a.filter(x=>!ids.has(x.id)));render()}async function exportFile(i){let blob;if(i.encoding==='dataurl'){blob=await fetch(i.dataUrl).then(r=>r.blob())}else blob=new Blob([i.content||''],{type:i.mime||'text/plain;charset=utf-8'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=i.name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);setStatus(`${i.name} EXPORTED`,'ok')}async function importFiles(files){for(const f of files){if(f.size>2.5*1024*1024){setStatus(`${f.name} TOO LARGE FOR WEB VFS (2.5 MB LIMIT)`,'bad');continue}const e=ext(f.name),text=f.type.startsWith('text/')||textExt.has(e);const item={id:uid(),type:'file',name:f.name,mime:f.type||'application/octet-stream',size:f.size,parent:parentId,trashed:false,created:Date.now(),updated:Date.now()};if(text){item.encoding='text';item.content=await f.text()}else{item.encoding='dataurl';item.dataUrl=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result));r.onerror=()=>rej(r.error);r.readAsDataURL(f)})}const a=read();a.push(item);write(a)}render()}function current(){const id=$('#modal').dataset.current;return read().find(x=>x.id===id)}document.addEventListener('click',e=>{const v=e.target.closest('[data-view]');if(v)setView(v.dataset.view);const g=e.target.closest('[data-go]');if(g)setView(g.dataset.go);const o=e.target.closest('[data-open]');if(o)openApp(o.dataset.open);const d=e.target.closest('[data-delete]');if(d){e.stopPropagation();trash(d.dataset.delete)}const r=e.target.closest('[data-restore]');if(r)restore(r.dataset.restore);const p=e.target.closest('[data-purge]');if(p)purge(p.dataset.purge);const item=e.target.closest('[data-item]');if(item&&!d){const x=read().find(z=>z.id===item.dataset.item);if(x?.type==='folder')setView('documents',x.id);else if(x)info(x)}const h=e.target.closest('[data-use-handler]');if(h){const x=read().find(z=>z.id===h.dataset.fileId);if(x)openDefault(x,h.dataset.useHandler)}if(e.target.closest('[data-store]')){openApp('store');close()}if(e.target.closest('[data-open-current]')){const x=current();if(x)openDefault(x)}if(e.target.closest('[data-openwith-current]')){const x=current();if(x)openWith(x)}if(e.target.closest('[data-edit-current]')){const x=current();if(x)edit(x)}if(e.target.closest('[data-export-current]')){const x=current();if(x)exportFile(x)}if(e.target.closest('[data-close]'))close()});$('#grid').addEventListener('dblclick',e=>{const item=e.target.closest('[data-item]');if(!item)return;const x=read().find(z=>z.id===item.dataset.item);if(x)openDefault(x)});$('#grid').addEventListener('keydown',e=>{if(e.key!=='Enter')return;const item=e.target.closest('[data-item]');if(!item)return;const x=read().find(z=>z.id===item.dataset.item);if(x)openDefault(x)});$('#back').onclick=()=>{const h=history.pop();if(h){view=h[0];parentId=h[1];render()}};$('#home').onclick=()=>setView('home','root');$('#newFolder').onclick=makeFolder;$('#newText').onclick=makeText;$('#importFile').onclick=()=>$('#picker').click();$('#picker').onchange=e=>{importFiles([...e.target.files]).catch(err=>setStatus(err.message,'bad'));e.target.value=''};$('#emptyTrash').onclick=()=>{write(read().filter(i=>!i.trashed));render()};$('#modalClose').onclick=close;render()})();</script></body></html>
