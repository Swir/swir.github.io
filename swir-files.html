<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SWIR File Explorer</title>
<style>
:root{color-scheme:dark;--bg:#050c16;--panel:#081626;--panel2:#0b1d31;--line:rgba(105,201,255,.18);--text:#ecf8ff;--muted:#7f9db2;--accent:#00a6ff;--accent2:#00d8ff;--ok:#50e3a4;--danger:#ff6b81}*{box-sizing:border-box}html,body{margin:0;height:100%;background:linear-gradient(145deg,#030914,#071525 55%,#03101b);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif;overflow:hidden}button,input,textarea{font:inherit}.app{display:grid;grid-template-rows:48px 1fr 28px;height:100%}.toolbar{display:flex;align-items:center;gap:8px;padding:7px 9px;border-bottom:1px solid var(--line);background:rgba(3,11,20,.88)}.btn{border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.035);color:#dff6ff;padding:7px 10px;cursor:pointer;font:800 10px ui-monospace,Consolas,monospace}.btn:hover{border-color:rgba(0,216,255,.5);background:rgba(0,166,255,.08)}.path{flex:1;min-width:80px;padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:#04101d;color:#a9c8dc;font:700 10px ui-monospace,Consolas,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.main{display:grid;grid-template-columns:180px 1fr;min-height:0}.side{padding:10px;border-right:1px solid var(--line);background:rgba(3,12,22,.68);overflow:auto}.side button{width:100%;display:flex;gap:9px;align-items:center;border:0;border-radius:10px;background:transparent;color:#a9c4d8;padding:9px;cursor:pointer;text-align:left}.side button:hover,.side button.active{background:rgba(0,166,255,.09);color:#eaf8ff}.side small{display:block;color:#5f8098;margin-top:3px}.content{padding:14px;overflow:auto}.head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:14px}.head h1{font-size:22px;margin:0}.head p{margin:4px 0 0;color:var(--muted);font-size:11px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.item{position:relative;min-height:116px;padding:13px;border:1px solid var(--line);border-radius:15px;background:linear-gradient(145deg,rgba(12,31,52,.78),rgba(5,17,31,.72));cursor:pointer;text-align:left;color:var(--text)}.item:hover{border-color:rgba(0,216,255,.46);transform:translateY(-1px)}.ico{width:42px;height:42px;border:1px solid var(--line);border-radius:12px;display:grid;place-items:center;margin-bottom:10px;background:rgba(0,166,255,.06);color:var(--accent2);font:900 13px ui-monospace,Consolas,monospace}.item strong{display:block;font-size:12px}.item span{display:block;color:var(--muted);font-size:10px;margin-top:5px;line-height:1.35}.item .mini{position:absolute;right:8px;top:8px;width:26px;height:26px;border:1px solid rgba(255,255,255,.08);border-radius:8px;background:rgba(0,0,0,.16);color:#8fb2c8;cursor:pointer}.item .mini:hover{color:white;border-color:rgba(255,107,129,.35)}.empty{padding:34px;border:1px dashed var(--line);border-radius:15px;text-align:center;color:var(--muted)}.status{display:flex;align-items:center;justify-content:space-between;padding:0 10px;border-top:1px solid var(--line);color:#6f91a8;background:#040c16;font:9px ui-monospace,Consolas,monospace}.modal{position:fixed;inset:0;background:rgba(0,5,12,.72);display:none;place-items:center;padding:16px}.modal.open{display:grid}.dialog{width:min(650px,94vw);max-height:86vh;display:flex;flex-direction:column;border:1px solid rgba(0,200,255,.25);border-radius:18px;background:#071526;box-shadow:0 30px 90px rgba(0,0,0,.55);overflow:hidden}.dialog-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}.dialog-head strong{font:800 11px ui-monospace,Consolas,monospace}.dialog-body{padding:14px;overflow:auto}.field{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:#03101d;color:white;outline:none}.field:focus{border-color:rgba(0,216,255,.55)}textarea.field{min-height:260px;resize:vertical;line-height:1.6}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}@media(max-width:650px){.main{grid-template-columns:1fr}.side{display:flex;border-right:0;border-bottom:1px solid var(--line);overflow:auto;padding:7px}.side button{width:auto;min-width:max-content}.side small{display:none}.toolbar .btn.hide-mobile{display:none}.content{padding:10px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="app">
  <div class="toolbar"><button id="back" class="btn">←</button><button id="home" class="btn">HOME</button><div id="path" class="path">SWIR://HOME</div><button id="newFolder" class="btn hide-mobile">+ FOLDER</button><button id="newText" class="btn">+ TEXT</button></div>
  <div class="main">
    <aside class="side">
      <button data-view="home" class="active"><b>⌂</b><span>Home<small>System overview</small></span></button>
      <button data-view="preserved"><b>▣</b><span>Preserved<small>Original folders</small></span></button>
      <button data-view="documents"><b>▤</b><span>Documents<small>Local virtual files</small></span></button>
      <button data-view="trash"><b>⌫</b><span>Trash<small>Restore or remove</small></span></button>
    </aside>
    <main class="content"><div class="head"><div><h1 id="title">File Explorer</h1><p id="subtitle">SWIR OS virtual storage and preserved folders.</p></div><button id="emptyTrash" class="btn" style="display:none">EMPTY TRASH</button></div><section id="grid" class="grid"></section></main>
  </div>
  <div class="status"><span id="status">READY</span><span>SWIR FS // LOCAL STORAGE</span></div>
</div>

<div id="modal" class="modal"><div class="dialog"><div class="dialog-head"><strong id="modalTitle">EDITOR</strong><button id="closeModal" class="btn">×</button></div><div id="modalBody" class="dialog-body"></div><div id="modalActions" class="dialog-actions"></div></div></div>
<script>
const KEY='swir-vfs-v12';
const preserved=[
 {id:'atari',icon:'A',name:'Atari',desc:'Preserved Atari folder'},
 {id:'c64',icon:'64',name:'Commodore 64',desc:'Preserved C64 folder'},
 {id:'mac',icon:'M',name:'Classic Mac',desc:'Preserved Macintosh folder'},
 {id:'matrix',icon:'▦',name:'Matrix',desc:'Preserved Matrix experiment'},
 {id:'winamp',icon:'♫',name:'Winamp',desc:'Preserved Winamp folder'},
 {id:'time',icon:'◷',name:'Time Lab',desc:'Preserved clock experiment'},
 {id:'time2',icon:'◴',name:'Time Lab 2',desc:'Preserved clock experiment'},
 {id:'tomi',icon:'T',name:'Tomi Lab',desc:'Preserved SWIR experiment'},
 {id:'test',icon:'⚗',name:'Test Lab',desc:'Development sandbox'},
 {id:'testy',icon:'✦',name:'Test Lab 2',desc:'Development sandbox'}
];
let view='home', currentParent='root', history=[];
const $=s=>document.querySelector(s);
function read(){try{const v=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(v)?v:[]}catch{return[]}}
function write(v){localStorage.setItem(KEY,JSON.stringify(v));window.dispatchEvent(new Event('storage'));}
function uid(){return 'f-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7)}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function notify(msg){$('#status').textContent=msg;setTimeout(()=>$('#status').textContent='READY',1800)}
function openApp(id){parent.postMessage({type:'SWIR_V12_OPEN_APP',id},location.origin)}
function setView(next,parent='root',push=true){if(push)history.push({view,currentParent});view=next;currentParent=parent;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===next));render()}
function pathName(items){if(view==='home')return'SWIR://HOME';if(view==='preserved')return'SWIR://PRESERVED';if(view==='trash')return'SWIR://TRASH';if(view==='documents'){const names=[];let p=currentParent;while(p&&p!=='root'){const x=items.find(i=>i.id===p);if(!x)break;names.unshift(x.name);p=x.parent}return'SWIR://DOCUMENTS/'+names.join('/')}return'SWIR://'}
function card(icon,name,desc,action,menu=''){return `<button class="item" ${action}><div class="ico">${esc(icon)}</div><strong>${esc(name)}</strong><span>${esc(desc)}</span>${menu}</button>`}
function render(){const items=read();$('#path').textContent=pathName(items);$('#emptyTrash').style.display=view==='trash'?'block':'none';const grid=$('#grid');
 if(view==='home'){$('#title').textContent='File Explorer';$('#subtitle').textContent='SWIR OS virtual storage and preserved folders.';grid.innerHTML=card('▣','Preserved','Original site folders. Read-only from Explorer.','data-go="preserved"')+card('▤','Documents','Create local folders and text files in this browser.','data-go="documents"')+card('⌫','Trash','Recover deleted virtual files.','data-go="trash"')+card('N','Notes','Open the autosaving Notes application.','data-open="notes"');}
 if(view==='preserved'){$('#title').textContent='Preserved folders';$('#subtitle').textContent='These launch existing folders without modifying them.';grid.innerHTML=preserved.map(x=>card(x.icon,x.name,x.desc,`data-open="${x.id}"`)).join('');}
 if(view==='documents'){const list=items.filter(i=>!i.trashed&&i.parent===currentParent);$('#title').textContent=currentParent==='root'?'Documents':(items.find(i=>i.id===currentParent)?.name||'Documents');$('#subtitle').textContent='Local virtual filesystem stored only in this browser.';grid.innerHTML=list.length?list.map(i=>card(i.type==='folder'?'▰':'TXT',i.name,i.type==='folder'?'Virtual folder':'Text document',`data-item="${i.id}"`,`<button class="mini" data-delete="${i.id}" title="Move to Trash">×</button>`)).join(''):'<div class="empty">This folder is empty.<br>Create a folder or text document.</div>'}
 if(view==='trash'){const list=items.filter(i=>i.trashed);$('#title').textContent='Trash';$('#subtitle').textContent='Deleted virtual items can be restored or removed permanently.';grid.innerHTML=list.length?list.map(i=>`<article class="item"><div class="ico">${i.type==='folder'?'▰':'TXT'}</div><strong>${esc(i.name)}</strong><span>Deleted virtual ${i.type}</span><div style="display:flex;gap:6px;margin-top:10px"><button class="btn" data-restore="${i.id}">RESTORE</button><button class="btn" data-purge="${i.id}">DELETE</button></div></article>`).join(''):'<div class="empty">Trash is empty.</div>'}
}
function modal(title,body,actions){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modalActions').innerHTML=actions;$('#modal').classList.add('open')}
function closeModal(){$('#modal').classList.remove('open')}
function createFolder(){modal('NEW FOLDER','<input id="nameField" class="field" placeholder="Folder name" maxlength="60">','<button class="btn" data-modal-close>CANCEL</button><button class="btn" id="createFolderConfirm">CREATE</button>');setTimeout(()=>$('#nameField')?.focus(),40);$('#createFolderConfirm').onclick=()=>{const name=$('#nameField').value.trim();if(!name)return;const items=read();items.push({id:uid(),type:'folder',name,parent:currentParent,trashed:false,created:Date.now()});write(items);closeModal();render();notify('FOLDER CREATED')}}
function createText(){modal('NEW TEXT DOCUMENT','<input id="nameField" class="field" placeholder="Document name" maxlength="60"><textarea id="contentField" class="field" placeholder="Write something..." style="margin-top:10px"></textarea>','<button class="btn" data-modal-close>CANCEL</button><button class="btn" id="createTextConfirm">SAVE</button>');setTimeout(()=>$('#nameField')?.focus(),40);$('#createTextConfirm').onclick=()=>{const name=($('#nameField').value.trim()||'Untitled')+(($('#nameField').value||'').trim().toLowerCase().endsWith('.txt')?'':'.txt');const items=read();items.push({id:uid(),type:'text',name,content:$('#contentField').value,parent:currentParent,trashed:false,created:Date.now(),updated:Date.now()});write(items);closeModal();render();notify('DOCUMENT SAVED')}}
function editText(item){modal(item.name,`<input id="nameField" class="field" value="${esc(item.name)}"><textarea id="contentField" class="field" style="margin-top:10px">${esc(item.content||'')}</textarea>`,'<button class="btn" id="exportText">EXPORT</button><button class="btn" data-modal-close>CANCEL</button><button class="btn" id="saveText">SAVE</button>');$('#saveText').onclick=()=>{const items=read(),i=items.findIndex(x=>x.id===item.id);if(i<0)return;items[i].name=$('#nameField').value.trim()||item.name;items[i].content=$('#contentField').value;items[i].updated=Date.now();write(items);closeModal();render();notify('DOCUMENT SAVED')};$('#exportText').onclick=()=>{const blob=new Blob([$('#contentField').value],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=$('#nameField').value||'document.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}}
function trash(id){const items=read(),i=items.findIndex(x=>x.id===id);if(i<0)return;const ids=new Set([id]);let changed=true;while(changed){changed=false;items.forEach(x=>{if(ids.has(x.parent)&&!ids.has(x.id)){ids.add(x.id);changed=true}})}items.forEach(x=>{if(ids.has(x.id))x.trashed=true});write(items);render();notify('MOVED TO TRASH')}
function restore(id){const items=read(),i=items.findIndex(x=>x.id===id);if(i<0)return;items[i].trashed=false;if(items[i].parent!=='root'&&!items.some(x=>x.id===items[i].parent&&!x.trashed))items[i].parent='root';write(items);render();notify('RESTORED')}
function purge(id){let items=read();const ids=new Set([id]);let changed=true;while(changed){changed=false;items.forEach(x=>{if(ids.has(x.parent)&&!ids.has(x.id)){ids.add(x.id);changed=true}})}items=items.filter(x=>!ids.has(x.id));write(items);render();notify('PERMANENTLY DELETED')}
document.addEventListener('click',e=>{const t=e.target;if(t.closest('[data-modal-close]'))return closeModal();const open=t.closest('[data-open]');if(open)return openApp(open.dataset.open);const go=t.closest('[data-go]');if(go)return setView(go.dataset.go);const del=t.closest('[data-delete]');if(del){e.stopPropagation();return trash(del.dataset.delete)}const res=t.closest('[data-restore]');if(res)return restore(res.dataset.restore);const pur=t.closest('[data-purge]');if(pur)return purge(pur.dataset.purge);const it=t.closest('[data-item]');if(it){const item=read().find(x=>x.id===it.dataset.item);if(!item)return;if(item.type==='folder')setView('documents',item.id);else editText(item)}});
$('#newFolder').onclick=()=>{if(view!=='documents')setView('documents','root');createFolder()};$('#newText').onclick=()=>{if(view!=='documents')setView('documents','root');createText()};$('#home').onclick=()=>setView('home');$('#back').onclick=()=>{const prev=history.pop();if(prev){view=prev.view;currentParent=prev.currentParent;render()}else if(view==='documents'&&currentParent!=='root'){const p=read().find(x=>x.id===currentParent)?.parent||'root';currentParent=p;render()}else setView('home','root',false)};$('#closeModal').onclick=closeModal;$('#emptyTrash').onclick=()=>{if(confirm('Permanently delete everything in Trash?')){write(read().filter(x=>!x.trashed));render();notify('TRASH EMPTIED')}};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));
window.addEventListener('storage',render);render();
</script>
</body>
</html>
