<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SWIR Atari Lab</title><style>:root{color-scheme:dark;--a:#ff7b54;--b:#111;--l:rgba(255,123,84,.25)}*{box-sizing:border-box}body{margin:0;background:#060606;color:#fff;font-family:Consolas,monospace;min-height:100vh}.app{display:grid;grid-template-rows:auto 1fr auto;min-height:100vh}.top{padding:14px 18px;border-bottom:1px solid var(--l);display:flex;justify-content:space-between;background:#0c0c0c}.brand strong{color:var(--a)}.main{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:14px;padding:14px}.screen{border:2px solid #2a2a2a;border-radius:18px;background:#000;padding:12px;box-shadow:inset 0 0 40px rgba(255,123,84,.08)}canvas{width:100%;height:auto;aspect-ratio:16/9;background:#000;border-radius:10px;display:block}.side{border:1px solid var(--l);border-radius:18px;padding:14px;background:#0b0b0b}.btn{width:100%;padding:10px;margin:6px 0;border:1px solid var(--l);background:#151515;color:#fff;border-radius:10px;cursor:pointer}.btn:hover{border-color:var(--a);color:var(--a)}.stat{font-size:12px;color:#b5b5b5;line-height:1.8}.foot{padding:9px 14px;color:#777;border-top:1px solid #222;font-size:11px}@media(max-width:760px){.main{grid-template-columns:1fr}.side{order:-1}}</style></head><body><div class="app"><header class="top"><div class="brand"><strong>SWIR ATARI LAB</strong> // 8-BIT CORE</div><div id="status">READY</div></header><main class="main"><section class="screen"><canvas id="game" width="960" height="540"></canvas></section><aside class="side"><div class="stat">ARCADE MODULE: PONG<br>INPUT: ↑ ↓ / W S<br>PAUSE: SPACE<br>RESET: R</div><button class="btn" id="start">START / RESUME</button><button class="btn" id="reset">RESET GAME</button><button class="btn" id="ai">AI: NORMAL</button><hr style="border-color:#222"><div class="stat">PLAYER <span id="p1">0</span><br>CORE <span id="p2">0</span></div></aside></main><footer class="foot">Native SWIR OS retro module • No ROM required</footer></div><script>const c=document.getElementById('game'),x=c.getContext('2d');let running=false,aiHard=false,keys={},score=[0,0];const p={y:220,h:100},cpu={y:220,h:100},ball={x:480,y:270,vx:6,vy:4,r:9};function resetBall(dir=1){ball.x=480;ball.y=270;ball.vx=6*dir;ball.vy=(Math.random()*6-3)||3}function reset(){score=[0,0];p.y=cpu.y=220;resetBall(Math.random()>.5?1:-1);draw();sync()}function sync(){p1.textContent=score[0];p2.textContent=score[1];status.textContent=running?'RUNNING':'PAUSED'}function draw(){x.fillStyle='#000';x.fillRect(0,0,c.width,c.height);x.strokeStyle='#2a2a2a';x.setLineDash([10,14]);x.beginPath();x.moveTo(480,0);x.lineTo(480,540);x.stroke();x.setLineDash([]);x.fillStyle='#ff7b54';x.fillRect(24,p.y,14,p.h);x.fillStyle='#fff';x.fillRect(922,cpu.y,14,cpu.h);x.beginPath();x.arc(ball.x,ball.y,ball.r,0,Math.PI*2);x.fill();x.font='48px Consolas';x.fillStyle='#333';x.fillText(score[0],390,60);x.fillText(score[1],540,60)}function loop(){if(running){if(keys.ArrowUp||keys.w)p.y-=8;if(keys.ArrowDown||keys.s)p.y+=8;p.y=Math.max(0,Math.min(440,p.y));const target=ball.y-cpu.h/2;cpu.y+=(target-cpu.y)*(aiHard?.12:.07);cpu.y=Math.max(0,Math.min(440,cpu.y));ball.x+=ball.vx;ball.y+=ball.vy;if(ball.y<ball.r||ball.y>540-ball.r)ball.vy*=-1;if(ball.x<45&&ball.x>20&&ball.y>p.y&&ball.y<p.y+p.h&&ball.vx<0){ball.vx=Math.abs(ball.vx)*1.03;ball.vy+=(ball.y-(p.y+p.h/2))*.05}if(ball.x>915&&ball.x<940&&ball.y>cpu.y&&ball.y<cpu.y+cpu.h&&ball.vx>0){ball.vx=-Math.abs(ball.vx)*1.03;ball.vy+=(ball.y-(cpu.y+cpu.h/2))*.05}if(ball.x<0){score[1]++;resetBall(1);sync()}if(ball.x>960){score[0]++;resetBall(-1);sync()}}draw();requestAnimationFrame(loop)}addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' '){running=!running;sync()}if(e.key.toLowerCase()==='r')reset()});addEventListener('keyup',e=>keys[e.key]=false);start.onclick=()=>{running=true;sync()};reset.onclick=reset;ai.onclick=()=>{aiHard=!aiHard;ai.textContent='AI: '+(aiHard?'HARD':'NORMAL')};reset();loop();</script></body></html>
