<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Archive Manager</title><style>
:root{color-scheme:dark;--a:#ffca72;--line:rgba(255,202,114,.22);--muted:#8a9bae}*{box-sizing:border-box}html,body{margin:0;height:100%;background:#050914;color:#fff8e9;font-family:Inter,Segoe UI,Arial}button,input{font:inherit}.app{height:100%;display:grid;grid-template-rows:auto 1fr 28px}.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:9px;border-bottom:1px solid var(--line);background:#10131b}.brand{font:900 11px ui-monospace,Consolas,monospace;color:var(--a);margin-right:auto}.btn{border:1px solid var(--line);border-radius:9px;background:#ffffff08;color:white;padding:8px 10px;font:800 9px ui-monospace,Consolas,monospace;cursor:pointer}.btn:hover{border-color:#ffca7288}.body{min-height:0;display:grid;grid-template-columns:1fr 1fr}.pane{min-width:0;overflow:auto;padding:14px}.pane:first-child{border-right:1px solid var(--line)}h2{font-size:13px;margin:0 0 12px}.drop{border:1px dashed #ffca7255;border-radius:15px;padding:18px;text-align:center;color:#9da8b2;background:#ffffff04}.list{display:grid;gap:7px;margin-top:12px}.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px;border:1px solid #ffffff0d;border-radius:11px;background:#ffffff04}.row strong{font-size:11px;overflow:hidden;text-overflow:ellipsis}.row span{font:8px ui-monospace,Consolas,monospace;color:var(--muted)}.mini{border:1px solid var(--line);border-radius:8px;background:#ffffff06;color:white;padding:6px 8px;font:800 8px ui-monospace,Consolas,monospace;cursor:pointer}.status{display:flex;justify-content:space-between;align-items:center;padding:0 10px;border-top:1px solid var(--line);background:#0b0f16;color:#77899b;font:8px ui-monospace,Consolas,monospace}@media(max-width:700px){.body{grid-template-columns:1fr}.pane:first-child{border-right:0;border-bottom:1px solid var(--line);max-height:48vh}.brand{width:100%}}
</style></head><body><main class="app"><header class="bar"><div class="brand">ARCHIVE MANAGER // swir.archive</div><button id="add" class="btn">ADD FILES</button><button id="make" class="btn">CREATE ZIP</button><button id="openZip" class="btn">OPEN ZIP</button><input id="files" type="file" multiple hidden><input id="zipfile" type="file" accept=".zip,application/zip" hidden></header><section class="body"><div class="pane"><h2>NEW ARCHIVE</h2><div class="drop">Select files and create a local ZIP archive.<br>Files are processed only in your browser.</div><div id="selected" class="list"></div></div><div class="pane"><h2>OPENED ARCHIVE</h2><div class="drop">Open a ZIP to inspect entries and extract supported files.</div><div id="entries" class="list"></div></div></section><footer class="status"><span id="state">READY</span><span>ZIP STORE + DEFLATE READ</span></footer></main><script>
(()=>{'use strict';const $=s=>document.querySelector(s);let picked=[],zipBytes=null,zipName='archive.zip';const enc=new TextEncoder(),dec=new TextDecoder();function crc32(bytes){let c=0xffffffff;for(const b of bytes){c^=b;for(let k=0;k<8;k++)c=(c>>>1)^((c&1)?0xedb88320:0)}return(c^0xffffffff)>>>0}function u16(v){return new Uint8Array([v&255,(v>>>8)&255])}function u32(v){return new Uint8Array([v&255,(v>>>8)&255,(v>>>16)&255,(v>>>24)&255])}function concat(parts){const n=parts.reduce((s,p)=>s+p.length,0),out=new Uint8Array(n);let o=0;for(const p of parts){out.set(p,o);o+=p.length}return out}async function makeZip(){if(!picked.length)return alert('Add files first.');$('#state').textContent='BUILDING ZIP...';let offset=0;const locals=[],centrals=[];for(const f of picked){const data=new Uint8Array(await f.arrayBuffer()),name=enc.encode(f.name),crc=crc32(data),local=concat([u32(0x04034b50),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),name,data]);locals.push(local);const central=concat([u32(0x02014b50),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset),name]);centrals.push(central);offset+=local.length}const cdir=concat(centrals),body=concat(locals),end=concat([u32(0x06054b50),u16(0),u16(0),u16(picked.length),u16(picked.length),u32(cdir.length),u32(body.length),u16(0)]),zip=concat([body,cdir,end]),blob=new Blob([zip],{type:'application/zip'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='swir-archive.zip';a.click();setTimeout(()=>URL.revokeObjectURL(url),1200);$('#state').textContent='ZIP CREATED'}function renderPicked(){selected.innerHTML=picked.map((f,i)=>`<div class="row"><div><strong>${f.name}</strong><span>${f.size} bytes</span></div><button class="mini" data-rm="${i}">REMOVE</button></div>`).join('')||'<div class="drop">NO FILES SELECTED</div>'}function rd16(d,o){return d[o]|d[o+1]<<8}function rd32(d,o){return(d[o]|d[o+1]<<8|d[o+2]<<16|d[o+3]<<24)>>>0}function parseCentral(data){let e=-1;for(let i=data.length-22;i>=Math.max(0,data.length-65557);i--){if(rd32(data,i)===0x06054b50){e=i;break}}if(e<0)throw new Error('ZIP directory not found');const count=rd16(data,e+10),off=rd32(data,e+16),list=[];let p=off;for(let i=0;i<count;i++){if(rd32(data,p)!==0x02014b50)throw new Error('Invalid central directory');const method=rd16(data,p+10),comp=rd32(data,p+20),size=rd32(data,p+24),nl=rd16(data,p+28),el=rd16(data,p+30),cl=rd16(data,p+32),local=rd32(data,p+42),name=dec.decode(data.slice(p+46,p+46+nl));list.push({name,method,comp,size,local});p+=46+nl+el+cl}return list}async function extract(entry){const d=zipBytes,o=entry.local;if(rd32(d,o)!==0x04034b50)throw new Error('Invalid local header');const nl=rd16(d,o+26),el=rd16(d,o+28),start=o+30+nl+el,raw=d.slice(start,start+entry.comp);let out;if(entry.method===0)out=raw;else if(entry.method===8&&'DecompressionStream'in window){const ds=new DecompressionStream('deflate-raw'),ab=await new Response(new Blob([raw]).stream().pipeThrough(ds)).arrayBuffer();out=new Uint8Array(ab)}else throw new Error('Compression method not supported here');const url=URL.createObjectURL(new Blob([out])),a=document.createElement('a');a.href=url;a.download=entry.name.split('/').pop()||'file';a.click();setTimeout(()=>URL.revokeObjectURL(url),1200)}async function openZip(f){zipName=f.name;zipBytes=new Uint8Array(await f.arrayBuffer());const list=parseCentral(zipBytes);entries.innerHTML=list.map((x,i)=>`<div class="row"><div><strong>${x.name}</strong><span>${x.size} bytes • method ${x.method}</span></div>${x.name.endsWith('/')?'':'<button class="mini" data-extract="'+i+'">EXTRACT</button>'}</div>`).join('')||'<div class="drop">EMPTY ARCHIVE</div>';entries._list=list;$('#state').textContent=`OPENED ${zipName} • ${list.length} entries`}$('#add').onclick=()=>files.click();files.onchange=e=>{picked=[...e.target.files];renderPicked()};selected.addEventListener('click',e=>{const b=e.target.closest('[data-rm]');if(!b)return;picked.splice(+b.dataset.rm,1);renderPicked()});$('#make').onclick=makeZip;$('#openZip').onclick=()=>zipfile.click();zipfile.onchange=e=>{const f=e.target.files[0];if(f)openZip(f).catch(err=>alert(err.message))};entries.addEventListener('click',e=>{const b=e.target.closest('[data-extract]');if(!b)return;extract(entries._list[+b.dataset.extract]).catch(err=>alert(err.message))});renderPicked()})();
</script></body></html>
