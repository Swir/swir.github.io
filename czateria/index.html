            background: #000;
            color: #0f0;
            border: 1px solid #0f0;
            font-family: monospace;
            font-size: 1.1em;
            font-weight: bold;

            transition: 0.3s;

    <script>
        // Pobieranie kodu z ukrytego taga, by uniknąć problemów z cudzysłowami
        const modCodeRaw = document.getElementById('rawModCode').textContent.trim();
        
        // Wypełnianie textarea i linku
        document.getElementById('codeArea').value = modCodeRaw;
        document.getElementById('bookmarkletLink').href = modCodeRaw;

        function copyToClipboard() {
            const copyText = document.getElementById("codeArea");
            copyText.select();
            document.execCommand("copy");
            alert("✅ Kod został pomyślnie skopiowany do schowka!\n\nUtwórz nową zakładkę w przeglądarce i wklej ten kod w polu 'Adres URL'.");
        }

        // --- EFEKT SPADAJĄCYCH ZNAKÓW MATRIX ---
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()<>:{}[]';
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = [];
        
        for(let x = 0; x < columns; x++) drops[x] = 1;
        
        function draw() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#0F0';
            ctx.font = fontSize + 'px monospace';
            
            for(let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                
                if(drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        setInterval(draw, 35);
        
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
