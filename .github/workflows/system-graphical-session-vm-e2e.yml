name: System Graphical Session UEFI E2E

on:
  push:
    branches: [main]
    paths:
      - 'system/session/swir-session-launcher.sh'
      - 'system/session/greetd-e2e-greeter.py'
      - 'system/session/provision-graphical-session.sh'
      - 'system/boot/plymouth/**'
      - 'system/e2e/debian13-graphical-session-vm-e2e.sh'
      - 'system/contracts/system-graphical-session-e2e.schema.json'
      - 'system/image/system-base-debian-trixie.json'
      - 'system/image/build-debian-trixie-rootfs.sh'
      - 'system/SWIR-GRAPHICAL-SESSION-E2E-0.1.md'
      - 'SWIR-OS-ARCHITECTURE.md'
      - '.github/workflows/system-graphical-session-vm-e2e.yml'
  pull_request:
    paths:
      - 'system/session/swir-session-launcher.sh'
      - 'system/session/greetd-e2e-greeter.py'
      - 'system/session/provision-graphical-session.sh'
      - 'system/boot/plymouth/**'
      - 'system/e2e/debian13-graphical-session-vm-e2e.sh'
      - 'system/contracts/system-graphical-session-e2e.schema.json'
      - 'system/image/system-base-debian-trixie.json'
      - 'system/image/build-debian-trixie-rootfs.sh'
      - 'system/SWIR-GRAPHICAL-SESSION-E2E-0.1.md'
      - 'SWIR-OS-ARCHITECTURE.md'
      - '.github/workflows/system-graphical-session-vm-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: system-graphical-session-vm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate graphical session contracts and security invariants
        shell: bash
        run: |
          set -euo pipefail
          bash -n system/session/swir-session-launcher.sh
          bash -n system/session/provision-graphical-session.sh
          bash -n system/e2e/debian13-graphical-session-vm-e2e.sh
          python3 -m py_compile system/session/greetd-e2e-greeter.py
          python3 -m json.tool system/contracts/system-graphical-session-e2e.schema.json >/dev/null
          python3 -m json.tool system/image/system-base-debian-trixie.json >/dev/null
          node scripts/validate-roadmap-progress.mjs
          grep -F 'command = "/usr/sbin/agreety --cmd /usr/local/bin/swir-session"' system/session/provision-graphical-session.sh >/dev/null
          grep -F "'desktopShellClaim': False" system/session/swir-session-launcher.sh >/dev/null
          grep -F "'desktopShellClaim': False" system/e2e/debian13-graphical-session-vm-e2e.sh >/dev/null
          grep -F 'interactivePamAuthenticationPassed' system/e2e/debian13-graphical-session-vm-e2e.sh >/dev/null
          grep -F 'activeDuringBoot' system/e2e/debian13-graphical-session-vm-e2e.sh >/dev/null
          ! grep -E '^\[initial_session\]$' system/session/provision-graphical-session.sh
          ! grep -E 'curl |wget |--no-check-gpg|AllowUnauthenticated|trusted=yes|shell: *true' \
            system/session/swir-session-launcher.sh \
            system/session/greetd-e2e-greeter.py \
            system/session/provision-graphical-session.sh \
            system/e2e/debian13-graphical-session-vm-e2e.sh

  graphical-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install controlled image and VM dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mmdebstrap debian-archive-keyring qemu-system-x86 qemu-utils ovmf \
            e2fsprogs dosfstools rsync parted util-linux udev
      - name: Build and boot authenticated SWIR graphical System Edition image
        env:
          SWIR_GRAPHICAL_VM_WORK_ROOT: ${{ runner.temp }}/swir-debian13-graphical-vm
          SWIR_GRAPHICAL_VM_ARTIFACT_DIR: ${{ runner.temp }}/swir-debian13-graphical-vm-artifacts
        run: |
          sudo --preserve-env=SWIR_GRAPHICAL_VM_WORK_ROOT,SWIR_GRAPHICAL_VM_ARTIFACT_DIR \
            bash system/e2e/debian13-graphical-session-vm-e2e.sh
      - name: Export readable diagnostics
        if: always()
        run: sudo chown -R "$USER:$USER" "${{ runner.temp }}/swir-debian13-graphical-vm-artifacts" 2>/dev/null || true
      - name: Validate emitted graphical evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          E="${{ runner.temp }}/swir-debian13-graphical-vm-artifacts/graphical-session-evidence.json"
          python3 - "$E" <<'PY'
          import json, sys
          e = json.load(open(sys.argv[1], encoding='utf-8'))
          assert e['schema'] == 'swir.system-graphical-session-e2e/0.1'
          assert e['passed'] is True
          assert e['base'] == {'distribution': 'debian', 'majorVersion': 13, 'bootPath': 'uefi-systemd-boot'}
          assert e['bootSplash']['provider'] == 'plymouth' and e['bootSplash']['theme'] == 'swir'
          assert e['bootSplash']['activeDuringBoot'] is True and e['bootSplash']['themeEmbeddedInInitramfs'] is True
          assert e['loginManager']['provider'] == 'greetd' and e['loginManager']['pamPolicyInstalled'] is True
          assert e['loginManager']['interactivePamAuthenticationPassed'] is True and e['loginManager']['autologinUsed'] is False
          assert e['session']['waylandCompositor'] == 'weston' and e['session']['waylandClientHandshakePassed'] is True
          assert e['productionDefaults']['testCredentialEmbeddedInProductionImage'] is False
          assert e['desktopShellClaim'] is False and e['secureBootClaim'] is False and e['hardwareQualificationClaim'] is False
          PY
      - name: Upload compact graphical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swir-system-graphical-session-e2e-${{ github.run_id }}
          path: ${{ runner.temp }}/swir-debian13-graphical-vm-artifacts
          if-no-files-found: warn
          retention-days: 7
