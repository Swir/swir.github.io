name: System fwupd LVFS Contract

on:
  push:
    branches: [main]
    paths:
      - 'system/hardware/fwupd-lvfs-service.mjs'
      - 'system/hardware/fwupd-lvfs-service.selftest.mjs'
      - 'system/contracts/fwupd-lvfs-inventory.schema.json'
      - 'system/SWIR-FWUPD-LVFS-INTEGRATION-0.1.md'
      - '.github/workflows/system-fwupd-lvfs-contract.yml'
  pull_request:
    paths:
      - 'system/hardware/fwupd-lvfs-service.mjs'
      - 'system/hardware/fwupd-lvfs-service.selftest.mjs'
      - 'system/contracts/fwupd-lvfs-inventory.schema.json'
      - 'system/SWIR-FWUPD-LVFS-INTEGRATION-0.1.md'
      - '.github/workflows/system-fwupd-lvfs-contract.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: |
          node --check system/hardware/fwupd-lvfs-service.mjs
          node --check system/hardware/fwupd-lvfs-service.selftest.mjs
      - name: Parse fwupd inventory contract
        run: node -e "JSON.parse(require('fs').readFileSync('system/contracts/fwupd-lvfs-inventory.schema.json','utf8'))"
      - name: Verify read-only fwupd/LVFS boundary
        run: node system/hardware/fwupd-lvfs-service.selftest.mjs
