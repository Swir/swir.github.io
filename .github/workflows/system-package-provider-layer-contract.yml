name: System Package Provider Layer Contract

on:
  push:
    branches: [main]
    paths:
      - 'system/packages/package-provider-layer.mjs'
      - 'system/packages/package-provider-layer.selftest.mjs'
      - 'system/packages/system-package-stack.mjs'
      - 'system/SWIR-SYSTEM-PACKAGE-PROVIDER-LAYER-0.1.md'
      - '.github/workflows/system-package-provider-layer-contract.yml'
  pull_request:
    paths:
      - 'system/packages/package-provider-layer.mjs'
      - 'system/packages/package-provider-layer.selftest.mjs'
      - 'system/packages/system-package-stack.mjs'
      - 'system/SWIR-SYSTEM-PACKAGE-PROVIDER-LAYER-0.1.md'
      - '.github/workflows/system-package-provider-layer-contract.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check provider layer syntax
        run: |
          node --check system/packages/package-provider-layer.mjs
          node --check system/packages/package-provider-layer.selftest.mjs

      - name: Enforce common layer security boundary
        run: |
          node -e "const fs=require('fs');const s=fs.readFileSync('system/packages/package-provider-layer.mjs','utf8');if(/node:child_process|\bspawn\s*\(|\bexec\s*\(/.test(s))throw new Error('Common provider layer must not execute commands');if(!s.includes('createSystemPackageProviderLayer({ distributionStack } = {})'))throw new Error('Production factory must remain distribution-stack only');if(!s.includes('PROVIDER_NOT_PROVISIONED'))throw new Error('Future providers must fail closed');console.log('Package provider layer security boundary: OK')"

      - name: Run common Package Provider self-test
        run: node system/packages/package-provider-layer.selftest.mjs

      - name: Re-run production distribution stack integration
        run: node system/packages/system-package-stack.selftest.mjs
