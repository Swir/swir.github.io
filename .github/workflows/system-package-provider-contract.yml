name: System Package Provider Contract

on:
  push:
    branches: [main]
    paths:
      - 'system/packages/**'
      - 'system/contracts/distribution-package-plan.schema.json'
      - 'system/contracts/package-provider.schema.json'
      - 'system/contracts/trusted-sources.json'
      - 'system/SWIR-DISTRIBUTION-PACKAGE-PROVIDER-0.1.md'
      - '.github/workflows/system-package-provider-contract.yml'
  pull_request:
    paths:
      - 'system/packages/**'
      - 'system/contracts/distribution-package-plan.schema.json'
      - 'system/contracts/package-provider.schema.json'
      - 'system/contracts/trusted-sources.json'
      - 'system/SWIR-DISTRIBUTION-PACKAGE-PROVIDER-0.1.md'
      - '.github/workflows/system-package-provider-contract.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: |
          node --check system/packages/distribution-package-provider.mjs
          node --check system/packages/distribution-package-provider.selftest.mjs
          node --check system/packages/validate-distribution-package-provider.mjs

      - name: Validate provider contract and trust policy
        run: node system/packages/validate-distribution-package-provider.mjs

      - name: Run distribution package provider self-tests
        run: node system/packages/distribution-package-provider.selftest.mjs

      - name: Parse package plan contract
        run: |
          node -e "JSON.parse(require('fs').readFileSync('system/contracts/distribution-package-plan.schema.json','utf8')); console.log('Distribution package plan JSON: OK')"
