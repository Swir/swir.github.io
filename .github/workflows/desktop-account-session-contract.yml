name: Desktop Account Session Contract

on:
  push:
    paths:
      - 'desktop/windows/DesktopAccountSessionBroker.cs'
      - 'desktop/windows/DesktopAccountSessionBrokerSelfTests.cs'
      - 'desktop/windows/SWIR.Desktop.AccountSession.SelfTests.csproj'
      - 'desktop/windows/PermissionBroker.cs'
      - 'desktop/windows/Program.cs'
      - 'desktop/windows/validate-account-session-integration.mjs'
      - 'desktop/windows/validate-account-session-runtime.mjs'
      - 'desktop/windows/validate-account-session-ui.mjs'
      - 'swir-runtime.js'
      - 'swir-settings.html'
      - 'sw.js'
      - '.github/workflows/desktop-account-session-contract.yml'
  pull_request:
    paths:
      - 'desktop/windows/DesktopAccountSessionBroker.cs'
      - 'desktop/windows/DesktopAccountSessionBrokerSelfTests.cs'
      - 'desktop/windows/SWIR.Desktop.AccountSession.SelfTests.csproj'
      - 'desktop/windows/PermissionBroker.cs'
      - 'desktop/windows/Program.cs'
      - 'desktop/windows/validate-account-session-integration.mjs'
      - 'desktop/windows/validate-account-session-runtime.mjs'
      - 'desktop/windows/validate-account-session-ui.mjs'
      - 'swir-runtime.js'
      - 'swir-settings.html'
      - 'sw.js'
      - '.github/workflows/desktop-account-session-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  account-session-contract:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify JavaScript syntax
        run: |
          node --check swir-runtime.js
          node --check sw.js
          node --check desktop/windows/validate-account-session-integration.mjs
          node --check desktop/windows/validate-account-session-runtime.mjs
          node --check desktop/windows/validate-account-session-ui.mjs

      - name: Verify permission policy is read-only
        shell: pwsh
        run: |
          $text = Get-Content -Raw 'desktop/windows/PermissionBroker.cs'
          if ($text -notmatch 'identity\.inspect') { throw 'identity.inspect permission is missing.' }
          if ($text -notmatch '\("identity", "info" or "account" or "session"\) => "identity\.inspect"') { throw 'Identity surface is not bound to identity.inspect.' }
          foreach ($mutation in @('login','logout','setPassword','changePassword','createAccount','removeAccount','unlock')) {
            if ($text -match ('\("identity",[^\r\n]*"' + [regex]::Escape($mutation) + '"')) {
              throw "Unsafe identity mutation policy exposed: $mutation"
            }
          }

      - name: Verify Desktop Host account/session integration
        run: node desktop/windows/validate-account-session-integration.mjs

      - name: Verify portable account/session runtime integration
        run: node desktop/windows/validate-account-session-runtime.mjs

      - name: Verify System Settings account/session integration
        run: node desktop/windows/validate-account-session-ui.mjs

      - name: Build Desktop account session broker self-tests
        run: dotnet build desktop/windows/SWIR.Desktop.AccountSession.SelfTests.csproj -c Release --nologo

      - name: Run Desktop account session broker self-tests
        run: dotnet run --project desktop/windows/SWIR.Desktop.AccountSession.SelfTests.csproj -c Release --no-build

      - name: Build shipping Desktop Host
        run: dotnet build desktop/windows/SWIR.Desktop.Host.csproj -c Release --nologo
