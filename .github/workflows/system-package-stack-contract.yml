name: System Package Stack Contract

on:
  push:
    branches: [main]
    paths:
      - 'system/packages/system-package-stack.mjs'
      - 'system/packages/system-package-stack.selftest.mjs'
      - 'system/packages/validate-system-package-stack.mjs'
      - 'system/packages/distribution-package-provider.mjs'
      - 'system/packages/package-transaction-service.mjs'
      - 'system/packages/privileged-package-executor.mjs'
      - 'system/packages/distribution-package-state.mjs'
      - 'system/security/**'
      - 'system/SWIR-SYSTEM-PACKAGE-STACK-0.1.md'
      - '.github/workflows/system-package-stack-contract.yml'
  pull_request:
    paths:
      - 'system/packages/system-package-stack.mjs'
      - 'system/packages/system-package-stack.selftest.mjs'
      - 'system/packages/validate-system-package-stack.mjs'
      - 'system/packages/distribution-package-provider.mjs'
      - 'system/packages/package-transaction-service.mjs'
      - 'system/packages/privileged-package-executor.mjs'
      - 'system/packages/distribution-package-state.mjs'
      - 'system/security/**'
      - 'system/SWIR-SYSTEM-PACKAGE-STACK-0.1.md'
      - '.github/workflows/system-package-stack-contract.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check stack syntax
        run: |
          node --check system/packages/system-package-stack.mjs
          node --check system/packages/system-package-stack.selftest.mjs
          node --check system/packages/validate-system-package-stack.mjs

      - name: Validate production assembly invariants
        run: node system/packages/validate-system-package-stack.mjs

      - name: Run end-to-end package stack integration self-test
        run: node system/packages/system-package-stack.selftest.mjs

      - name: Re-run transaction and provider boundaries
        run: |
          node system/packages/validate-package-transaction-service.mjs
          node system/packages/validate-distribution-package-provider.mjs
          node system/packages/distribution-package-provider.selftest.mjs

      - name: Re-run package security boundary
        run: |
          node system/security/validate-system-security-boundary.mjs
          node system/security/polkit-authorization-broker.selftest.mjs
          node system/security/distribution-repository-trust.selftest.mjs
