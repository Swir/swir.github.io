name: System Windows Compatibility Live E2E

on:
  push:
    branches: [main]
    paths:
      - 'system/runtime/windows-compatibility-service.mjs'
      - 'system/runtime/windows-compat-runtime-registry.mjs'
      - 'system/runtime/managed-windows-compatibility-stack.mjs'
      - 'system/runtime/windows-compat-live-e2e.mjs'
      - 'system/contracts/windows-compat-live-e2e.schema.json'
      - 'system/SWIR-WINDOWS-COMPAT-LIVE-E2E-0.1.md'
      - 'SWIR-OS-ARCHITECTURE.md'
      - '.github/workflows/system-windows-compat-live-e2e.yml'
  pull_request:
    paths:
      - 'system/runtime/windows-compatibility-service.mjs'
      - 'system/runtime/windows-compat-runtime-registry.mjs'
      - 'system/runtime/managed-windows-compatibility-stack.mjs'
      - 'system/runtime/windows-compat-live-e2e.mjs'
      - 'system/contracts/windows-compat-live-e2e.schema.json'
      - 'system/SWIR-WINDOWS-COMPAT-LIVE-E2E-0.1.md'
      - 'SWIR-OS-ARCHITECTURE.md'
      - '.github/workflows/system-windows-compat-live-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: system-windows-compat-live-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wine-live-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install distro Wine and PE fixture compiler
        shell: bash
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine wine64 gcc-mingw-w64-x86-64 file
      - name: Validate compatibility contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check system/runtime/windows-compatibility-service.mjs
          node --check system/runtime/windows-compat-runtime-registry.mjs
          node --check system/runtime/managed-windows-compatibility-stack.mjs
          node --check system/runtime/windows-compat-live-e2e.mjs
          python3 -m json.tool system/contracts/windows-compat-live-e2e.schema.json >/dev/null
          node system/runtime/windows-compatibility-service.selftest.mjs
          node system/runtime/windows-compat-runtime-registry.selftest.mjs
          node scripts/validate-roadmap-progress.mjs
          ! grep -E 'curl |wget |powershell|cmd\.exe|shell: *true' system/runtime/windows-compat-live-e2e.mjs
      - name: Build a minimal Windows console fixture
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/swir-e2e.c" <<'C'
          #include <windows.h>
          int main(void) {
            return 0;
          }
          C
          x86_64-w64-mingw32-gcc -Os -s -Wl,--nxcompat -Wl,--dynamicbase -o "$RUNNER_TEMP/swir-e2e.exe" "$RUNNER_TEMP/swir-e2e.c"
          file "$RUNNER_TEMP/swir-e2e.exe" | grep -E 'PE32\+.*x86-64' >/dev/null
      - name: Launch the real PE through the managed Wine stack
        shell: bash
        run: |
          set -euo pipefail
          PREFIX_ROOT="$RUNNER_TEMP/swir-wine-prefixes"
          mkdir -m 700 "$PREFIX_ROOT"
          node system/runtime/windows-compat-live-e2e.mjs \
            --fixture "$RUNNER_TEMP/swir-e2e.exe" \
            --prefix-root "$PREFIX_ROOT" \
            --output "$RUNNER_TEMP/windows-compat-live-e2e.json"
          node - "$RUNNER_TEMP/windows-compat-live-e2e.json" <<'NODE'
          const fs = require('fs');
          const e = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (e.schema !== 'swir.windows-compat-live-e2e/0.1' || e.passed !== true) process.exit(2);
          if (e.provider !== 'swir.compat.wine' || e.runtimeFamily !== 'wine' || e.exitCode !== 0) process.exit(3);
          if (!e.actualPortableExecutable || !e.managedPrefix || !e.perAppPrefix || !e.prefixMetadataVerified) process.exit(4);
          if (!e.runtimeRootOwned || e.runtimeWritableByGroupOrWorld || e.shellExecution || e.arbitraryRuntimeDownloadAllowed) process.exit(5);
          if (!e.trustVerified || !e.signatureRequired || e.windowsKernelDriverSupport) process.exit(6);
          if (!e.protonContractSupported || e.protonLiveE2E) process.exit(7);
          NODE
      - name: Upload Windows compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swir-windows-compat-live-e2e-${{ github.run_id }}
          path: ${{ runner.temp }}/windows-compat-live-e2e.json
          if-no-files-found: warn
          retention-days: 7
