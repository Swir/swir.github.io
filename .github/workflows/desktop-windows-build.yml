name: Desktop Windows Build

on:
  push:
    branches: [main]
    paths:
      - 'desktop/windows/**'
      - 'swir-runtime.js'
      - 'swir-apps.js'
      - 'swir-packages.js'
      - 'swir-app-bridge.js'
      - 'swir-app-bridge-host.js'
      - 'swir-code.html'
      - 'swir-image.html'
      - 'swir-archive.html'
      - 'swir-pdf.html'
      - 'swir-chat.html'
      - 'swir-chat-api.php'
      - 'swir-updates.html'
      - 'sw.js'
      - '.github/workflows/desktop-windows-build.yml'
  pull_request:
    paths:
      - 'desktop/windows/**'
      - 'swir-runtime.js'
      - 'swir-apps.js'
      - 'swir-packages.js'
      - 'swir-app-bridge.js'
      - 'swir-app-bridge-host.js'
      - 'swir-code.html'
      - 'swir-image.html'
      - 'swir-archive.html'
      - 'swir-pdf.html'
      - 'swir-chat.html'
      - 'swir-chat-api.php'
      - 'swir-updates.html'
      - 'sw.js'
      - '.github/workflows/desktop-windows-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop/windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Runtime JavaScript syntax
        run: node --check ../../swir-runtime.js

      - name: Check application registry syntax
        run: node --check ../../swir-apps.js

      - name: Check App Bridge JavaScript syntax
        run: |
          node --check ../../swir-app-bridge.js
          node --check ../../swir-app-bridge-host.js

      - name: Validate Desktop package policy
        run: node validate-policy.mjs

      - name: Validate App Bridge isolation readiness
        run: node validate-app-isolation.mjs

      - name: Validate Chat portable bridge contract
        run: node validate-chat-bridge.mjs

      - name: Validate native App Data bridge routing
        run: node validate-native-appdata-bridge.mjs

      - name: Validate Update Center Desktop readiness boundary
        run: node validate-update-center-desktop-contract.mjs

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run native App Data isolation self-tests
        run: dotnet run --project SWIR.Desktop.AppData.SelfTests.csproj --configuration Release

      - name: Run Permission Broker isolation self-tests
        run: dotnet run --project SWIR.Desktop.Permission.SelfTests.csproj --configuration Release

      - name: Run signed Update Broker self-tests
        run: dotnet run --project SWIR.Desktop.Update.SelfTests.csproj --configuration Release

      - name: Run update transaction recovery self-tests
        run: dotnet run --project SWIR.Desktop.Transaction.SelfTests.csproj --configuration Release

      - name: Run activation health rollback self-tests
        run: dotnet run --project SWIR.Desktop.ActivationCoordinator.SelfTests.csproj --configuration Release

      - name: Run controlled candidate launcher self-tests
        run: dotnet run --project SWIR.Desktop.CandidateLauncher.SelfTests.csproj --configuration Release

      - name: Run candidate startup health handshake self-tests
        run: dotnet run --project SWIR.Desktop.StartupHealth.SelfTests.csproj --configuration Release

      - name: Run host shutdown handoff self-tests
        run: dotnet run --project SWIR.Desktop.HostShutdown.SelfTests.csproj --configuration Release

      - name: Run desktop update restart launcher self-tests
        run: dotnet run --project SWIR.Desktop.UpdateRestart.SelfTests.csproj --configuration Release

      - name: Run Desktop restart lifecycle failure-injection self-tests
        run: dotnet run --project SWIR.Desktop.RestartLifecycle.SelfTests.csproj --configuration Release

      - name: Run Desktop bridge drain restart session self-tests
        run: dotnet run --project SWIR.Desktop.RestartSession.SelfTests.csproj --configuration Release

      - name: Run prepared Desktop update selector self-tests
        run: dotnet run --project SWIR.Desktop.PreparedUpdate.SelfTests.csproj --configuration Release

      - name: Run Desktop host restart hooks self-tests
        run: dotnet run --project SWIR.Desktop.HostRestartHooks.SelfTests.csproj --configuration Release

      - name: Run Desktop startup recovery self-tests
        run: dotnet run --project SWIR.Desktop.StartupRecovery.SelfTests.csproj --configuration Release

      - name: Run updater worker contract self-tests
        run: dotnet run --project SWIR.Desktop.UpdaterWorker.SelfTests.csproj --configuration Release

      - name: Build standalone updater worker
        run: dotnet build SWIR.Desktop.UpdaterWorker.csproj --configuration Release

      - name: Run standalone updater worker process E2E self-tests
        run: dotnet run --project SWIR.Desktop.UpdaterWorker.ProcessE2E.SelfTests.csproj --configuration Release -- "${{ github.workspace }}\desktop\windows\bin\Release\net8.0\SWIR.Desktop.UpdaterWorker.exe"

      - name: Publish packaged E2E Candidate
        run: dotnet publish SWIR.Desktop.PackagedCandidate.SelfTests.csproj --configuration Release --output "${{ runner.temp }}\swir-e2e-candidate"

      - name: Run packaged two-slot activation and rollback E2E
        run: dotnet run --project SWIR.Desktop.Updater.PackagedActivation.SelfTests.csproj --configuration Release -- "${{ github.workspace }}\desktop\windows\bin\Release\net8.0\SWIR.Desktop.UpdaterWorker.exe" "${{ runner.temp }}\swir-e2e-candidate"

      - name: Restore
        run: dotnet restore SWIR.Desktop.Host.csproj

      - name: Build
        run: dotnet build SWIR.Desktop.Host.csproj --configuration Release --no-restore
