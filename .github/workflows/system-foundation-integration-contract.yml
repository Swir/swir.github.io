name: System Foundation Integration Contract

on:
  push:
    branches: [main]
    paths:
      - 'system/image/**'
      - 'system/session/**'
      - 'system/security/**'
      - 'system/network/**'
      - 'system/firmware/**'
      - 'system/contracts/**'
      - 'system/SWIR-DEBIAN-BASE-IMAGE-0.1.md'
      - 'system/SWIR-SYSTEM-SESSION-IDENTITY-0.1.md'
      - 'system/SWIR-SYSTEM-IMAGE-READINESS-0.1.md'
      - '.github/workflows/system-foundation-integration-contract.yml'
  pull_request:
    paths:
      - 'system/image/**'
      - 'system/session/**'
      - 'system/security/**'
      - 'system/network/**'
      - 'system/firmware/**'
      - 'system/contracts/**'
      - 'system/SWIR-DEBIAN-BASE-IMAGE-0.1.md'
      - 'system/SWIR-SYSTEM-SESSION-IDENTITY-0.1.md'
      - 'system/SWIR-SYSTEM-IMAGE-READINESS-0.1.md'
      - '.github/workflows/system-foundation-integration-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check new foundation
        run: |
          node --check system/session/system-session-identity-service.mjs
          node --check system/session/system-session-identity-service.selftest.mjs
          node --check system/image/validate-debian13-base-image-profile.mjs
          node --check system/image/system-base-image-contract.selftest.mjs
          node --check system/image/system-image-readiness.mjs
          node --check system/image/system-image-readiness.selftest.mjs
      - name: Parse new machine contracts
        run: |
          node -e "JSON.parse(require('fs').readFileSync('system/contracts/system-session-identity.schema.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('system/contracts/system-base-image-profile.schema.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('system/contracts/system-image-readiness.schema.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('system/image/debian13-base-image-profile.json','utf8'))"
      - name: Validate existing System contracts
        run: node system/validate-system-contracts.mjs
      - name: Validate cross-domain security boundary
        run: node system/security/validate-system-security-boundary.mjs
      - name: Validate Debian base image profile
        run: node system/image/validate-debian13-base-image-profile.mjs
      - name: Verify base image to readiness/session composition
        run: node system/image/system-base-image-contract.selftest.mjs
      - name: Verify session identity boundary
        run: node system/session/system-session-identity-service.selftest.mjs
      - name: Verify readiness gate
        run: node system/image/system-image-readiness.selftest.mjs
      - name: Re-run NetworkManager and firmware security paths
        run: |
          node system/network/networkmanager-service.selftest.mjs
          node system/firmware/fwupd-firmware-transaction-service.selftest.mjs
      - name: Guard trust policy regressions
        shell: bash
        run: |
          ! grep -R --line-number -E 'shell:[[:space:]]*true' system/session system/image
          ! grep -R --line-number -E 'allowUnsignedRepositories["[:space:]]*:[[:space:]]*true|allowThirdPartyRepositories["[:space:]]*:[[:space:]]*true|allowRandomBinaryDrivers["[:space:]]*:[[:space:]]*true' system/image
          grep -q '"bootableImageClaim": false' system/image/debian13-base-image-profile.json
