name: System Driver Center Runtime Contract

on:
  push:
    branches: [main]
    paths:
      - 'system/hardware/**'
      - 'system/contracts/driver-center-runtime.schema.json'
      - 'system/contracts/trusted-sources.json'
      - 'system/SWIR-DRIVER-CENTER-RUNTIME-0.1.md'
      - 'SWIR-OS-ARCHITECTURE.md'
      - '.github/workflows/system-driver-center-runtime-contract.yml'
  pull_request:
    paths:
      - 'system/hardware/**'
      - 'system/contracts/driver-center-runtime.schema.json'
      - 'system/contracts/trusted-sources.json'
      - 'system/SWIR-DRIVER-CENTER-RUNTIME-0.1.md'
      - 'SWIR-OS-ARCHITECTURE.md'
      - '.github/workflows/system-driver-center-runtime-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: system-driver-center-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  driver-center-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Driver Center runtime contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check system/hardware/driver-center-runtime.mjs
          node --check system/hardware/driver-center-cli.mjs
          node --check system/hardware/driver-center-runtime.selftest.mjs
          python3 -m json.tool system/contracts/driver-center-runtime.schema.json >/dev/null
          node system/hardware/hardware-service.selftest.mjs
          node system/hardware/hardware-catalog.selftest.mjs
          node system/hardware/driver-resolver.selftest.mjs
          node system/hardware/driver-center-service.selftest.mjs
          node system/hardware/fwupd-lvfs-service.selftest.mjs
          node system/hardware/driver-center-runtime.selftest.mjs
          node scripts/validate-roadmap-progress.mjs
          ! grep -E 'exec\(|execSync\(|spawn\(|spawnSync\(|curl |wget |shell: *true|https?://' system/hardware/driver-center-runtime.mjs system/hardware/driver-center-cli.mjs
      - name: Exercise live Driver Center against Linux sysfs
        shell: bash
        run: |
          set -euo pipefail
          node system/hardware/driver-center-cli.mjs --compact --output "$RUNNER_TEMP/driver-center-runtime.json"
          node - "$RUNNER_TEMP/driver-center-runtime.json" <<'NODE'
          const fs = require('fs');
          const e = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (e.schema !== 'swir.driver-center-runtime/0.1' || e.passed !== true) process.exit(2);
          if (e.mode !== 'diagnostics' || e.readOnly !== true || e.autoMutation !== false) process.exit(3);
          if (e.hardware?.total < 1 || e.hardware?.pci < 1 || e.hardware?.loadedDrivers < 1) process.exit(4);
          if (e.driverPlan?.readOnly !== true || e.driverPlan?.autoExecutable !== false) process.exit(5);
          if (e.firmware?.provider !== 'fwupd-lvfs' || e.firmware?.mutationAuthorized !== false) process.exit(6);
          if (e.policy?.unknownHardwareAutoDownload || e.policy?.arbitraryDriverUrls || e.policy?.windowsKernelDriversAsLinuxDrivers) process.exit(7);
          if (e.policy?.privilegedMutationRequiresPlan !== true || e.policy?.privilegedMutationRequiresJournal !== true) process.exit(8);
          if (!Array.isArray(e.violations) || e.violations.length !== 0) process.exit(9);
          NODE
      - name: Upload Driver Center evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swir-driver-center-runtime-${{ github.run_id }}
          path: ${{ runner.temp }}/driver-center-runtime.json
          if-no-files-found: warn
          retention-days: 7
