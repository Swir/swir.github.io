name: Desktop Release Contract

on:
  push:
    branches: [main]
    paths:
      - 'global.json'
      - 'index.html'
      - 'swir-*.js'
      - 'swir-*.html'
      - 'sw.js'
      - 'desktop/windows/app-policy.json'
      - 'desktop/windows/desktop-update-policy.example.json'
      - 'desktop/windows/stage-desktop-runtime.ps1'
      - 'desktop/windows/publish-desktop-host.ps1'
      - 'desktop/windows/DesktopReleaseBundle*.cs'
      - 'desktop/windows/DesktopReleaseToCandidate*.cs'
      - 'desktop/windows/DesktopReleaseActivation*.cs'
      - 'desktop/windows/SWIR.Desktop.ReleaseBundle*.csproj'
      - 'desktop/windows/SWIR.Desktop.ReleaseToCandidate*.csproj'
      - 'desktop/windows/SWIR.Desktop.ReleaseActivation*.csproj'
      - 'desktop/windows/SWIR.Desktop.UpdaterWorker.csproj'
      - 'desktop/windows/SWIR.Desktop.Host.csproj'
      - '.github/workflows/desktop-release.yml'
      - '.github/workflows/desktop-release-contract.yml'
  pull_request:
    paths:
      - 'global.json'
      - 'index.html'
      - 'swir-*.js'
      - 'swir-*.html'
      - 'sw.js'
      - 'desktop/windows/app-policy.json'
      - 'desktop/windows/desktop-update-policy.example.json'
      - 'desktop/windows/stage-desktop-runtime.ps1'
      - 'desktop/windows/publish-desktop-host.ps1'
      - 'desktop/windows/DesktopReleaseBundle*.cs'
      - 'desktop/windows/DesktopReleaseToCandidate*.cs'
      - 'desktop/windows/DesktopReleaseActivation*.cs'
      - 'desktop/windows/SWIR.Desktop.ReleaseBundle*.csproj'
      - 'desktop/windows/SWIR.Desktop.ReleaseToCandidate*.csproj'
      - 'desktop/windows/SWIR.Desktop.ReleaseActivation*.csproj'
      - 'desktop/windows/SWIR.Desktop.UpdaterWorker.csproj'
      - 'desktop/windows/SWIR.Desktop.Host.csproj'
      - '.github/workflows/desktop-release.yml'
      - '.github/workflows/desktop-release-contract.yml'

permissions:
  contents: read

concurrency:
  group: desktop-release-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-release-contract:
    runs-on: windows-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: desktop/windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Assert pinned .NET SDK line
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = dotnet --version
          if ($sdk -notmatch '^8\.0\.4\d{2}$') { throw "Expected .NET SDK 8.0.4xx, got $sdk" }
          dotnet --info

      - name: Build shipping Desktop Host
        run: dotnet build SWIR.Desktop.Host.csproj --configuration Release

      - name: Run release bundle verifier self-tests
        run: dotnet run --project SWIR.Desktop.ReleaseBundleVerifier.SelfTests.csproj --configuration Release

      - name: Build release and runtime update tools
        run: |
          dotnet build SWIR.Desktop.ReleaseBundleTool.csproj --configuration Release
          dotnet build SWIR.Desktop.ReleaseBundleVerifierTool.csproj --configuration Release
          dotnet build SWIR.Desktop.UpdaterWorker.csproj --configuration Release
          dotnet build SWIR.Desktop.ReleaseToCandidate.SelfTests.csproj --configuration Release
          dotnet build SWIR.Desktop.ReleaseActivation.SelfTests.csproj --configuration Release

      - name: Run signed self-contained 0.5.2-preview release through Candidate and real Host health commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $publish = Join-Path '${{ runner.temp }}' 'swir-release-contract-publish'
          $bundle = Join-Path '${{ runner.temp }}' 'swir-release-contract-bundle'
          $privateKey = Join-Path '${{ runner.temp }}' 'swir-release-contract-private.pem'
          $publicKey = Join-Path '${{ runner.temp }}' 'swir-release-contract-public.pem'
          $toolDir = Join-Path (Get-Location) 'bin\Release\net8.0'
          $bundleTool = Join-Path $toolDir 'SWIR.Desktop.ReleaseBundleTool.dll'
          $verifyTool = Join-Path $toolDir 'SWIR.Desktop.ReleaseBundleVerifierTool.dll'
          $worker = Join-Path $toolDir 'SWIR.Desktop.UpdaterWorker.exe'
          $releaseToCandidate = Join-Path $toolDir 'SWIR.Desktop.ReleaseToCandidate.SelfTests.dll'
          $releaseActivation = Join-Path $toolDir 'SWIR.Desktop.ReleaseActivation.SelfTests.dll'
          $runtimeStage = Join-Path (Get-Location) 'stage-desktop-runtime.ps1'
          $hostPublish = Join-Path (Get-Location) 'publish-desktop-host.ps1'
          foreach ($required in @($bundleTool, $verifyTool, $worker, $releaseToCandidate, $releaseActivation, $runtimeStage, $hostPublish)) {
            if (-not (Test-Path $required -PathType Leaf)) { throw "Required Desktop release/runtime tool missing: $required" }
          }

          & $hostPublish `
            -PublishDir $publish `
            -ReleaseVersion '0.5.2' `
            -Channel 'preview' `
            -SourceCommit $env:GITHUB_SHA
          & $runtimeStage -PublishDir $publish -SourceRoot '${{ github.workspace }}'
          Copy-Item -LiteralPath $worker -Destination (Join-Path $publish 'SWIR.Desktop.UpdaterWorker.exe') -Force
          Copy-Item -LiteralPath (Join-Path (Get-Location) 'desktop-update-policy.example.json') `
            -Destination (Join-Path $publish 'desktop-update-policy.json') -Force

          foreach ($required in @(
            (Join-Path $publish 'index.html'),
            (Join-Path $publish 'desktop\windows\app-policy.json'),
            (Join-Path $publish 'desktop-runtime.json'),
            (Join-Path $publish 'desktop-host-build.json'),
            (Join-Path $publish 'SWIR.Desktop.UpdaterWorker.exe'),
            (Join-Path $publish 'desktop-update-policy.json')
          )) {
            if (-not (Test-Path $required -PathType Leaf)) { throw "Self-contained Desktop publish is missing: $required" }
          }

          $hostBuild = Get-Content (Join-Path $publish 'desktop-host-build.json') -Raw | ConvertFrom-Json
          if ($hostBuild.schema -ne 'swir.desktop-host-build/0.1') { throw 'Unexpected Desktop Host build manifest schema.' }
          if ($hostBuild.releaseVersion -ne '0.5.2' -or $hostBuild.channel -ne 'preview' -or $hostBuild.hostVersion -ne '0.5.2-preview') {
            throw 'Desktop Host build identity is not bound to the signed release identity.'
          }
          if ($hostBuild.sourceCommit -ne $env:GITHUB_SHA.ToLowerInvariant()) { throw 'Desktop Host build source commit does not match workflow SHA.' }

          $runtimeManifestPath = Join-Path $publish 'desktop-runtime.json'
          $runtimeManifest = Get-Content $runtimeManifestPath -Raw | ConvertFrom-Json
          if ($runtimeManifest.schema -ne 'swir.desktop-web-runtime/0.1') { throw 'Unexpected Desktop web runtime manifest schema.' }
          if ($runtimeManifest.sourceCommit -ne $env:GITHUB_SHA.ToLowerInvariant()) { throw 'Desktop web runtime source commit does not match workflow SHA.' }
          if ([int]$runtimeManifest.fileCount -lt 9) { throw 'Desktop web runtime manifest contains too few files.' }
          $updatePolicy = Get-Content (Join-Path $publish 'desktop-update-policy.json') -Raw | ConvertFrom-Json
          if ($updatePolicy.Schema -ne 'swir.desktop-update-policy/0.1' -or $updatePolicy.Enabled -ne $false) {
            throw 'Packaged default update policy must be valid and fail-closed.'
          }

          $rsa = [System.Security.Cryptography.RSA]::Create(2048)
          try {
            [System.IO.File]::WriteAllText($privateKey, $rsa.ExportRSAPrivateKeyPem())
            [System.IO.File]::WriteAllText($publicKey, $rsa.ExportSubjectPublicKeyInfoPem())

            dotnet $bundleTool `
              --source $publish `
              --output-dir $bundle `
              --version 0.5.2 `
              --entry-point SWIR.Desktop.Host.exe `
              --package-url https://github.com/Swir/swir.github.io/releases/download/desktop-v0.5.2-preview/SWIR-Desktop-0.5.2-preview.zip `
              --channel preview `
              --key-id ci-preview-contract `
              --private-key $privateKey
            if ($LASTEXITCODE -ne 0) { throw "Release bundle tool failed with exit code $LASTEXITCODE" }

            dotnet $verifyTool `
              --bundle-dir $bundle `
              --version 0.5.2 `
              --channel preview `
              --public-key $publicKey `
              --package-host github.com
            if ($LASTEXITCODE -ne 0) { throw "Release verifier tool failed with exit code $LASTEXITCODE" }

            dotnet $releaseToCandidate $worker $bundle $publicKey
            if ($LASTEXITCODE -ne 0) { throw "Release-to-Candidate E2E failed with exit code $LASTEXITCODE" }

            dotnet $releaseActivation $worker $bundle $publicKey
            if ($LASTEXITCODE -ne 0) { throw "Real signed release activation/health E2E failed with exit code $LASTEXITCODE" }

            $package = Join-Path $bundle 'SWIR-Desktop-0.5.2-preview.zip'
            $manifest = Join-Path $bundle 'desktop-update-preview.json'
            $metadata = Join-Path $bundle 'release-bundle.json'
            foreach ($artifact in @($package, $manifest, $metadata)) {
              if (-not (Test-Path $artifact -PathType Leaf)) { throw "Expected verified release artifact missing: $artifact" }
            }
          } finally {
            $rsa.Dispose()
            Remove-Item $privateKey, $publicKey -Force -ErrorAction SilentlyContinue
          }
