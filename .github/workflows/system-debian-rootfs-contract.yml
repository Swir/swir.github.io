name: System Debian Rootfs Contract

on:
  push:
    branches: [main]
    paths:
      - 'system/image/system-base-debian-trixie.json'
      - 'system/image/debian-trixie-repository-trust-policy.json'
      - 'system/image/build-debian-trixie-rootfs.sh'
      - 'system/image/system-base-debian-trixie.selftest.mjs'
      - 'system/image/system-image-provisioning*'
      - 'system/image/system-peer-authorization-provisioning*'
      - 'system/ipc/swir-peer-authorization*'
      - 'system/ipc/90-swir-peer-authorization.preset'
      - 'system/security/org.swir.system.*.policy'
      - 'system/SWIR-SYSTEM-IMAGE-PROVISIONING-0.1.md'
      - '.github/workflows/system-debian-rootfs-contract.yml'
  pull_request:
    paths:
      - 'system/image/system-base-debian-trixie.json'
      - 'system/image/debian-trixie-repository-trust-policy.json'
      - 'system/image/build-debian-trixie-rootfs.sh'
      - 'system/image/system-base-debian-trixie.selftest.mjs'
      - 'system/image/system-image-provisioning*'
      - 'system/image/system-peer-authorization-provisioning*'
      - 'system/ipc/swir-peer-authorization*'
      - 'system/ipc/90-swir-peer-authorization.preset'
      - 'system/security/org.swir.system.*.policy'
      - 'system/SWIR-SYSTEM-IMAGE-PROVISIONING-0.1.md'
      - '.github/workflows/system-debian-rootfs-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: system-debian-rootfs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-rootfs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate selected base profile
        run: |
          node --check system/image/system-base-debian-trixie.selftest.mjs
          node system/image/system-base-debian-trixie.selftest.mjs
          python3 -m json.tool system/image/system-base-debian-trixie.json >/dev/null
          python3 -m json.tool system/image/debian-trixie-repository-trust-policy.json >/dev/null
          bash -n system/image/build-debian-trixie-rootfs.sh

      - name: Install rootfs builder
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mmdebstrap
          mmdebstrap --version

      - name: Build Debian 13 trixie rootfs from official archive
        shell: bash
        run: |
          set -euo pipefail
          ROOTFS="$RUNNER_TEMP/swir-debian-rootfs"
          sudo mkdir -p "$ROOTFS"
          sudo chmod 0700 "$ROOTFS"
          sudo bash system/image/build-debian-trixie-rootfs.sh \
            --rootfs "$ROOTFS" \
            --profile "$GITHUB_WORKSPACE/system/image/system-base-debian-trixie.json" \
            --arch amd64
          echo "ROOTFS=$ROOTFS" >> "$GITHUB_ENV"

      - name: Verify real Debian rootfs package and repository state
        shell: bash
        run: |
          set -euo pipefail
          test -f "$ROOTFS/etc/debian_version"
          grep -q '^13' "$ROOTFS/etc/debian_version"
          grep -F 'URIs: https://deb.debian.org/debian' "$ROOTFS/etc/apt/sources.list.d/swir-debian.sources"
          grep -F 'URIs: https://security.debian.org/debian-security' "$ROOTFS/etc/apt/sources.list.d/swir-debian.sources"
          grep -F 'Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg' "$ROOTFS/etc/apt/sources.list.d/swir-debian.sources"
          test ! -e "$ROOTFS/etc/apt/sources.list"
          for p in linux-image-amd64 systemd-sysv dbus polkitd network-manager fwupd python3 ca-certificates debian-archive-keyring; do
            sudo chroot "$ROOTFS" dpkg-query -W -f='${db:Status-Abbrev}' "$p" | grep -qx 'ii '
          done
          sudo chroot "$ROOTFS" apt-get update
          sudo chroot "$ROOTFS" apt-cache policy systemd network-manager fwupd | tee "$RUNNER_TEMP/apt-policy.txt"
          ! grep -E 'http://|trusted=yes|\[trusted=yes\]' "$ROOTFS/etc/apt/sources.list.d/swir-debian.sources"
          sudo python3 - "$ROOTFS/var/lib/swir/image/base-build-state.json" <<'PY'
          import json, pathlib, sys
          p=json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert p['schema']=='swir.system-base-build-state/0.1'
          assert p['profile']=='debian-13-trixie'
          assert p['architecture']=='amd64'
          assert p['nativeAptSignatureVerification'] is True
          assert p['officialRepositoriesOnly'] is True
          assert p['bootableImageClaim'] is False
          assert p['secureBootClaim'] is False
          assert len(p['profileSha256'])==64 and len(p['packageSetSha256'])==64
          print('Real Debian rootfs state: OK')
          PY

      - name: Apply SWIR production foundation to real Debian rootfs
        shell: bash
        run: |
          set -euo pipefail
          NODE_BIN="$(command -v node)"
          sudo "$NODE_BIN" system/image/system-image-provisioning-cli.mjs stage \
            --rootfs "$ROOTFS" \
            --source-root "$GITHUB_WORKSPACE" \
            --repository-policy "$GITHUB_WORKSPACE/system/image/debian-trixie-repository-trust-policy.json" \
            --production --compact > "$RUNNER_TEMP/swir-stage.json"
          sudo "$NODE_BIN" system/image/system-image-provisioning-cli.mjs verify \
            --rootfs "$ROOTFS" --production --compact > "$RUNNER_TEMP/swir-verify.json"
          node -e "for(const f of process.argv.slice(1)){const r=JSON.parse(require('fs').readFileSync(f,'utf8')); if(r.ready!==true||r.production!==true||r.bootableImageClaim!==false||r.blockers.length) process.exit(1)} console.log('SWIR foundation on real Debian rootfs: OK')" \
            "$RUNNER_TEMP/swir-stage.json" "$RUNNER_TEMP/swir-verify.json"
          test "$(sudo stat -c '%u:%a' "$ROOTFS/etc/swir/repository-trust-policy.json")" = '0:600'
          test "$(sudo stat -c '%u:%a' "$ROOTFS/var/lib/swir/security/catalog-trust")" = '0:700'

      - name: Apply peer authorization systemd foundation to real Debian rootfs
        shell: bash
        run: |
          set -euo pipefail
          NODE_BIN="$(command -v node)"
          sudo env ROOTFS="$ROOTFS" SOURCE_ROOT="$GITHUB_WORKSPACE" "$NODE_BIN" --input-type=module -e "
            import { stagePeerAuthorizationFoundation, verifyPeerAuthorizationFoundation } from './system/image/system-peer-authorization-provisioning.mjs';
            const staged = await stagePeerAuthorizationFoundation({rootfs: process.env.ROOTFS, sourceRoot: process.env.SOURCE_ROOT, production: true});
            if (!staged.ready || staged.bootableImageClaim !== false || staged.runtimeKeyEmbeddedInImage !== false) process.exit(1);
            const verified = await verifyPeerAuthorizationFoundation({rootfs: process.env.ROOTFS, production: true});
            if (!verified.ready || verified.blockers.length) process.exit(1);
            console.log('Peer authorization foundation on real Debian rootfs: OK');
          "
          test "$(sudo stat -c '%u:%a' "$ROOTFS/usr/libexec/swir/swir-peer-authorization-broker")" = '0:755'
          test "$(sudo stat -c '%u:%a' "$ROOTFS/usr/lib/systemd/system/swir-peer-authorization.socket")" = '0:644'
          test ! -e "$ROOTFS/run/swir/peer-authorization.key"
          sudo systemd-analyze --root="$ROOTFS" verify swir-peer-authorization.socket swir-peer-authorization.service

      - name: Verify required host-facing binaries exist in target rootfs
        shell: bash
        run: |
          set -euo pipefail
          for f in /usr/bin/systemctl /usr/bin/loginctl /usr/bin/pkcheck /usr/bin/nmcli /usr/bin/fwupdmgr /usr/bin/python3 /usr/bin/apt-get /usr/bin/apt-cache; do
            test -x "$ROOTFS$f" || { echo "missing required binary in rootfs: $f" >&2; exit 1; }
          done
          test -e "$ROOTFS/boot/vmlinuz" || find "$ROOTFS/boot" -maxdepth 1 -type f -name 'vmlinuz-*' -print -quit | grep -q .
          test -d "$ROOTFS/usr/lib/firmware" || test -d "$ROOTFS/lib/firmware"

      - name: Guard honest completion claims
        shell: bash
        run: |
          set -euo pipefail
          grep -F '"bootableImageClaim": false' system/image/system-base-debian-trixie.json
          grep -F '"secureBootClaim": false' system/image/system-base-debian-trixie.json
          grep -F '"hardwareQualificationClaim": false' system/image/system-base-debian-trixie.json
          ! grep -nE -- '--no-check-gpg|AllowUnauthenticated|trusted=yes' system/image/build-debian-trixie-rootfs.sh
