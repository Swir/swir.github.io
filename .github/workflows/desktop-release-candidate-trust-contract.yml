name: Desktop Release Candidate Trust Contract

on:
  push:
    branches: [main]
    paths:
      - 'global.json'
      - 'index.html'
      - 'swir-*.js'
      - 'swir-*.html'
      - 'sw.js'
      - 'scripts/build-signed-catalog-release.mjs'
      - 'scripts/apply-catalog-root-rotation.mjs'
      - 'scripts/verify-catalog-root-rotation.mjs'
      - 'desktop/windows/app-policy.json'
      - 'desktop/windows/desktop-update-policy.example.json'
      - 'desktop/windows/build-store-packages.ps1'
      - 'desktop/windows/stage-desktop-runtime.ps1'
      - 'desktop/windows/publish-desktop-host.ps1'
      - 'desktop/windows/test-release-candidate-catalog-rotation.ps1'
      - 'desktop/windows/DesktopReleaseBundle*.cs'
      - 'desktop/windows/SWIR.Desktop.ReleaseBundle*.csproj'
      - 'desktop/windows/SWIR.Desktop.UpdaterWorker.csproj'
      - 'desktop/windows/SWIR.Desktop.Host.csproj'
      - '.github/workflows/desktop-release.yml'
      - '.github/workflows/desktop-release-candidate-trust-contract.yml'
  pull_request:
    paths:
      - 'global.json'
      - 'index.html'
      - 'swir-*.js'
      - 'swir-*.html'
      - 'sw.js'
      - 'scripts/build-signed-catalog-release.mjs'
      - 'scripts/apply-catalog-root-rotation.mjs'
      - 'scripts/verify-catalog-root-rotation.mjs'
      - 'desktop/windows/app-policy.json'
      - 'desktop/windows/desktop-update-policy.example.json'
      - 'desktop/windows/build-store-packages.ps1'
      - 'desktop/windows/stage-desktop-runtime.ps1'
      - 'desktop/windows/publish-desktop-host.ps1'
      - 'desktop/windows/test-release-candidate-catalog-rotation.ps1'
      - 'desktop/windows/DesktopReleaseBundle*.cs'
      - 'desktop/windows/SWIR.Desktop.ReleaseBundle*.csproj'
      - 'desktop/windows/SWIR.Desktop.UpdaterWorker.csproj'
      - 'desktop/windows/SWIR.Desktop.Host.csproj'
      - '.github/workflows/desktop-release.yml'
      - '.github/workflows/desktop-release-candidate-trust-contract.yml'

permissions:
  contents: read

concurrency:
  group: desktop-release-candidate-trust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-release-candidate-trust:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Assert pinned .NET SDK line
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = dotnet --version
          if ($sdk -notmatch '^8\.0\.4\d{2}$') { throw "Expected .NET SDK 8.0.4xx, got $sdk" }
          dotnet --info

      - name: Syntax check release-candidate trust tooling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path '${{ github.workspace }}' 'desktop\windows\test-release-candidate-catalog-rotation.ps1'),
            [ref]$null,
            [ref]$errors
          )
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          node --check scripts/build-signed-catalog-release.mjs
          node --check scripts/apply-catalog-root-rotation.mjs
          node --check scripts/verify-catalog-root-rotation.mjs

      - name: Run final Desktop release-candidate current-next trust E2E
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & '${{ github.workspace }}\desktop\windows\test-release-candidate-catalog-rotation.ps1' -SourceRoot '${{ github.workspace }}' -WorkRoot (Join-Path '${{ runner.temp }}' 'swir-rc-trust-e2e')
