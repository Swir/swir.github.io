name: One-time SWIR OS status-site canonicalization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-swir-os-status-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Convert repository back to presentation/status role
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              '61.8%': '70.0%',
              '34 / 55': '42 / 60',
              'Roadmap progress 61.8 percent': 'Roadmap progress 70.0 percent',
              'Progress comes from the measurable roadmap in Swir/SWIR_OS. Prototypes do not count as complete until they are implemented and verified.': 'Progress is synchronized from the canonical measurable roadmap in Swir/SWIR_OS. This website is presentation/status only; prototypes do not count until they are implemented and verified in the canonical repository.',
          }
          expected = {'61.8%': 2, '34 / 55': 2, 'Roadmap progress 61.8 percent': 1,
                      'Progress comes from the measurable roadmap in Swir/SWIR_OS. Prototypes do not count as complete until they are implemented and verified.': 1}
          for old, new in replacements.items():
              count = s.count(old)
              if count != expected[old]:
                  raise SystemExit(f'index.html: expected {expected[old]} occurrences of {old!r}, found {count}')
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')

          css = Path('swir-preview.css')
          c = css.read_text(encoding='utf-8')
          if c.count('width:61.8%') != 1:
              raise SystemExit('swir-preview.css: expected exactly one 61.8% progress width')
          css.write_text(c.replace('width:61.8%', 'width:70%'), encoding='utf-8')

          Path('README.md').write_text('''<div align="center">\n\n# 🖥️ SWIR OS — Public Status & Preview\n\n**Presentation repository only**\n\n[![Canonical Repository](https://img.shields.io/badge/CANONICAL-Swir%2FSWIR__OS-1f6feb?style=for-the-badge&logo=github)](https://github.com/Swir/SWIR_OS)\n![Roadmap](https://img.shields.io/badge/ROADMAP-70.0%25-2ea043?style=for-the-badge)\n![Completed](https://img.shields.io/badge/DONE-42%2F60-1f6feb?style=for-the-badge)\n\n</div>\n\n`Swir/swir.github.io` hosts the public SWIR OS preview and synchronized development status. It is **not** a source repository for the operating system.\n\n## Canonical project\n\nAll SWIR OS implementation is developed in **[Swir/SWIR_OS](https://github.com/Swir/SWIR_OS)**: Web Edition, Desktop Edition, System Edition, native apps, services, package/runtime infrastructure, hardware and driver work, CI, roadmap, builds and releases.\n\nThe authoritative roadmap is [SWIR_OS/SWIR-OS-ARCHITECTURE.md](https://github.com/Swir/SWIR_OS/blob/main/SWIR-OS-ARCHITECTURE.md).\n\n## Current verified status\n\n| Edition | Status |\n|---|---|\n| Web Edition | `1.7.13` |\n| Desktop Edition | `0.5.7-preview` |\n| System Edition | In development |\n| Overall roadmap | **42 / 60 — 70.0%** |\n\nPublic progress here is updated only after the corresponding implementation is merged and verified in `Swir/SWIR_OS`.\n\n## Repository role\n\nThis repository may contain website assets and older independent web/retro experiments. New SWIR OS product code, architecture contracts and System/Desktop implementation must be committed to `Swir/SWIR_OS`, not here.\n''', encoding='utf-8')
          PY

          # Remove the accidental duplicate System Edition source and its CI from the presentation repository.
          rm -rf system
          find .github/workflows -maxdepth 1 -type f -name 'system-*.yml' -delete 2>/dev/null || true
          rm -f SWIR-OS-ARCHITECTURE.md SWIR-ROADMAP-STANDARD.md

          grep -F '70.0%' index.html >/dev/null
          grep -F '42 / 60' index.html >/dev/null
          grep -F 'width:70%' swir-preview.css >/dev/null
          grep -F 'Swir/SWIR_OS' README.md >/dev/null
          test ! -e system

      - name: Commit presentation-only cleanup and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-time-swir-os-status-sync.yml
          git add -A
          git commit -m 'Site: sync canonical SWIR OS progress and remove duplicate System source'
          git push origin HEAD:main
