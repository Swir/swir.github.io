name: System Catalog Trust State Contract

on:
  push:
    branches: [main]
    paths:
      - 'system/security/file-catalog-trust-state-store.mjs'
      - 'system/security/file-catalog-trust-state-store.selftest.mjs'
      - 'system/security/system-catalog-authorization.mjs'
      - 'system/contracts/catalog-trust-state.schema.json'
      - 'system/SWIR-SYSTEM-CATALOG-TRUST-STATE-0.1.md'
      - '.github/workflows/system-catalog-trust-state-contract.yml'
  pull_request:
    paths:
      - 'system/security/file-catalog-trust-state-store.mjs'
      - 'system/security/file-catalog-trust-state-store.selftest.mjs'
      - 'system/security/system-catalog-authorization.mjs'
      - 'system/contracts/catalog-trust-state.schema.json'
      - 'system/SWIR-SYSTEM-CATALOG-TRUST-STATE-0.1.md'
      - '.github/workflows/system-catalog-trust-state-contract.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: |
          node --check system/security/file-catalog-trust-state-store.mjs
          node --check system/security/file-catalog-trust-state-store.selftest.mjs
          node --check system/security/system-catalog-authorization.mjs
      - name: Parse trust-state contract
        run: node -e "JSON.parse(require('fs').readFileSync('system/contracts/catalog-trust-state.schema.json','utf8'))"
      - name: Verify durable anti-rollback state
        run: node system/security/file-catalog-trust-state-store.selftest.mjs
