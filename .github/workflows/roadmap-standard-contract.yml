name: SWIR Roadmap Standard Contract

on:
  push:
    branches: [main]
    paths:
      - 'SWIR-OS-ARCHITECTURE.md'
      - 'SWIR-ROADMAP-STANDARD.md'
      - 'scripts/validate-swir-roadmap-progress.mjs'
      - '.github/workflows/roadmap-standard-contract.yml'
  pull_request:
    paths:
      - 'SWIR-OS-ARCHITECTURE.md'
      - 'SWIR-ROADMAP-STANDARD.md'
      - 'scripts/validate-swir-roadmap-progress.mjs'
      - '.github/workflows/roadmap-standard-contract.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check validator syntax
        run: node --check scripts/validate-swir-roadmap-progress.mjs

      - name: Validate roadmap dashboard and checklist math
        run: node scripts/validate-swir-roadmap-progress.mjs SWIR-OS-ARCHITECTURE.md SWIR-ROADMAP-STANDARD.md
