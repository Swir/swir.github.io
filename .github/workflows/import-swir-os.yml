name: One-time SWIR OS repository migration

on:
  push:
    paths:
      - ".github/workflows/import-swir-os.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: swir-os-repository-migration
  cancel-in-progress: false

env:
  MIGRATION_BASELINE: 3f6ed2812c435dca200b19492245d1dd656e7787
  MIGRATION_PHASE: "object-transfer"

jobs:
  migrate:
    if: github.repository == 'Swir/SWIR_OS'
    runs-on: ubuntu-latest
    steps:
      - name: Verify controlled source state
        shell: bash
        run: |
          set -euo pipefail
          git clone --mirror https://github.com/Swir/swir.github.io.git source-check.git
          cd source-check.git
          git merge-base --is-ancestor "$MIGRATION_BASELINE" refs/heads/main
          changed="$(git diff --name-only "$MIGRATION_BASELINE"..refs/heads/main)"
          if [[ "$changed" != ".github/workflows/import-swir-os.yml" ]]; then
            echo "Source moved outside the controlled migration anchor:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi

      - name: Transfer source Git objects through temporary tag
        if: env.MIGRATION_PHASE == 'object-transfer'
        env:
          DEST_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git clone --mirror https://github.com/Swir/swir.github.io.git source.git
          cd source.git
          actual_head="$(git rev-parse refs/heads/main)"
          git remote add destination "https://x-access-token:${DEST_TOKEN}@github.com/Swir/SWIR_OS.git"
          git push --force destination "refs/heads/main:refs/tags/swir-os-migration-source"
          echo "Transferred source Git objects for $actual_head through temporary migration tag."
