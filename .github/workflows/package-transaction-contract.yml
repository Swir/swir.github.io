name: SWIR Package Transaction Contract

on:
  push:
    branches: [main]
    paths:
      - 'swir-install-pipeline.js'
      - 'scripts/validate-package-transactions.mjs'
      - 'SWIR-PACKAGE-TRANSACTIONS-1.0.md'
      - 'SWIR-OS-ARCHITECTURE.md'
      - '.github/workflows/package-transaction-contract.yml'
  pull_request:
    paths:
      - 'swir-install-pipeline.js'
      - 'scripts/validate-package-transactions.mjs'
      - 'SWIR-PACKAGE-TRANSACTIONS-1.0.md'
      - 'SWIR-OS-ARCHITECTURE.md'
      - '.github/workflows/package-transaction-contract.yml'

concurrency:
  group: swir-package-transactions-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-package-transactions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check install pipeline
        run: node --check swir-install-pipeline.js
      - name: Verify journaled package transactions and rollback
        run: node scripts/validate-package-transactions.mjs
