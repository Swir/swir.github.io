name: System Debian Direct-Kernel VM E2E

on:
  push:
    branches: [main]
    paths:
      - 'system/e2e/debian13-direct-kernel-vm-e2e.sh'
      - 'system/image/system-base-debian-trixie.json'
      - 'system/image/debian-trixie-repository-trust-policy.json'
      - 'system/image/build-debian-trixie-rootfs.sh'
      - 'system/image/system-image-readiness*'
      - 'system/image/system-image-provisioning*'
      - 'system/image/system-peer-authorization-provisioning*'
      - 'system/image/validate-direct-kernel-boot-evidence.mjs'
      - 'system/contracts/system-image-readiness.schema.json'
      - 'system/contracts/system-direct-kernel-boot-e2e.schema.json'
      - 'system/runtime/windows-compat-runtime-registry.mjs'
      - 'system/ipc/swir-peer-authorization*'
      - 'system/ipc/90-swir-peer-authorization.preset'
      - 'system/security/org.swir.system.*.policy'
      - 'system/SWIR-DEBIAN-DIRECT-KERNEL-BOOT-E2E-0.1.md'
      - '.github/workflows/system-debian-direct-kernel-vm-e2e.yml'
  pull_request:
    paths:
      - 'system/e2e/debian13-direct-kernel-vm-e2e.sh'
      - 'system/image/system-base-debian-trixie.json'
      - 'system/image/debian-trixie-repository-trust-policy.json'
      - 'system/image/build-debian-trixie-rootfs.sh'
      - 'system/image/system-image-readiness*'
      - 'system/image/system-image-provisioning*'
      - 'system/image/system-peer-authorization-provisioning*'
      - 'system/image/validate-direct-kernel-boot-evidence.mjs'
      - 'system/contracts/system-image-readiness.schema.json'
      - 'system/contracts/system-direct-kernel-boot-e2e.schema.json'
      - 'system/runtime/windows-compat-runtime-registry.mjs'
      - 'system/ipc/swir-peer-authorization*'
      - 'system/ipc/90-swir-peer-authorization.preset'
      - 'system/security/org.swir.system.*.policy'
      - 'system/SWIR-DEBIAN-DIRECT-KERNEL-BOOT-E2E-0.1.md'
      - '.github/workflows/system-debian-direct-kernel-vm-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: system-debian-direct-kernel-vm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate contracts and security guards
        shell: bash
        run: |
          set -euo pipefail
          node --check system/image/system-image-readiness.mjs
          node --check system/image/system-image-readiness.selftest.mjs
          node --check system/image/validate-direct-kernel-boot-evidence.mjs
          node --check system/runtime/windows-compat-runtime-registry.mjs
          node system/image/system-image-readiness.selftest.mjs
          python3 -m json.tool system/contracts/system-image-readiness.schema.json >/dev/null
          python3 -m json.tool system/contracts/system-direct-kernel-boot-e2e.schema.json >/dev/null
          bash -n system/e2e/debian13-direct-kernel-vm-e2e.sh
          grep -F "'systemd-session-manager'" system/image/system-image-readiness.mjs >/dev/null
          grep -F 'wineRuntimeRegistryPassed' system/image/validate-direct-kernel-boot-evidence.mjs >/dev/null
          grep -F 'bootableImageClaim: false' system/e2e/debian13-direct-kernel-vm-e2e.sh >/dev/null
          grep -F 'bootloaderE2EClaim: false' system/e2e/debian13-direct-kernel-vm-e2e.sh >/dev/null
          ! grep -E 'qemu-system-x86_64.*-net (nic|user|tap|bridge)|curl |wget |--no-check-gpg|AllowUnauthenticated|trusted=yes' system/e2e/debian13-direct-kernel-vm-e2e.sh

  boot-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install controlled build and VM dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mmdebstrap debian-archive-keyring qemu-system-x86 qemu-utils e2fsprogs rsync
      - name: Boot disposable Debian 13 System foundation
        env:
          SWIR_VM_WORK_ROOT: ${{ runner.temp }}/swir-debian13-direct-kernel-vm
          SWIR_VM_ARTIFACT_DIR: ${{ runner.temp }}/swir-debian13-direct-kernel-vm-artifacts
        run: sudo --preserve-env=SWIR_VM_WORK_ROOT,SWIR_VM_ARTIFACT_DIR bash system/e2e/debian13-direct-kernel-vm-e2e.sh
      - name: Export readable diagnostics
        if: always()
        run: sudo chown -R "$USER:$USER" "${{ runner.temp }}/swir-debian13-direct-kernel-vm-artifacts" 2>/dev/null || true
      - name: Validate emitted evidence
        if: success()
        run: node system/image/validate-direct-kernel-boot-evidence.mjs "${{ runner.temp }}/swir-debian13-direct-kernel-vm-artifacts/direct-kernel-boot-evidence.json"
      - name: Upload compact VM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swir-debian13-direct-kernel-vm-e2e-${{ github.run_id }}
          path: ${{ runner.temp }}/swir-debian13-direct-kernel-vm-artifacts
          if-no-files-found: warn
          retention-days: 7
