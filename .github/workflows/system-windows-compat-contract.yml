name: System Windows Compatibility Contract

on:
  push:
    branches: [main]
    paths:
      - 'system/runtime/windows-compatibility-service.mjs'
      - 'system/runtime/windows-compatibility-service.selftest.mjs'
      - 'system/runtime/validate-windows-compatibility-contract.mjs'
      - 'system/contracts/windows-compat-launch.schema.json'
      - 'system/contracts/package-provider.schema.json'
      - 'system/contracts/trusted-sources.json'
      - 'system/SWIR-WINDOWS-COMPATIBILITY-0.1.md'
      - '.github/workflows/system-windows-compat-contract.yml'
  pull_request:
    paths:
      - 'system/runtime/windows-compatibility-service.mjs'
      - 'system/runtime/windows-compatibility-service.selftest.mjs'
      - 'system/runtime/validate-windows-compatibility-contract.mjs'
      - 'system/contracts/windows-compat-launch.schema.json'
      - 'system/contracts/package-provider.schema.json'
      - 'system/contracts/trusted-sources.json'
      - 'system/SWIR-WINDOWS-COMPATIBILITY-0.1.md'
      - '.github/workflows/system-windows-compat-contract.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: |
          node --check system/runtime/windows-compatibility-service.mjs
          node --check system/runtime/windows-compatibility-service.selftest.mjs
          node --check system/runtime/validate-windows-compatibility-contract.mjs

      - name: Validate compatibility contracts and trust boundaries
        run: node system/runtime/validate-windows-compatibility-contract.mjs

      - name: Run guarded Wine/Proton compatibility self-tests
        run: node system/runtime/windows-compatibility-service.selftest.mjs

      - name: Parse compatibility JSON contract
        run: |
          node -e "JSON.parse(require('fs').readFileSync('system/contracts/windows-compat-launch.schema.json','utf8')); console.log('Windows compatibility JSON contract: OK')"
