name: System Package Transaction Contract

on:
  push:
    branches: [main]
    paths:
      - 'system/packages/package-transaction-service.mjs'
      - 'system/packages/package-transaction-service.selftest.mjs'
      - 'system/packages/privileged-package-executor.mjs'
      - 'system/packages/privileged-package-executor.selftest.mjs'
      - 'system/packages/validate-package-transaction-service.mjs'
      - 'system/contracts/package-transaction-journal.schema.json'
      - 'system/contracts/distribution-package-plan.schema.json'
      - 'system/packages/distribution-package-provider.mjs'
      - 'system/SWIR-SYSTEM-PACKAGE-TRANSACTIONS-0.1.md'
      - '.github/workflows/system-package-transaction-contract.yml'
  pull_request:
    paths:
      - 'system/packages/package-transaction-service.mjs'
      - 'system/packages/package-transaction-service.selftest.mjs'
      - 'system/packages/privileged-package-executor.mjs'
      - 'system/packages/privileged-package-executor.selftest.mjs'
      - 'system/packages/validate-package-transaction-service.mjs'
      - 'system/contracts/package-transaction-journal.schema.json'
      - 'system/contracts/distribution-package-plan.schema.json'
      - 'system/packages/distribution-package-provider.mjs'
      - 'system/SWIR-SYSTEM-PACKAGE-TRANSACTIONS-0.1.md'
      - '.github/workflows/system-package-transaction-contract.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: |
          node --check system/packages/package-transaction-service.mjs
          node --check system/packages/package-transaction-service.selftest.mjs
          node --check system/packages/privileged-package-executor.mjs
          node --check system/packages/privileged-package-executor.selftest.mjs
          node --check system/packages/validate-package-transaction-service.mjs

      - name: Parse package transaction contract
        run: node -e "JSON.parse(require('fs').readFileSync('system/contracts/package-transaction-journal.schema.json','utf8')); JSON.parse(require('fs').readFileSync('system/contracts/distribution-package-plan.schema.json','utf8')); console.log('Package transaction JSON contracts: OK')"

      - name: Enforce package transaction security boundaries
        run: node system/packages/validate-package-transaction-service.mjs

      - name: Run package transaction lifecycle self-tests
        run: node system/packages/package-transaction-service.selftest.mjs

      - name: Run guarded pkexec executor self-tests
        run: node system/packages/privileged-package-executor.selftest.mjs

      - name: Re-run distribution provider contract
        run: |
          node system/packages/validate-distribution-package-provider.mjs
          node system/packages/distribution-package-provider.selftest.mjs
