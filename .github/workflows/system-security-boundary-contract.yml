name: System Security Boundary Contract

on:
  push:
    branches: [main]
    paths:
      - 'system/security/**'
      - 'system/network/networkmanager-service.selftest.mjs'
      - 'system/firmware/fwupd-firmware-transaction-service.selftest.mjs'
      - 'system/contracts/system-authorization-grant.schema.json'
      - 'system/contracts/repository-trust-policy.schema.json'
      - 'system/contracts/repository-trust-proof.schema.json'
      - '.github/workflows/system-security-boundary-contract.yml'
  pull_request:
    paths:
      - 'system/security/**'
      - 'system/network/networkmanager-service.selftest.mjs'
      - 'system/firmware/fwupd-firmware-transaction-service.selftest.mjs'
      - 'system/contracts/system-authorization-grant.schema.json'
      - 'system/contracts/repository-trust-policy.schema.json'
      - 'system/contracts/repository-trust-proof.schema.json'
      - '.github/workflows/system-security-boundary-contract.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check security boundary syntax
        run: |
          node --check system/security/polkit-authorization-broker.mjs
          node --check system/security/polkit-network-authorization-broker.mjs
          node --check system/security/polkit-firmware-authorization-broker.mjs
          node --check system/security/polkit-authorization-broker.selftest.mjs
          node --check system/security/distribution-repository-trust.mjs
          node --check system/security/distribution-repository-trust.selftest.mjs
          node --check system/security/system-package-security-boundary.mjs
          node --check system/security/system-package-security-boundary.selftest.mjs
          node --check system/security/validate-system-security-boundary.mjs
          node --check system/security/system-security-host-probe.mjs
          node --check system/network/networkmanager-service.selftest.mjs
          node --check system/firmware/fwupd-firmware-transaction-service.selftest.mjs

      - name: Parse all native Polkit policy XML
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          for file in (
              'system/security/org.swir.system.packages.policy',
              'system/security/org.swir.system.network.policy',
              'system/security/org.swir.system.firmware.policy',
          ):
              ET.parse(file)
              print('XML OK:', file)
          PY

      - name: Validate cross-domain policy and contracts
        run: node system/security/validate-system-security-boundary.mjs

      - name: Run package Polkit broker self-tests
        run: node system/security/polkit-authorization-broker.selftest.mjs

      - name: Run network Polkit binding self-tests
        run: node system/network/networkmanager-service.selftest.mjs

      - name: Run firmware Polkit and recovery self-tests
        run: node system/firmware/fwupd-firmware-transaction-service.selftest.mjs

      - name: Run distribution repository trust self-tests
        run: node system/security/distribution-repository-trust.selftest.mjs

      - name: Run composed package security boundary self-tests
        run: node system/security/system-package-security-boundary.selftest.mjs

      - name: Probe CI host security assumptions read-only
        shell: bash
        run: |
          node system/security/system-security-host-probe.mjs --compact > "$RUNNER_TEMP/swir-security-host.json"
          node -e "const r=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')); if(r.schema!=='swir.system-security-host-probe/0.1'||r.readOnly!==true||!r.distribution?.id||!Number.isInteger(r.subject?.pid)||!Array.isArray(r.policy?.availablePackageManagers)) process.exit(1); for(const item of Object.values(r.binaries)){if(item.available&&(item.rootOwned!==true||item.writableByGroupOrWorld!==false)) process.exit(1)} console.log('Security host probe:', r.distribution.prettyName, 'pkcheck=', r.policy.pkcheckSuitable, 'pkg=', r.policy.availablePackageManagers.join(','))" "$RUNNER_TEMP/swir-security-host.json"

      - name: Parse security contract JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('system/contracts/system-authorization-grant.schema.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('system/contracts/repository-trust-policy.schema.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('system/contracts/repository-trust-proof.schema.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('system/security/repository-trust-policy.example.json','utf8'))"

      - name: Guard privileged broker regressions
        shell: bash
        run: |
          ! grep -R --line-number -E 'shell:[[:space:]]*true' system/security/polkit-authorization-broker.mjs system/security/polkit-network-authorization-broker.mjs system/security/polkit-firmware-authorization-broker.mjs
          ! grep -R --line-number -E '<allow_(any|inactive|active)>[[:space:]]*yes[[:space:]]*</allow_' system/security/org.swir.system.*.policy
