name: System AppImage Provider Contract

on:
  push:
    branches: [main]
    paths:
      - 'system/packages/appimage-user-package-provider.mjs'
      - 'system/packages/appimage-user-package-provider.selftest.mjs'
      - 'system/packages/package-provider-layer.mjs'
      - 'system/packages/package-provider-layer.selftest.mjs'
      - 'system/contracts/package-provider.schema.json'
      - 'system/e2e/appimage-native-execution.selftest.mjs'
      - 'system/SWIR-APPIMAGE-PROVIDER-0.1.md'
      - '.github/workflows/system-appimage-provider-contract.yml'
  pull_request:
    paths:
      - 'system/packages/appimage-user-package-provider.mjs'
      - 'system/packages/appimage-user-package-provider.selftest.mjs'
      - 'system/packages/package-provider-layer.mjs'
      - 'system/packages/package-provider-layer.selftest.mjs'
      - 'system/contracts/package-provider.schema.json'
      - 'system/e2e/appimage-native-execution.selftest.mjs'
      - 'system/SWIR-APPIMAGE-PROVIDER-0.1.md'
      - '.github/workflows/system-appimage-provider-contract.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax and schema JSON
        run: |
          node --check system/packages/appimage-user-package-provider.mjs
          node --check system/packages/appimage-user-package-provider.selftest.mjs
          node --check system/packages/package-provider-layer.mjs
          node --check system/packages/package-provider-layer.selftest.mjs
          node --check system/e2e/appimage-native-execution.selftest.mjs
          node -e "JSON.parse(require('fs').readFileSync('system/contracts/package-provider.schema.json','utf8'))"
      - name: Run AppImage lifecycle self-test
        run: node system/packages/appimage-user-package-provider.selftest.mjs
      - name: Run common provider layer self-test
        run: node system/packages/package-provider-layer.selftest.mjs
      - name: Run managed AppImage to native execution integration
        run: node system/e2e/appimage-native-execution.selftest.mjs
      - name: Enforce AppImage trust boundary
        run: |
          node -e "const fs=require('fs');const s=fs.readFileSync('system/packages/appimage-user-package-provider.mjs','utf8');for(const required of ['arbitraryDownloadUrls: false','signatureVerificationRequired: true','digestVerificationRequired: true','journalRequired: true','rollbackImplemented: true','formatProvidesSandbox: false'])if(!s.includes(required))throw new Error('AppImage invariant missing: '+required);if(/https?:\/\//.test(s))throw new Error('AppImage provider must not embed network acquisition URLs');console.log('AppImage trust boundary: OK')"
