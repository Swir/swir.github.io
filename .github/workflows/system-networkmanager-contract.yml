name: System NetworkManager Contract

on:
  push:
    branches: [main]
    paths:
      - 'system/network/**'
      - 'system/security/polkit-network-authorization-broker.mjs'
      - 'system/security/org.swir.system.network.policy'
      - 'system/contracts/networkmanager-inventory.schema.json'
      - 'system/SWIR-NETWORKMANAGER-INTEGRATION-0.1.md'
      - '.github/workflows/system-networkmanager-contract.yml'
  pull_request:
    paths:
      - 'system/network/**'
      - 'system/security/polkit-network-authorization-broker.mjs'
      - 'system/security/org.swir.system.network.policy'
      - 'system/contracts/networkmanager-inventory.schema.json'
      - 'system/SWIR-NETWORKMANAGER-INTEGRATION-0.1.md'
      - '.github/workflows/system-networkmanager-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  networkmanager-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check system/network/networkmanager-service.mjs
          node --check system/network/networkmanager-service.selftest.mjs
          node --check system/security/polkit-network-authorization-broker.mjs
      - name: Contract JSON parse
        run: |
          node -e "JSON.parse(require('fs').readFileSync('system/contracts/networkmanager-inventory.schema.json','utf8')); console.log('network schema JSON OK')"
      - name: Polkit policy XML parse
        run: |
          python -c "import xml.etree.ElementTree as ET; ET.parse('system/security/org.swir.system.network.policy'); print('network Polkit policy XML OK')"
      - name: NetworkManager adapter self-test
        run: node system/network/networkmanager-service.selftest.mjs
      - name: Guard forbidden secret and shell surfaces
        shell: bash
        run: |
          ! grep -R --line-number -- '--show-secrets' system/network/networkmanager-service.mjs system/security/polkit-network-authorization-broker.mjs
          ! grep -R --line-number -E 'device[[:space:]]+wifi[[:space:]]+connect|connection[[:space:]]+(add|modify|delete)' system/network/networkmanager-service.mjs
          ! grep -R --line-number -E 'shell:[[:space:]]*true' system/network system/security/polkit-network-authorization-broker.mjs
