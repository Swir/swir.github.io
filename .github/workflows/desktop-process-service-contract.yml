name: Desktop Process Service Contract

on:
  push:
    branches: [ main ]
    paths:
      - 'desktop/windows/DesktopProcessServiceBroker.cs'
      - 'desktop/windows/DesktopProcessServiceBrokerSelfTests.cs'
      - 'desktop/windows/SWIR.Desktop.ProcessService.SelfTests.csproj'
      - 'desktop/windows/Program.cs'
      - 'desktop/windows/PermissionBroker.cs'
      - 'desktop/windows/validate-process-service-integration.mjs'
      - 'desktop/windows/validate-process-service-ui.mjs'
      - 'swir-runtime.js'
      - 'swir-taskmgr.html'
      - 'swir-services.html'
      - 'sw.js'
      - '.github/workflows/desktop-process-service-contract.yml'
  pull_request:
    paths:
      - 'desktop/windows/DesktopProcessServiceBroker.cs'
      - 'desktop/windows/DesktopProcessServiceBrokerSelfTests.cs'
      - 'desktop/windows/SWIR.Desktop.ProcessService.SelfTests.csproj'
      - 'desktop/windows/Program.cs'
      - 'desktop/windows/PermissionBroker.cs'
      - 'desktop/windows/validate-process-service-integration.mjs'
      - 'desktop/windows/validate-process-service-ui.mjs'
      - 'swir-runtime.js'
      - 'swir-taskmgr.html'
      - 'swir-services.html'
      - 'sw.js'
      - '.github/workflows/desktop-process-service-contract.yml'
  workflow_dispatch:

jobs:
  process-service-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          node --check swir-runtime.js
          node --check sw.js
          node --check desktop/windows/validate-process-service-integration.mjs
          node --check desktop/windows/validate-process-service-ui.mjs
      - name: Validate Host process service integration
        run: node desktop/windows/validate-process-service-integration.mjs
      - name: Validate Task Manager native integration
        run: node desktop/windows/validate-process-service-ui.mjs
      - name: Build process service self-tests
        run: dotnet build desktop/windows/SWIR.Desktop.ProcessService.SelfTests.csproj -c Release --nologo
      - name: Run process service self-tests
        run: dotnet run --project desktop/windows/SWIR.Desktop.ProcessService.SelfTests.csproj -c Release --no-build
      - name: Build shipping Desktop Host
        run: dotnet build desktop/windows/SWIR.Desktop.Host.csproj -c Release --nologo
