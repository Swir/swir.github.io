name: System Windows Runtime Registry Contract

on:
  push:
    branches: [main]
    paths:
      - 'system/runtime/windows-compatibility-service.mjs'
      - 'system/runtime/windows-compat-runtime-registry.mjs'
      - 'system/runtime/windows-compat-runtime-registry.selftest.mjs'
      - 'system/runtime/managed-windows-compatibility-stack.mjs'
      - 'system/runtime/managed-windows-compatibility-stack.selftest.mjs'
      - 'system/SWIR-MANAGED-WINDOWS-COMPAT-RUNTIME-0.1.md'
      - '.github/workflows/system-windows-runtime-registry-contract.yml'
  pull_request:
    paths:
      - 'system/runtime/windows-compatibility-service.mjs'
      - 'system/runtime/windows-compat-runtime-registry.mjs'
      - 'system/runtime/windows-compat-runtime-registry.selftest.mjs'
      - 'system/runtime/managed-windows-compatibility-stack.mjs'
      - 'system/runtime/managed-windows-compatibility-stack.selftest.mjs'
      - 'system/SWIR-MANAGED-WINDOWS-COMPAT-RUNTIME-0.1.md'
      - '.github/workflows/system-windows-runtime-registry-contract.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check runtime registry syntax
        run: |
          node --check system/runtime/windows-compat-runtime-registry.mjs
          node --check system/runtime/windows-compat-runtime-registry.selftest.mjs
          node --check system/runtime/managed-windows-compatibility-stack.mjs
          node --check system/runtime/managed-windows-compatibility-stack.selftest.mjs
          node --check system/runtime/windows-compatibility-service.mjs

      - name: Run trusted runtime discovery self-test
        run: node system/runtime/windows-compat-runtime-registry.selftest.mjs

      - name: Run managed compatibility composition self-test
        run: node system/runtime/managed-windows-compatibility-stack.selftest.mjs

      - name: Re-run Windows compatibility service contract
        run: |
          node system/runtime/validate-windows-compatibility-contract.mjs
          node system/runtime/windows-compatibility-service.selftest.mjs

      - name: Enforce production trust defaults
        run: |
          node -e "const fs=require('fs');const r=fs.readFileSync('system/runtime/windows-compat-runtime-registry.mjs','utf8');const s=fs.readFileSync('system/runtime/managed-windows-compatibility-stack.mjs','utf8');if(!r.includes('rootOwnershipRequiredByDefault: true')||!r.includes('groupWorldWritableRejected: true')||!r.includes('arbitraryDownloads: false'))throw new Error('Runtime registry trust policy weakened');if(!s.includes('requireRootOwned: true')||!s.includes('arbitraryRuntimeDownloadAllowed: false'))throw new Error('Managed compatibility production defaults weakened');console.log('Managed compatibility production trust defaults: OK')"
