name: SWIR Signed Catalog Contract

on:
  push:
    branches: [main]
    paths:
      - 'swir-packages.js'
      - 'swir-catalog-integrity.js'
      - 'swir-trusted-keys.js'
      - 'swir-v17.js'
      - 'sw.js'
      - 'scripts/validate-signed-catalog.mjs'
      - 'SWIR-SIGNED-CATALOG-1.0.md'
      - '.github/workflows/signed-catalog-contract.yml'
  pull_request:
    paths:
      - 'swir-packages.js'
      - 'swir-catalog-integrity.js'
      - 'swir-trusted-keys.js'
      - 'swir-v17.js'
      - 'sw.js'
      - 'scripts/validate-signed-catalog.mjs'
      - 'SWIR-SIGNED-CATALOG-1.0.md'
      - '.github/workflows/signed-catalog-contract.yml'

concurrency:
  group: swir-signed-catalog-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-signed-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check catalog verifier
        run: node --check swir-catalog-integrity.js
      - name: Verify signed catalog cryptographic contract
        run: node scripts/validate-signed-catalog.mjs
