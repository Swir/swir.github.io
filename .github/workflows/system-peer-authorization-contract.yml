name: System Peer Authorization Contract

on:
  push:
    branches: [main]
    paths:
      - 'system/ipc/**'
      - 'system/security/peer-package-security-boundary*'
      - 'system/image/system-peer-authorization-provisioning*'
      - 'system/contracts/peer-authorization-envelope.schema.json'
      - 'system/SWIR-PEER-AUTHORIZATION-BROKER-0.1.md'
      - 'system/SWIR-SYSTEM-SECURITY-BOUNDARY-0.1.md'
      - 'system/SWIR-SYSTEM-IMAGE-PROVISIONING-0.1.md'
      - '.github/workflows/system-peer-authorization-contract.yml'
  pull_request:
    paths:
      - 'system/ipc/**'
      - 'system/security/peer-package-security-boundary*'
      - 'system/image/system-peer-authorization-provisioning*'
      - 'system/contracts/peer-authorization-envelope.schema.json'
      - 'system/SWIR-PEER-AUTHORIZATION-BROKER-0.1.md'
      - 'system/SWIR-SYSTEM-SECURITY-BOUNDARY-0.1.md'
      - 'system/SWIR-SYSTEM-IMAGE-PROVISIONING-0.1.md'
      - '.github/workflows/system-peer-authorization-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: system-peer-authorization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  peer-authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Runtime versions
        run: |
          node --version
          python3 --version

      - name: Syntax and contract parsing
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile system/ipc/swir-peer-authorization-broker.py
          node --check system/ipc/peer-authorization-grant.mjs
          node --check system/ipc/peer-authorization-grant.selftest.mjs
          node --check system/ipc/peer-authorization-e2e.selftest.mjs
          node --check system/security/peer-package-security-boundary.mjs
          node --check system/security/peer-package-security-boundary.selftest.mjs
          node --check system/image/system-peer-authorization-provisioning.mjs
          node --check system/image/system-peer-authorization-provisioning.selftest.mjs
          node -e "JSON.parse(require('fs').readFileSync('system/contracts/peer-authorization-envelope.schema.json','utf8')); console.log('Peer envelope schema: OK')"

      - name: Grant verifier and domain adapters
        run: node system/ipc/peer-authorization-grant.selftest.mjs

      - name: Peer-authorized package composition
        run: node system/security/peer-package-security-boundary.selftest.mjs

      - name: Rootfs peer broker provisioning
        run: node system/image/system-peer-authorization-provisioning.selftest.mjs

      - name: Linux SO_PEERCRED to Polkit grant E2E
        run: node system/ipc/peer-authorization-e2e.selftest.mjs

      - name: systemd unit verification
        shell: bash
        run: |
          set -euo pipefail
          test ! -e /usr/libexec/swir/swir-peer-authorization-broker
          sudo install -D -m 0755 system/ipc/swir-peer-authorization-broker.py /usr/libexec/swir/swir-peer-authorization-broker
          trap 'sudo rm -f /usr/libexec/swir/swir-peer-authorization-broker; sudo rmdir /usr/libexec/swir 2>/dev/null || true' EXIT
          systemd-analyze verify system/ipc/swir-peer-authorization.socket system/ipc/swir-peer-authorization.service
          grep -Fx 'd /run/swir 0755 root root - -' system/ipc/swir-peer-authorization.tmpfiles.conf
          grep -Fx 'enable swir-peer-authorization.socket' system/ipc/90-swir-peer-authorization.preset

      - name: Fail-closed production pins
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'DEFAULT_PKCHECK = "/usr/bin/pkcheck"' system/ipc/swir-peer-authorization-broker.py
          grep -F 'DEFAULT_LOGINCTL = "/usr/bin/loginctl"' system/ipc/swir-peer-authorization-broker.py
          grep -F 'uid <= 0' system/ipc/swir-peer-authorization-broker.py
          grep -F 'callerSuppliedUnixIdentity: false' system/ipc/peer-authorization-grant.mjs
          grep -F 'runtimeKeyEmbeddedInImage: false' system/image/system-peer-authorization-provisioning.mjs
