name: System Image Readiness Contract

on:
  push:
    branches: [main]
    paths:
      - 'system/image/**'
      - 'system/contracts/system-image-readiness.schema.json'
      - 'system/SWIR-SYSTEM-IMAGE-READINESS-0.1.md'
      - '.github/workflows/system-image-readiness-contract.yml'
  pull_request:
    paths:
      - 'system/image/**'
      - 'system/contracts/system-image-readiness.schema.json'
      - 'system/SWIR-SYSTEM-IMAGE-READINESS-0.1.md'
      - '.github/workflows/system-image-readiness-contract.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: |
          node --check system/image/system-image-readiness.mjs
          node --check system/image/system-image-readiness.selftest.mjs
          node --check system/image/system-image-readiness-probe.mjs
      - name: Parse readiness contract
        run: node -e "JSON.parse(require('fs').readFileSync('system/contracts/system-image-readiness.schema.json','utf8'))"
      - name: Verify readiness evaluator
        run: node system/image/system-image-readiness.selftest.mjs
      - name: Probe runner without mutation
        run: |
          node system/image/system-image-readiness-probe.mjs --compact > "$RUNNER_TEMP/swir-system-image-readiness.json"
          node -e "const r=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')); if(r.schema!=='swir.system-image-readiness/0.1'||r.readOnly!==true||!Array.isArray(r.gates)||!Array.isArray(r.summary?.blockers)||r.summary.requiredTotal<1) process.exit(1); console.log('System image readiness:', r.summary.requiredPassed + '/' + r.summary.requiredTotal, 'blockers=', r.summary.blockers.join(',') || 'none')" "$RUNNER_TEMP/swir-system-image-readiness.json"
