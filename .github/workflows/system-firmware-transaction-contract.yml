name: System Firmware Transaction Contract

on:
  push:
    branches: [main]
    paths:
      - 'system/firmware/**'
      - 'system/hardware/fwupd-lvfs-service.mjs'
      - 'system/security/polkit-firmware-authorization-broker.mjs'
      - 'system/security/org.swir.system.firmware.policy'
      - 'system/contracts/firmware-transaction-journal.schema.json'
      - 'system/SWIR-FIRMWARE-TRANSACTION-BROKER-0.1.md'
      - 'system/SWIR-FWUPD-LVFS-INTEGRATION-0.1.md'
      - '.github/workflows/system-firmware-transaction-contract.yml'
  pull_request:
    paths:
      - 'system/firmware/**'
      - 'system/hardware/fwupd-lvfs-service.mjs'
      - 'system/security/polkit-firmware-authorization-broker.mjs'
      - 'system/security/org.swir.system.firmware.policy'
      - 'system/contracts/firmware-transaction-journal.schema.json'
      - 'system/SWIR-FIRMWARE-TRANSACTION-BROKER-0.1.md'
      - 'system/SWIR-FWUPD-LVFS-INTEGRATION-0.1.md'
      - '.github/workflows/system-firmware-transaction-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware-transaction-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check system/firmware/fwupd-firmware-transaction-service.mjs
          node --check system/firmware/fwupd-firmware-transaction-service.selftest.mjs
          node --check system/security/polkit-firmware-authorization-broker.mjs
          node --check system/hardware/fwupd-lvfs-service.mjs
      - name: Contract JSON parse
        run: |
          node -e "JSON.parse(require('fs').readFileSync('system/contracts/firmware-transaction-journal.schema.json','utf8')); console.log('firmware journal schema JSON OK')"
      - name: Polkit policy XML parse
        run: |
          python -c "import xml.etree.ElementTree as ET; ET.parse('system/security/org.swir.system.firmware.policy'); print('firmware Polkit policy XML OK')"
      - name: Existing LVFS discovery self-test
        run: node system/hardware/fwupd-lvfs-service.selftest.mjs
      - name: Firmware transaction self-test
        run: node system/firmware/fwupd-firmware-transaction-service.selftest.mjs
      - name: Guard source and executor policy
        shell: bash
        run: |
          grep -q "remoteId === 'lvfs'" system/firmware/fwupd-firmware-transaction-service.mjs
          grep -q "automaticRollbackClaimed: false" system/firmware/fwupd-firmware-transaction-service.mjs
          ! grep -R --line-number -E "'--force'|'--allow-older'|'local-install'" system/firmware/fwupd-firmware-transaction-service.mjs
          ! grep -R --line-number -E 'shell:[[:space:]]*true' system/firmware system/security/polkit-firmware-authorization-broker.mjs
