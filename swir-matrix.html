<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SWIR Matrix</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#000;color:#59ff8a;font-family:Consolas,monospace;overflow:hidden}canvas{position:fixed;inset:0;width:100%;height:100%}.panel{position:fixed;left:18px;bottom:18px;width:min(520px,calc(100vw - 36px));padding:14px;border:1px solid #184f2a;background:rgba(0,10,3,.78);backdrop-filter:blur(8px);box-shadow:0 0 40px #00ff4422}.title{font-weight:900;letter-spacing:.12em}.sub{color:#2e9b51;font-size:11px;margin-top:4px}.row{display:flex;gap:8px;margin-top:10px}.row input{flex:1;border:1px solid #184f2a;background:#020703;color:#75ff9d;padding:9px;font:12px Consolas,monospace;outline:none}.row button{border:1px solid #184f2a;background:#07170b;color:#75ff9d;padding:9px 12px;font:700 11px Consolas,monospace;cursor:pointer}.log{margin-top:10px;max-height:120px;overflow:auto;color:#3aba61;font-size:11px;white-space:pre-wrap}</style></head><body><canvas id="cv"></canvas><section class="panel"><div class="title">SWIR MATRIX // NATIVE CORE</div><div class="sub">Own digital-rain renderer. Commands: SPEED 1-5, DENSITY 1-5, COLOR GREEN|BLUE|PURPLE, CLEAR, HELP</div><div class="row"><input id="cmd" placeholder="matrix@swir:~$" autocomplete="off"><button id="run">RUN</button></div><div id="log" class="log">SYSTEM ONLINE
</div></section><script>const c=cv,x=c.getContext('2d'),cmd=document.getElementById('cmd'),log=document.getElementById('log');let speed=1,density=1,color='#59ff8a',drops=[],font=16;function resize(){const dpr=Math.min(2,devicePixelRatio||1);c.width=innerWidth*dpr;c.height=innerHeight*dpr;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';x.setTransform(dpr,0,0,dpr,0,0);const cols=Math.ceil(innerWidth/font);drops=Array.from({length:cols},()=>Math.random()*-50)}addEventListener('resize',resize);resize();const chars='01SWIRNEONCOREアイウエオカキクケコ<>/\\{}[]*+-';function draw(){x.fillStyle='rgba(0,0,0,'+(0.08/density)+')';x.fillRect(0,0,innerWidth,innerHeight);x.font=font+'px Consolas';x.fillStyle=color;for(let i=0;i<drops.length;i++){const ch=chars[(Math.random()*chars.length)|0];x.fillText(ch,i*font,drops[i]*font);if(drops[i]*font>innerHeight&&Math.random()>.975/density)drops[i]=0;drops[i]+=speed}requestAnimationFrame(draw)}draw();function p(t){log.textContent+=t+'\n';log.scrollTop=log.scrollHeight}function exec(){const v=cmd.value.trim(),u=v.toUpperCase();if(!v)return;p('> '+v);if(u==='HELP')p('SPEED 1-5 | DENSITY 1-5 | COLOR GREEN|BLUE|PURPLE | CLEAR');else if(u.startsWith('SPEED ')){const n=Math.max(1,Math.min(5,parseInt(v.split(/\s+/)[1])||1));speed=n;p('SPEED='+n)}else if(u.startsWith('DENSITY ')){const n=Math.max(1,Math.min(5,parseInt(v.split(/\s+/)[1])||1));density=n;p('DENSITY='+n)}else if(u.startsWith('COLOR ')){const n=u.split(/\s+/)[1];const map={GREEN:'#59ff8a',BLUE:'#59d8ff',PURPLE:'#d06cff'};if(map[n]){color=map[n];p('COLOR='+n)}else p('UNKNOWN COLOR')}else if(u==='CLEAR'){log.textContent=''}else p('COMMAND NOT FOUND');cmd.value=''}run.onclick=exec;cmd.addEventListener('keydown',e=>{if(e.key==='Enter')exec()});</script></body></html>
