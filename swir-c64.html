<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SWIR C64 Lab</title><style>:root{color-scheme:dark;--bg:#3c48a4;--fg:#aab7ff}*{box-sizing:border-box}body{margin:0;background:#141742;color:#fff;font-family:Consolas,monospace;min-height:100vh}.frame{max-width:980px;margin:auto;padding:18px}.screen{background:var(--bg);border:18px solid #23275d;box-shadow:0 20px 70px #0008;min-height:650px;padding:34px;color:var(--fg);font-size:18px;line-height:1.45}.head{white-space:pre-wrap}.out{white-space:pre-wrap;min-height:420px}.prompt{display:flex;gap:8px;align-items:center}.prompt input{flex:1;border:0;outline:0;background:transparent;color:var(--fg);font:inherit;text-transform:none}.hint{margin-top:12px;color:#7d88da;font-size:12px}@media(max-width:700px){.frame{padding:0}.screen{border-width:10px;min-height:100vh;font-size:15px;padding:20px}}</style></head><body><main class="frame"><section class="screen"><div class="head">**** SWIR C64 LAB BASIC V1.0 ****
64K RAM SYSTEM  38911 BASIC BYTES FREE

READY.</div><div id="out" class="out"></div><div class="prompt"><span>█</span><input id="cmd" autocomplete="off" spellcheck="false" autofocus></div><div class="hint">HELP • LIST • RUN • PRINT text • COLOR n • TIME • CLS • DEMO • ABOUT</div></section></main><script>const out=document.getElementById('out'),cmd=document.getElementById('cmd');let program=['10 PRINT "SWIR OS"','20 PRINT "NEON CORE"','30 GOTO 10'],color=0;const palette=['#aab7ff','#8fffb5','#ffd479','#ff9bd5','#fff','#89eaff'];function print(t=''){out.textContent+=t+'\n';out.scrollTop=out.scrollHeight}function exec(raw){const v=raw.trim(),u=v.toUpperCase();print(v);if(!v)return;if(u==='HELP'){print('COMMANDS: LIST RUN PRINT COLOR TIME CLS DEMO ABOUT')}else if(u==='LIST'){program.forEach(print)}else if(u==='RUN'){print('SWIR OS');print('NEON CORE');print('READY.')}else if(u.startsWith('PRINT ')){print(v.slice(6))}else if(u.startsWith('COLOR ')){const n=parseInt(v.split(/\s+/)[1]);if(!Number.isNaN(n)){color=Math.abs(n)%palette.length;document.documentElement.style.setProperty('--fg',palette[color]);print('COLOR '+color)}else print('?SYNTAX ERROR')}else if(u==='TIME'){print(new Date().toLocaleString())}else if(u==='CLS'){out.textContent=''}else if(u==='DEMO'){demo()}else if(u==='ABOUT'){print('SWIR C64 LAB // ORIGINAL SWIR OS MODULE // NO ROM')}else if(/^\d+\s/.test(v)){const n=parseInt(v),rest=v.replace(/^\d+\s*/, '');program=program.filter(l=>parseInt(l)!==n);if(rest)program.push(n+' '+rest);program.sort((a,b)=>parseInt(a)-parseInt(b));}else print('?SYNTAX ERROR');print('READY.')}function demo(){const chars='SWIR64*+-=<>#';let rows=[];for(let y=0;y<12;y++){let s='';for(let x=0;x<34;x++)s+=chars[(x+y+Date.now()/200|0)%chars.length];rows.push(s)}print(rows.join('\n'))}cmd.addEventListener('keydown',e=>{if(e.key==='Enter'){exec(cmd.value);cmd.value=''}});</script></body></html>
